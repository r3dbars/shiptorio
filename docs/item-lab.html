<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shiptorio Item Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: item list on the left, a turntable stage in the middle, the item's card on the right; one-screen app */
:root {
  --void: #172042;
  --panel: #0e1329;
  --panel-line: #8d99c9;
  --ink: #eef1fa;
  --dim: #a9b2d4;
  --amber: #f2a93b;
  --green: #5bd18b;
  --red: #ff5e52;
  --blue: #6fb2ff;
  --chip-off: #1b2244;
  --chip-line: #3a4677;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
body { font-family: var(--mono); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }

.card { background: var(--panel); border: 2px solid var(--panel-line); outline: 2px solid #05070f; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
.ptitle { font-family: var(--pixel); font-weight: 700; letter-spacing: 0.08em; line-height: 1.05; margin: 0; }
.psub { font-size: 11px; line-height: 1.5; color: var(--dim); margin: 0; }
.eyebrow { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.1em; color: var(--dim); }
.tbtn { font-family: var(--pixel); font-size: 11px; letter-spacing: 0.06em; color: var(--ink); background: var(--chip-off); border: 2px solid var(--chip-line); min-height: 34px; padding: 0 10px; cursor: pointer; text-align: left; }
.tbtn[aria-pressed="true"] { background: var(--amber); border-color: #ffd28a; color: #1a1205; }
.tbtn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 4px; }

#top { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); flex-direction: row; align-items: center; gap: 14px; padding: 8px 12px; }
#top .ptitle { font-size: 18px; }

#list { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 210px; overflow-y: auto; }
#list .tbtn { width: 100%; display: flex; align-items: center; gap: 8px; }
.chip { width: 10px; height: 10px; flex: none; border: 1px solid #05070f; }

#card { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 300px; overflow-y: auto; gap: 12px; }
#card .ptitle { font-size: 24px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 11px; }
dt { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.06em; color: var(--dim); }
dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.section { display: flex; flex-direction: column; gap: 6px; border-top: 2px solid #232b52; padding-top: 10px; }
.section[hidden] { display: none !important; }

#labels { position: fixed; inset: 0; pointer-events: none; }
.label { position: absolute; left: 0; top: 0; background: var(--panel); border: 2px solid var(--panel-line); padding: 3px 7px 4px; white-space: nowrap; font-family: var(--pixel); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); cursor: pointer; pointer-events: auto; }
.label:hover, .label:focus-visible { border-color: var(--amber); outline: none; }

@media (max-width: 860px) {
  #list { bottom: auto; right: calc(14px + env(safe-area-inset-right, 0px)); width: auto; top: calc(70px + env(safe-area-inset-top, 0px)); flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px; }
  #list .eyebrow { display: none; }
  #list .tbtn { width: auto; flex: none; }
  #card { top: auto; left: calc(14px + env(safe-area-inset-left, 0px)); width: auto; max-height: 42vh; }
  #top { left: calc(14px + env(safe-area-inset-left, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); transform: none; justify-content: space-between; }
  #top .ptitle { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .tbtn { transition: none; } }
</style>

<canvas id="stage" aria-label="Shiptorio item rendered as pixel art on a floating pedestal"></canvas>
<div id="labels"></div>

<div id="top" class="card">
  <h1 class="ptitle">ITEM LAB</h1>
  <div class="row" role="group" aria-label="View">

<aside id="card" class="card" aria-live="polite">

  <div class="section" id="s-variant"><span class="eyebrow">VARIANT</span><div class="row" id="c-variants"></div></div>
  <div class="section"><span class="eyebrow">STAGE</span>
    <div class="row">
      <button class="tbtn" id="t-spin" aria-pressed="true">AUTO-SPIN</button>

    <p class="psub">Drag to turn the item. Scroll to zoom.</p>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- locked pixel settings (docs/ART.md) ----------
  const ART = { px: 2, levels: 32, dither: 0, outline: 0.35, thresh: 0.12, sat: 1.05, contrast: 1.05, yaw: 45, tilt: 30 };

  const canvas = $('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
  const target = new THREE.Vector3(0, 1, 0);
  let zoom = 1, viewH = 7;

  const rtex = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const post = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rtex.texture }, res: { value: new THREE.Vector2(2, 2) },
      levels: { value: ART.levels }, dither: { value: ART.dither }, outline: { value: ART.outline },
      thresh: { value: ART.thresh }, sat: { value: ART.sat }, contrast: { value: ART.contrast }
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform vec2 res; uniform float levels; uniform float dither; uniform float outline;',
      'uniform float thresh; uniform float sat; uniform float contrast;',
      'varying vec2 vUv;',
      'float b2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }',
      'float b4(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a); }',
      'float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }',
      'void main(){',
      '  vec2 p = floor(vUv * res); vec2 uv = (p + 0.5) / res; vec2 t = 1.0 / res;',
      '  vec3 c = texture2D(tDiffuse, uv).rgb; float l = lum(c);',
      '  float n = max(max(lum(texture2D(tDiffuse, uv + vec2(t.x, 0.0)).rgb), lum(texture2D(tDiffuse, uv - vec2(t.x, 0.0)).rgb)),',
      '               max(lum(texture2D(tDiffuse, uv + vec2(0.0, t.y)).rgb), lum(texture2D(tDiffuse, uv - vec2(0.0, t.y)).rgb)));',
      '  c *= 1.0 - outline * step(thresh, n - l);',
      '  c = mix(vec3(lum(c)), c, sat); c = (c - 0.5) * contrast + 0.5;',
      '  float d = (b4(p) - 0.5) * dither;',
      '  c = floor(c * levels + d + 0.5) / levels;',
      '  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });
  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); quad.frustumCulled = false; postScene.add(quad);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight, a = w / h;
    renderer.setSize(w, h, false);
    const vh = (a < 1 ? viewH * 1.35 / a : viewH) * zoom;
    cam.left = -vh * a / 2; cam.right = vh * a / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
    const px = Math.max(1, Math.min(ART.px, Math.round(ART.px / zoom)));
    rtex.setSize(Math.max(1, Math.ceil(w / px)), Math.max(1, Math.ceil(h / px)));
    post.uniforms.res.value.set(rtex.width, rtex.height);
  }

  const hemi = new THREE.HemisphereLight(0xd6deff, 0x40344a, 0.6); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d2, 0.95);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 90 });
  sun.shadow.bias = -0.0012;
  scene.add(sun, sun.target);
  let night = false;

  // ---------- helpers ----------
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cache = {};
  const mat = (c) => cache[c] || (cache[c] = new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 0, specular: 0 }));
  const own = (c, e) => new THREE.MeshPhongMaterial({ color: c, emissive: e || 0, flatShading: true, shininess: 0, specular: 0 });
  const basic = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: o !== undefined, opacity: o === undefined ? 1 : o });
  function mesh(geo, m, x, y, z, p) {
    const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
    o.position.set(x || 0, y || 0, z || 0); o.castShadow = o.receiveShadow = true;
    if (p) p.add(o); return o;
  }
  const box = (w, h, d, m, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
  const cyl = (a, b, h, m, s, x, y, z, p) => mesh(new THREE.CylinderGeometry(a, b, h, s || 8), m, x, y, z, p);
  const cone = (r, h, m, s, x, y, z, p) => mesh(new THREE.ConeGeometry(r, h, s || 8), m, x, y, z, p);
  const sph = (r, m, x, y, z, p, ws, hs) => mesh(new THREE.SphereGeometry(r, ws || 8, hs || 6), m, x, y, z, p);
  const rock = (r, m, x, y, z, p) => mesh(new THREE.DodecahedronGeometry(r, 0), m, x, y, z, p);
  const group = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); if (p) p.add(g); return g; };

  function bolts(p, w, d, y) { for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.09, 0.06, 0.09, 0x2b2f36, sx * (w / 2 - 0.12), y, sz * (d / 2 - 0.12), p); }
  function hazard(p, len, y, z, n) { const w = len / n; for (let i = 0; i < n; i++) box(w * 0.98, 0.05, 0.12, i % 2 ? 0x16120a : 0xf2a93b, -len / 2 + w * (i + 0.5), y, z, p); }
  function stackLight(p, x, y, z) {
    cyl(0.035, 0.035, 0.34, 0x3a3f47, 6, x, y + 0.17, z, p);
    const defs = [['g', 0x5bd18b, 0x173a26], ['a', 0xf2a93b, 0x3e2e12], ['r', 0xff5e52, 0x3e1714]];
    const lights = defs.map(([k, on, off], i) => ({ k, on, m: box(0.17, 0.13, 0.17, own(off), x, y + 0.4 + i * 0.14, z, p).material }));
    box(0.13, 0.04, 0.13, 0x2b2f36, x, y + 0.81, z, p);
    return { set(which, lit) { lights.forEach((L) => L.m.emissive.setHex(L.k === which && lit ? L.on : 0)); } };
  }

  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'));
    const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  const rep = (tex, x, y) => { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(x, y); return t; };
  const stoneTex = canvasTex(128, 128, (g) => {
    g.fillStyle = '#6c604e'; g.fillRect(0, 0, 128, 128);
    const tones = ['#c9b48a', '#bfa97f', '#d4c197', '#b49d72', '#c4b088'];
    for (let y = 0; y < 128; y += 16) { let x = -Math.floor(rnd() * 12); while (x < 128) { const w = 12 + Math.floor(rnd() * 20); g.fillStyle = tones[Math.floor(rnd() * 5)]; g.fillRect(x + 1, y + 1, w - 2, 14); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(x + 1, y + 13, w - 2, 2); x += w; } }
    for (let i = 0; i < 420; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(60,50,35,0.35)' : 'rgba(255,245,220,0.25)'; g.fillRect(Math.floor(rnd() * 128), Math.floor(rnd() * 128), 1, 1); }
  });
  const cliffTex = canvasTex(64, 128, (g) => {
    g.fillStyle = '#3a4268'; g.fillRect(0, 0, 64, 128);
    for (let i = 0; i < 34; i++) { g.fillStyle = rnd() < 0.5 ? '#465082' : '#2d3458'; g.fillRect(Math.floor(rnd() * 64), 0, 1 + Math.floor(rnd() * 3), 128); }
    g.fillStyle = '#4f7d3b'; g.fillRect(0, 0, 64, 8);
    for (let i = 0; i < 26; i++) { g.fillStyle = rnd() < 0.5 ? '#4f7d3b' : '#3e6630'; g.fillRect(Math.floor(rnd() * 64), 8, 2, 4 + Math.floor(rnd() * 26)); }
  });
  const beltTex = canvasTex(16, 16, (g) => {
    g.fillStyle = '#2b2f36'; g.fillRect(0, 0, 16, 16);
    g.fillStyle = '#4a505b'; g.fillRect(0, 2, 3, 12); g.fillRect(8, 2, 3, 12);
    g.fillStyle = '#1b1d22'; g.fillRect(0, 0, 16, 2); g.fillRect(0, 14, 16, 2);
  });
  function beltSurface(len, width, p, x, y, z) {
    const tex = rep(beltTex, len * 1.4, 1);
    const top = own(0xffffff); top.map = tex;
    const side = mat(0x1d2026);
    box(len, 0.08, width, [side, side, top, side, side, side], x, y, z, p);
    return tex;
  }
  function makeIsland(w, d, p) {
    const g = group(p);
    const top = own(0xffffff); top.map = rep(stoneTex, w / 4, d / 4);
    const moss = mat(0x4f7d3b), dark = mat(0x262c4a);
    box(w, 0.5, d, [moss, moss, top, moss, moss, moss], 0, -0.25, 0, g);
    const sx = own(0xffffff); sx.map = rep(cliffTex, d / 3.5, 1);
    const sz = own(0xffffff); sz.map = rep(cliffTex, w / 3.5, 1);
    box(w, 5, d, [sx, sx, dark, dark, sz, sz], 0, -3, 0, g);
    box(w * 0.65, 3, d * 0.65, [sx, sx, dark, dark, sz, sz], -w * 0.05, -7, -d * 0.05, g);
    for (let i = 0; i < 16; i++) { const ax = rnd() < 0.5; box(ax ? 0.22 : 0.1, 0.6 + rnd() * 1.8, ax ? 0.1 : 0.22, mat(rnd() < 0.5 ? 0x3e6630 : 0x4f7d3b), ax ? (rnd() - 0.5) * w : w / 2 + 0.05, -0.8 - rnd() * 0.6, ax ? d / 2 + 0.05 : (rnd() - 0.5) * d, g); }
    const leaf = [0xf08a24, 0xe0552f, 0xf2b13b, 0xc8442a];
    for (let i = 0; i < 18; i++) { const l = box(0.3, 0.03, 0.3, mat(leaf[i % 4]), (rnd() - 0.5) * w, 0.02, (rnd() - 0.5) * d, g); l.rotation.y = rnd() * 3; l.castShadow = false; }
    return g;
  }
  function pedestal(p, x, z, s) {
    const top = own(0xffffff); top.map = rep(stoneTex, 0.9 * s, 0.9 * s);
    const side = mat(0x8d7c5c);
    box(3.4 * s, 0.4, 3.4 * s, [side, side, top, side, side, side], x, 0.2, z, p);
    box(3.6 * s, 0.12, 3.6 * s, 0x6c604e, x, 0.06, z, p);
  }

  // ---------- particles ----------
  const fx = []; const fxGeo = new THREE.BoxGeometry(1, 1, 1);
  function spawn(p, x, y, z, vx, vy, vz, color, life, size, grav) {
    if (fx.length > 420) return;
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 }));
    m.position.set(x, y, z); m.scale.setScalar(size); p.add(m);
    fx.push({ m, p, vx, vy, vz, life, max: life, grav, size });
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life -= dt;
      if (f.life <= 0 || !f.p.parent) { f.p.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); continue; }
      f.vy -= f.grav * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      const k = f.life / f.max; f.m.material.opacity = Math.min(1, k * 1.6);
      if (f.grav < 0) f.m.scale.setScalar(f.size * (1 + (1 - k) * 1.5));
    }
  }
  const R = () => Math.random() - 0.5;

  // ---------- item builders: each returns { g, update(t, dt, state) } ----------
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  function keyframes(frames, p) {
    for (let i = 0; i < frames.length - 1; i++) {
      const a = frames[i], b = frames[i + 1];
      if (p <= b[0]) { const k = smooth((p - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); }
    }
    return frames[frames.length - 1].slice(1);
  }
  // a box of unit length along x, stretched between two points in the parent's xy plane
  function link(m, ax, ay, bx, by) { m.position.x = (ax + bx) / 2; m.position.y = (ay + by) / 2; m.rotation.z = Math.atan2(by - ay, bx - ax); m.scale.x = Math.hypot(bx - ax, by - ay); }
  function lathe(points, color, seg, x, y, z, p) {
    const m = own(color); m.side = THREE.DoubleSide;
    return mesh(new THREE.LatheGeometry(points.map(([r, h]) => new THREE.Vector2(r, h)), seg || 16), m, x, y, z, p);
  }
  function ladder(p, x, z, y0, h, ry) {
    const l = group(p, x, y0, z); l.rotation.y = ry || 0;
    box(0.03, h, 0.03, 0x3a3f47, -0.09, h / 2, 0, l); box(0.03, h, 0.03, 0x3a3f47, 0.09, h / 2, 0, l);
    for (let y = 0.15; y < h; y += 0.17) box(0.18, 0.025, 0.025, 0x3a3f47, 0, y, 0, l);
    return l;
  }
  function beacon(p, x, y, z) {
    cyl(0.08, 0.1, 0.06, 0x2b2f36, 8, x, y, z, p);
    const rot = group(p, x, y + 0.1, z);
    const lamp = box(0.12, 0.08, 0.05, own(0x3e1714), 0.03, 0, 0, rot);
    const dome = sph(0.1, basic(0xff5e52, 0.35), x, y + 0.1, z, p, 8, 6); dome.castShadow = false;
    return { update(dt, on) { rot.rotation.y += dt * (on ? 9 : 0); lamp.material.emissive.setHex(on ? 0xff5e52 : 0); dome.visible = on; } };
  }
  function robotArm(p, x, z, color) {
    const dark = new THREE.Color(color).multiplyScalar(0.55).getHex();
    const base = group(p, x, 0, z);
    cyl(0.26, 0.34, 0.2, 0x3a3f47, 10, 0, 0.1, 0, base);
    const yawG = group(base, 0, 0.2, 0);
    cyl(0.22, 0.22, 0.16, color, 10, 0, 0.08, 0, yawG);
    box(0.3, 0.12, 0.3, dark, 0, 0.2, 0, yawG);
    const sh = group(yawG, 0, 0.28, 0);
    sph(0.13, dark, 0, 0, 0, sh, 8, 6);

      floaters.push({ e: tag, y: 1.4, k: i * 2 });
    }
    let cd = 0;
    return { g, update(t, dt, s) {
      cd -= dt;
      const rich = s === 'RICH';
      pieces.forEach((p, i) => (p.visible = rich || i % 3 === 0));
      glowM.emissive.setHex(rich ? (Math.sin(t * 3) > 0 ? new THREE.Color(o.variant[1]).multiplyScalar(0.45).getHex() : 0) : 0);
      floaters.forEach((f) => { f.e.position.y = f.y + Math.sin(t * 1.5 + f.k) * 0.15; f.e.rotation.y += dt * 0.6; f.e.visible = rich; });
      if (rich && cd <= 0) { cd = 0.2; spawn(g, R() * 1.4, 0.4, R() * 1.4, 0, 1.2, 0, o.variant[1], 1.0, 0.06, -0.2); }
    } };
  }

  // ---------- catalog ----------
  const ITEMS = [
    { id: 'assembler', name: 'ASSEMBLER', kind: 'MACHINE', chip: 0x8a94a3, h: 2.1, real: 'One coding agent working in its own git worktree. It takes a task off the belt and puts a branch back on it.',
      stats: [['POWER', 'steam or solar'], ['SPEED', '~1 PR / 4 min'], ['INPUT', 'task spec'], ['OUTPUT', 'branch + diff']],
      states: ['IDLE', 'WORKING', 'BLOCKED'], tiers: ['MK1', 'MK2', 'MK3'],
      variants: [['SPARK', 0x6fb2ff], ['CLAUDE CODE', 0xd97757], ['CODEX', 0xd6dbe3]], build: buildAssembler },
    { id: 'splitter', name: 'SPLITTER', kind: 'MACHINE', chip: 0xf2a93b, h: 3.4, real: 'Spark reads incoming feedback, merges duplicates, and splits it into tasks for the assemblers.',
      stats: [['POWER', 'steam'], ['BRAIN', 'Muse Spark'], ['INPUT', 'ore'], ['OUTPUT', 'tasks']], states: ['IDLE', 'SORTING'], build: buildSplitter },
    { id: 'inspector', name: 'CI INSPECTOR', kind: 'INSPECTION', chip: 0x3b82f6, h: 1.9, real: 'The first station. Runs tests, lint and type checks on every branch. Failures go back on the rework loop with the error attached.',
      stats: [['POWER', 'steam'], ['GATES', 'lint · types · tests'], ['PASS RATE', '84%'], ['QUALITY', 'up to rare']], states: ['SCANNING', 'PASS', 'REJECT', 'BACKED UP'], build: buildInspector },
    { id: 'verify', name: 'VERIFY BAY', kind: 'INSPECTION', chip: 0x6fb2ff, h: 2.2, real: 'The second station. Replays the original bug in a sandbox, then runs the fix against it. The bug has to die in the chamber before the PR moves on.',
      stats: [['POWER', 'steam or local'], ['CHECKS', 'repro + fix'], ['PROOF', 'before / after'], ['ON FAIL', 'rework loop']], states: ['IDLE', 'VERIFYING', 'PASS', 'FAIL', 'BACKED UP'], build: buildVerify },
    { id: 'review', name: 'AI REVIEW', kind: 'INSPECTION', chip: 0xb48cff, h: 2.4, real: 'The third station. A different model from the one that built it (Claude builds, Codex reviews) reads the diff and pins comments on risky lines. Changes requested send the PR back with the comments attached.',
      stats: [['POWER', 'steam'], ['READS', 'the whole diff'], ['OUTPUT', 'comments + verdict'], ['ON FAIL', 'rework loop']], states: ['IDLE', 'REVIEWING', 'APPROVED', 'CHANGES', 'BACKED UP'], build: buildReview },
    { id: 'gate', name: 'MERGE GATE', kind: 'INSPECTION', chip: 0xf2a93b, h: 1.7, real: 'The human check. PRs that passed every station wait at the barrier until you approve, then roll on to the launch pad.',
      stats: [['POWER', 'you'], ['NEEDS', 'your approval'], ['QUEUE', 'PRs waiting'], ['ON PASS', 'launch pad']], states: ['WAITING', 'APPROVED', 'BACKED UP', 'REJECTED'], build: buildGate },
    { id: 'rework', name: 'REWORK LOOP', kind: 'LOGISTICS', chip: 0xd94a3f, h: 1.5, real: 'Failed work rides back to Spark at the start of the line, carrying a scar tag that says what broke, so the next pass knows. A long loop means a station keeps failing.',
      stats: [['CARRIES', 'failed PRs'], ['ATTACHED', 'scar tag'], ['GOES TO', 'Spark, line start'], ['WATCH FOR', 'long loops']], states: ['FLOWING', 'CLOGGED'], build: buildRework },
    { id: 'launch', name: 'LAUNCH PAD', kind: 'MACHINE', chip: 0xff5e52, h: 3.6, real: 'Where finished PRs wait. You merge, the rocket launches, the change ships.',
      stats: [['POWER', 'none'], ['NEEDS', 'your merge'], ['PERMIT', 'per district'], ['OUTPUT', 'a release']], states: ['IDLE', 'COUNTDOWN', 'LAUNCH'], build: buildLaunchPad },
    { id: 'orbit', name: 'ORBIT WATCH', kind: 'INSPECTION', chip: 0x93c5fd, h: 2.9, real: 'The last station, after the launch. Watches the deploy for 24 hours: Sentry stays quiet and the metric comes back, or the change is flagged and sent back to Spark.',
      stats: [['WATCHES', '24 h after deploy'], ['SIGNALS', 'Sentry + metrics'], ['ON ALERT', 'back to Spark'], ['SITS BY', 'the launch pad']], states: ['WATCHING', 'ALL CLEAR', 'ALERT'], build: buildOrbit },
    { id: 'turret', name: 'TURRET', kind: 'DEFENSE', chip: 0x5bd18b, h: 1.6, real: 'Tests guarding a district. Bugs that reach the district get shot down before they ship.',
      stats: [['POWER', 'solar'], ['AMMO', 'regression tests'], ['RANGE', 'one district'], ['BUILT BY', 'turret builder']], states: ['SCANNING', 'FIRING'], build: buildTurret },
    { id: 'biter', name: 'BITER', kind: 'ENEMY', chip: 0xff5e52, h: 1.2, real: 'A Sentry error, spawned on the district its stack trace points to. Ignore it and more show up.',
      stats: [['SOURCE', 'Sentry'], ['SPAWNS', 'per error spike'], ['TARGET', 'a district'], ['DROPS', 'red ore']],
      states: ['WALK', 'ATTACK', 'DIE'], variants: [['MEDIUM · ERROR', 0xff5e52, 1], ['SMALL · WARNING', 0xff9a4a, 0.7], ['BIG · CRASH', 0x9b5cff, 1.35]], build: buildBiter },
    { id: 'solar', name: 'SOLAR PANEL', kind: 'POWER', chip: 0x3b7cf0, h: 2.2, real: 'A subscription plan. Free power while the plan has capacity; goes dark when you hit the usage limit.',
      stats: [['COST', 'flat monthly'], ['OUTPUT', 'plan limit'], ['RECHARGE', 'usage window'], ['FEEDS', 'local assemblers']],
      states: ['SUNNY', 'CAPPED'], variants: [['CLAUDE', 0xd97757], ['CODEX', 0xd6dbe3], ['CURSOR', 0x8a8f99], ['GROK', 0x30343c]], build: buildSolar },
    { id: 'battery', name: 'BATTERY', kind: 'POWER', chip: 0x5bd18b, h: 1.9, real: 'Stores a plan’s capacity. Drains as agents work, refills when the usage window resets.',
      stats: [['CAPACITY', '5 cells'], ['REFILL', 'per window'], ['WARN AT', '1 cell'], ['FEEDS', 'solar machines']], states: ['CHARGING', 'FULL', 'DRAINING', 'EMPTY'], build: buildBattery },
    { id: 'steam', name: 'STEAM PLANT', kind: 'POWER', chip: 0xc47d1a, h: 3.8, real: 'A paid API. Always on, burns credits per task. A second plant takes over if the first fails.',
      stats: [['COST', 'per token'], ['UPTIME', 'always'], ['FAILOVER', 'second plant'], ['FEEDS', 'Spark machines']],
      states: ['IDLE', 'RUNNING', 'OVERLOAD'], variants: [['META API', 0x6fb2ff], ['BASETEN', 0x9b8cff]], build: buildSteam },
    { id: 'geo', name: 'GEOTHERMAL', kind: 'POWER', chip: 0xff7a2a, h: 2.6, real: 'Local inference on your own hardware. Free and always on, but capped by what the machine can run.',
      stats: [['COST', 'free'], ['MODEL', 'Glimmer 30B'], ['LIMIT', 'GPU memory'], ['FEEDS', 'cheap tasks']],
      states: ['IDLE', 'INFERENCE', 'OVERHEAT'], variants: [['MAC · MLX', 0xc9ced6, 0xeef1fa], ['3090 · LLAMA.CPP', 0x2b2f36, 0xf2a93b]], build: buildGeo },
    { id: 'belt', name: 'CONVEYOR BELT', kind: 'LOGISTICS', chip: 0x4a505a, h: 0.6, real: 'A typed queue between machines. It only connects machines whose inputs and outputs match.',
      stats: [['CARRIES', 'one item type'], ['SPEED', '1 tile / s'], ['JAMS WHEN', 'next machine is full'], ['COST', 'free']], states: ['RUNNING', 'JAMMED'], build: buildBelt },
    { id: 'ore', name: 'ORE DEPOSIT', kind: 'RESOURCE', chip: 0xff5e52, h: 1.6, real: 'Raw feedback waiting to be mined: errors, user emails and open issues.',
      stats: [['MINED BY', 'splitter'], ['REFILLS', 'as feedback arrives'], ['RICHEST', 'Sentry spikes'], ['TURNS INTO', 'tasks']],
      states: ['RICH', 'DEPLETED'], variants: [['SENTRY', 0xff5e52], ['INBOX', 0x6fb2ff], ['ISSUES', 0xf2a93b]], build: buildOre }
  ];

  // ---------- stage ----------
  const oneView = group(scene); makeIsland(9, 9, oneView); pedestal(oneView, 0, 0, 1);
  const holder = group(oneView, 0, 0.4, 0);
  const allView = group(scene); allView.rotation.y = Math.PI / 4; allView.visible = false;
  makeIsland(29, 22, allView);
  const rocks = [];
  for (let i = 0; i < 10; i++) { const r = rock(0.4 + rnd() * 0.9, 0x2f3760, -14 + rnd() * 28, -5 - rnd() * 8, -12 + rnd() * 24, scene); rocks.push({ r, y: r.position.y, k: rnd() * 6 }); }

  const sel = { id: 'assembler', state: 'WORKING', tier: 1, variant: 0 };
  let current = null;
  const lineup = [];
  function makeInstance(item, tier, variant) {
    const inst = item.build({ tier: tier || 0, variant: item.variants ? item.variants[variant || 0] : null });
    inst.g.traverse((o) => { if (o.isMesh && o.material && !o.material.transparent) { o.castShadow = true; o.receiveShadow = true; } });
    return inst;
  }
  function showItem() {
    const item = ITEMS.find((i) => i.id === sel.id);
    if (current) holder.remove(current.g);
    current = makeInstance(item, sel.tier, sel.variant);
    holder.add(current.g);
    viewH = item.h > 3 ? 8.4 : item.h > 2 ? 7.2 : 6.4;
    target.set(0, 0.4 + Math.min(item.h, 3) * 0.45, 0);
    renderCard(item);
    resize();
  }
  ITEMS.forEach((item, i) => {
    const c = i % 5, r = Math.floor(i / 5);
    const x = (c - 2) * 5.2, z = (r - 1.5) * 5.2;
    pedestal(allView, x, z, 0.9);
    const inst = makeInstance(item, item.tiers ? 1 : 0, 0);
    inst.g.position.set(x, 0.4, z); inst.g.scale.setScalar(item.h > 3 ? 0.75 : 0.9); allView.add(inst.g);
    lineup.push({ item, inst, state: item.states[Math.min(1, item.states.length - 1)] });
  });

  // ---------- UI ----------
  const hex = (n) => '#' + n.toString(16).padStart(6, '0');
  const list = $('list');
  ITEMS.forEach((item) => {
    const b = document.createElement('button'); b.className = 'tbtn'; b.dataset.id = item.id;
    b.innerHTML = '<span class="chip"></span><span></span>';
    b.firstChild.style.background = hex(item.chip); b.lastChild.textContent = item.name;
    b.onclick = () => select(item.id);
    list.appendChild(b);
  });
  function select(id) {
    const item = ITEMS.find((i) => i.id === id);
    Object.assign(sel, { id, state: item.states[Math.min(1, item.states.length - 1)], tier: item.tiers ? 1 : 0, variant: 0 });
    if (mode !== 'one') setMode('one'); else showItem();
  }
  function buttons(root, values, active, onPick) {
    root.innerHTML = '';
    values.forEach((v, i) => {
      const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = v;
      b.setAttribute('aria-pressed', i === active); b.onclick = () => onPick(i); root.appendChild(b);
    });
  }
  function renderCard(item) {
    $('c-kind').textContent = item.kind; $('c-name').textContent = item.name; $('c-real').textContent = item.real;
    const dl = $('c-stats'); dl.innerHTML = '';
    item.stats.forEach(([k, v]) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); });
    buttons($('c-states'), item.states, item.states.indexOf(sel.state), (i) => { sel.state = item.states[i]; renderCard(item); });
    $('s-tier').hidden = !item.tiers;
    if (item.tiers) buttons($('c-tiers'), item.tiers, sel.tier, (i) => { sel.tier = i; showItem(); });
    $('s-variant').hidden = !item.variants;
    if (item.variants) buttons($('c-variants'), item.variants.map((v) => v[0]), sel.variant, (i) => { sel.variant = i; showItem(); });
    list.querySelectorAll('[data-id]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === item.id));
  }

  // lineup labels
  const labelRoot = $('labels');
  lineup.forEach((L) => {
    const el = document.createElement('button'); el.className = 'label'; el.textContent = L.item.name;
    el.onclick = () => select(L.item.id); labelRoot.appendChild(el); L.el = el;
  });
  const v3 = new THREE.Vector3();
  function placeLabels() {
    const w = window.innerWidth, h = window.innerHeight;
    lineup.forEach((L) => {
      if (mode !== 'all') { L.el.style.display = 'none'; return; }
      v3.set(L.inst.g.position.x, 0.45, L.inst.g.position.z + 1.55); allView.localToWorld(v3); v3.project(cam);
      L.el.style.display = 'block';
      L.el.style.transform = 'translate(' + Math.round((v3.x + 1) / 2 * w) + 'px,' + Math.round((1 - v3.y) / 2 * h) + 'px) translate(-50%,-30%)';
    });
  }

  let mode = 'one', spin = true;
  function setMode(m) {
    mode = m; oneView.visible = m === 'one'; allView.visible = m === 'all';
    $('v-one').setAttribute('aria-pressed', m === 'one'); $('v-all').setAttribute('aria-pressed', m === 'all');
    $('card').hidden = m === 'all';
    zoom = 1;
    if (m === 'one') showItem(); else { viewH = 30; target.set(0, 0.8, 0); resize(); }
  }
  $('v-one').onclick = () => setMode('one');
  $('v-all').onclick = () => setMode('all');
  $('t-spin').onclick = (e) => { spin = !spin; e.currentTarget.setAttribute('aria-pressed', spin); };
  $('t-night').onclick = (e) => {
    night = !night; e.currentTarget.setAttribute('aria-pressed', night);
    scene.background = new THREE.Color(night ? 0x0a0e22 : 0x1b2448);
    hemi.intensity = night ? 0.22 : 0.6; hemi.color.setHex(night ? 0x6f86d6 : 0xd6deff);
    sun.intensity = night ? 0.3 : 0.95; sun.color.setHex(night ? 0x9fb4ff : 0xfff0d2);
  };
  scene.background = new THREE.Color(0x1b2448);

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x; drag.x = e.clientX;
    if (mode === 'one') holder.rotation.y += dx * 0.012; else allView.rotation.y += dx * 0.004;
  });
  const end = () => (drag = null);
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.5, Math.min(2.2, zoom * Math.exp(e.deltaY * 0.001))); resize(); }, { passive: false });
  window.addEventListener('resize', resize);

  // ---------- loop ----------
  showItem();
  const yaw = ART.yaw * Math.PI / 180, tilt = ART.tilt * Math.PI / 180, D = 30;
  const off = new THREE.Vector3(D * Math.cos(tilt) * Math.sin(yaw), D * Math.sin(tilt), D * Math.cos(tilt) * Math.cos(yaw));
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    if (mode === 'one') { current.update(t, dt, sel.state); if (spin && !drag && !reduceMotion) holder.rotation.y += dt * 0.35; }
    else lineup.forEach((L) => L.inst.update(t, dt, L.state));
    updateFx(dt);
    rocks.forEach((r) => (r.r.position.y = r.y + Math.sin(t * 0.6 + r.k) * 0.3));
    cam.position.copy(target).add(off); cam.lookAt(target);
    sun.position.set(target.x + 10, target.y + 22, target.z + 6); sun.target.position.copy(target);
    renderer.setRenderTarget(rtex); renderer.render(scene, cam);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    placeLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
