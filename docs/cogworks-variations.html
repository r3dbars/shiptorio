<title>Shiptorio Dioramas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One-screen app: the diorama fills the screen; tabs on top, the mood board card on the left,
   view controls bottom right. Chrome is neutral and borrows each world's accent. */
:root {
  --bg: #07080f;
  --panel: rgba(9, 11, 22, 0.9);
  --line: #3a4270;
  --ink: #eef1fa;
  --dim: #a3abcf;
  --accent: #f2a93b;
  --focus: #6fb2ff;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 12px/1.5 var(--mono); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.card { background: var(--panel); border: 2px solid var(--line); outline: 2px solid #000; backdrop-filter: blur(2px); }
.ptitle { font: 700 20px/1.05 var(--pixel); letter-spacing: 0.08em; margin: 0; text-wrap: balance; }
.eyebrow { font: 400 10px/1.2 var(--pixel); letter-spacing: 0.12em; color: var(--dim); }
.tbtn { font: 400 10px/1 var(--pixel); letter-spacing: 0.06em; color: var(--ink); background: rgba(9, 11, 22, 0.92); border: 2px solid var(--line); min-height: 30px; padding: 0 10px; cursor: pointer; }
.tbtn:hover { border-color: var(--dim); }
.tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0904; }
.tbtn:focus-visible, .comp:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#tabs { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; z-index: 5; }
#tabs .tbtn { min-height: 34px; padding: 0 14px; font-size: 12px; }

#mood { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: 300px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
#mood .pitch { margin: 0; font-size: 11.5px; line-height: 1.55; }
.sw { display: flex; height: 12px; border: 1px solid #000; }
.sw i { flex: 1; }
.kw { display: flex; flex-wrap: wrap; gap: 4px; }
.kw span { font: 400 9px/1 var(--pixel); letter-spacing: 0.08em; padding: 4px 5px; border: 1px solid var(--line); color: var(--dim); }
.comp { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); cursor: pointer; background: rgba(255,255,255,0.02); }
.comp:hover { border-color: var(--dim); }
.comp[aria-current="true"] { border-color: var(--accent); }
.comp b { font: 700 11px var(--pixel); letter-spacing: 0.08em; }
.comp p { margin: 0; font-size: 11px; color: var(--dim); line-height: 1.5; }
.states { display: flex; flex-wrap: wrap; gap: 3px; }
.states .tbtn { min-height: 24px; font-size: 9px; padding: 0 6px; }
#hide { align-self: flex-start; }

#ctrl { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-items: center; justify-content: flex-end; max-width: calc(100% - 24px); z-index: 4; }
#ctrl .eyebrow { margin: 0 4px 0 6px; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.label { position: absolute; left: 0; top: 0; background: rgba(9, 11, 22, 0.88); border: 1px solid var(--line); padding: 3px 7px 4px; white-space: nowrap; font: 700 10px var(--pixel); letter-spacing: 0.08em; color: var(--ink); pointer-events: auto; cursor: pointer; }
.label:hover { border-color: var(--accent); }
#showMood { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); z-index: 4; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 14px var(--pixel); letter-spacing: 0.1em; color: var(--dim); pointer-events: none; z-index: 1; }

@media (max-width: 820px) {
  #tabs { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none; justify-content: center; }
  #tabs .tbtn { padding: 0 8px; font-size: 10px; flex: 1; }
  #mood { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-height: 40vh; }
  #showMood { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  #ctrl { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); justify-content: center; }
  #ctrl .tbtn { min-height: 28px; padding: 0 7px; font-size: 9px; }
}
</style>

<canvas id="stage" aria-label="A pixel-art diorama of three Shiptorio machines in the selected world"></canvas>
<div id="loading">BUILDING WORLD…</div>
<div id="labels"></div>
<nav id="tabs" class="card" aria-label="Worlds"></nav>
<aside id="mood" class="card" aria-live="polite">
  <span class="eyebrow" id="m-eyebrow">MOOD BOARD</span>
  <h1 class="ptitle" id="m-name"></h1>
  <p class="pitch" id="m-pitch"></p>
  <div class="sw" id="m-sw"></div>
  <div class="kw" id="m-kw"></div>
  <span class="eyebrow">THE THREE MACHINES · CLICK TO ZOOM</span>
  <div id="m-comps" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="tbtn" id="hide">HIDE PANEL</button>
</aside>
<button class="tbtn card" id="showMood" hidden>MOOD BOARD</button>
<div id="ctrl" class="card">
  <span class="eyebrow">PIXELS</span>
  <button class="tbtn" data-px="1">1X</button><button class="tbtn" data-px="2">2X</button><button class="tbtn" data-px="3">3X</button><button class="tbtn" data-px="0">SMOOTH</button>
  <span class="eyebrow">VIEW</span>
  <button class="tbtn" id="b-all">ALL THREE</button>
  <button class="tbtn" id="b-cycle" aria-pressed="false">CYCLE STATES</button>
  <button class="tbtn" id="b-labels" aria-pressed="true">LABELS</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// SHIP: the shared diorama engine. Style modules call SHIP.register(style).
// =====================================================================
window.SHIP = (function () {
  'use strict';
  const styles = [];
  const S = { register(s) { styles.push(s); }, styles };

  // ---------- kit handed to every style module ----------
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cache = {};
  function mat(c, o) {
    if (o === undefined && typeof c === 'number' && cache[c]) return cache[c];
    o = o || {};
    const m = new THREE.MeshPhongMaterial({
      color: c, emissive: o.e || 0, emissiveIntensity: o.ei === undefined ? 1 : o.ei,
      flatShading: o.flat !== false, shininess: o.shine || 0, specular: o.spec === undefined ? (o.shine ? 0x333333 : 0) : o.spec,
      transparent: o.op !== undefined, opacity: o.op === undefined ? 1 : o.op, side: o.double ? THREE.DoubleSide : THREE.FrontSide,
      map: o.map || null
    });
    if (o.depthWrite === false) m.depthWrite = false;
    if (arguments.length === 1 && typeof c === 'number') cache[c] = m;
    return m;
  }
  const glow = (c, op, add) => new THREE.MeshBasicMaterial({ color: c, transparent: op !== undefined || !!add, opacity: op === undefined ? 1 : op, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: false });
  function mesh(geo, m, x, y, z, p) {
    const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
    o.position.set(x || 0, y || 0, z || 0);
    const lit = !(o.material.isMeshBasicMaterial);
    o.castShadow = lit && !o.material.transparent; o.receiveShadow = lit;
    if (p) p.add(o); return o;
  }
  const box = (w, h, d, m, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
  const cyl = (a, b, h, m, s, x, y, z, p) => mesh(new THREE.CylinderGeometry(a, b, h, s || 10), m, x, y, z, p);
  const cone = (r, h, m, s, x, y, z, p) => mesh(new THREE.ConeGeometry(r, h, s || 10), m, x, y, z, p);
  const sph = (r, m, x, y, z, p, ws, hs) => mesh(new THREE.SphereGeometry(r, ws || 10, hs || 8), m, x, y, z, p);
  const torus = (r, t, m, rs, ts, x, y, z, p, arc) => mesh(new THREE.TorusGeometry(r, t, rs || 6, ts || 16, arc || Math.PI * 2), m, x, y, z, p);
  const rock = (r, m, x, y, z, p, detail) => mesh(new THREE.DodecahedronGeometry(r, detail || 0), m, x, y, z, p);
  const group = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); if (p) p.add(g); return g; };
  function lathe(points, m, seg, x, y, z, p) {
    const mm = typeof m === 'number' ? mat(m, { double: true }) : m;
    return mesh(new THREE.LatheGeometry(points.map(([r, h]) => new THREE.Vector2(r, h)), seg || 16), mm, x, y, z, p);
  }
  function tube(points, r, m, p, seg, radial) {
    const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
    return mesh(new THREE.TubeGeometry(curve, seg || 24, r, radial || 6, false), m, 0, 0, 0, p);
  }
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(repeat[0], repeat[1]); return t;
  }
  // particles: little cubes (or additive glow cubes) that drift, fall or rise
  const fx = []; const fxGeo = new THREE.BoxGeometry(1, 1, 1);
  function spawn(p, x, y, z, vx, vy, vz, color, life, size, grav, add) {
    if (fx.length > 900) return null;
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: !add }));
    m.position.set(x, y, z); m.scale.setScalar(size); p.add(m);
    const f = { m, p, vx, vy, vz, life, max: life, grav, size }; fx.push(f); return f;
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life -= dt;
      if (f.life <= 0 || !f.p.parent) { f.p.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); continue; }
      f.vy -= f.grav * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      const k = f.life / f.max; f.m.material.opacity = Math.min(1, k * 1.6);
      if (f.grav < 0) f.m.scale.setScalar(f.size * (1 + (1 - k) * 1.5));
    }
  }
  let lightBudget = 0;
  function light(color, intensity, dist, x, y, z, p) {
    if (lightBudget >= 10) return { intensity: 0, color: new THREE.Color(), position: new THREE.Vector3(), isDummy: true };
    lightBudget++;
    const l = new THREE.PointLight(color, intensity, dist || 8, 2); l.position.set(x || 0, y || 0, z || 0); if (p) p.add(l); return l;
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  function keyframes(frames, p) {
    for (let i = 0; i < frames.length - 1; i++) { const a = frames[i], b = frames[i + 1]; if (p <= b[0]) { const k = smooth((p - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); } }
    return frames[frames.length - 1].slice(1);
  }
  function link(m, ax, ay, bx, by) { m.position.x = (ax + bx) / 2; m.position.y = (ay + by) / 2; m.rotation.z = Math.atan2(by - ay, bx - ax); m.scale.x = Math.hypot(bx - ax, by - ay); }
  const R = () => Math.random() - 0.5;
  const SLOTS = [-8, 0, 8];
  S.kit = { THREE, rnd, R, mat, glow, mesh, box, cyl, cone, sph, torus, rock, group, lathe, tube, canvasTex, spawn, light, lerp, smooth, keyframes, link, SLOTS, v3: new THREE.Vector3() };
  S._fx = { updateFx };
  S._resetLights = () => (lightBudget = 0);
  return S;
})();
</script>
<script>
// BLACK IRON (Cogworks variation 1): the dirtiest foundry. Oil-black iron, soot, rust, coal dust,
// furnace glow, and a chain-driven conveyor line that ties every machine together.
(function () {
  'use strict';
  const C = {
    soot: 0x0f0c0a, iron: 0x221d19, ironL: 0x3a332c, ironM: 0x2b2520,
    brass: 0x8a6428, brassD: 0x4e3816, brassL: 0xb48a3e,
    copper: 0x7a3c20, copperD: 0x4a2414, verd: 0x2f6a58, verdD: 0x1e463a,
    brick: 0x4a2216, brickD: 0x301612, stone: 0x4a4038, stoneD: 0x302922,
    wood: 0x3e2a18, woodD: 0x2a1c10, leather: 0x3a2214, cream: 0xc8b48a,
    gas: 0xffc070, ember: 0xff7a2a, red: 0xe0402a, teal: 0x7af0d8
  };

  // ---------- shared material + part helpers ----------
  let M = null;
  function mats(K) {
    if (M) return M;
    M = {
      brass: K.mat(C.brass, { shine: 38, spec: 0x7a5a28 }),
      brassL: K.mat(C.brassL, { shine: 50, spec: 0x9a7a40 }),
      brassD: K.mat(C.brassD, { shine: 20, spec: 0x3a2a10 }),
      copper: K.mat(C.copper, { shine: 34, spec: 0x6a3a20 }),
      copperD: K.mat(C.copperD, { shine: 18, spec: 0x3a1a0a }),
      iron: K.mat(C.iron, { shine: 26, spec: 0x2a2a30 }), ironM: K.mat(C.ironM, { shine: 18, spec: 0x222228 }), ironL: K.mat(C.ironL, { shine: 30, spec: 0x34343a }),
      oil: K.mat(0x07070a, { shine: 90, spec: 0x6a5a8a }), rust: K.mat(0x6a2e14), rustL: K.mat(0x8a4a1e), hazard: K.mat(0xb8860e), grime: K.mat(0x050403, { op: 0.55, depthWrite: false }),
      soot: K.mat(C.soot), verd: K.mat(C.verd), verdD: K.mat(C.verdD),
      wood: K.mat(C.wood), woodD: K.mat(C.woodD), leather: K.mat(C.leather),
      brick: K.mat(C.brick), brickD: K.mat(C.brickD), stone: K.mat(C.stone), stoneD: K.mat(C.stoneD),
      cream: K.mat(C.cream),
      glass: K.mat(0xa8d8c8, { op: 0.22, shine: 90, spec: 0xffffff, depthWrite: false, double: true }),
      gas: K.glow(C.gas), ember: K.glow(C.ember), teal: K.glow(C.teal)
    };
    return M;
  }
  // a gear lying in the xz plane (axis = y); rotate the returned group to orient it
  function gear(K, p, r, thick, teeth, m, x, y, z) {
    const g = K.group(p, x, y, z);
    K.cyl(r, r, thick, m, Math.max(12, teeth), 0, 0, 0, g);
    const tw = (Math.PI * 2 * r) / teeth * 0.5;
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2;
      const tb = K.box(tw, thick * 0.9, r * 0.22, m, Math.sin(a) * (r + r * 0.08), 0, Math.cos(a) * (r + r * 0.08), g);
      tb.rotation.y = a;
    }
    K.cyl(r * 0.28, r * 0.28, thick * 1.6, M.ironM, 8, 0, 0, 0, g);
    if (r > 0.35) for (let i = 0; i < 4; i++) { const s = K.box(r * 1.4, thick * 1.1, r * 0.12, M.brassD, 0, 0, 0, g); s.rotation.y = i * Math.PI / 4; s.scale.x = 0.95; }
    return g;
  }
  function rivetRing(K, p, r, y, n, m) { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; K.box(0.08, 0.08, 0.08, m || M.brassL, Math.cos(a) * r, y, Math.sin(a) * r, p); } }
  function band(K, p, r, y, m, h) { K.cyl(r, r, h || 0.1, m || M.brass, 18, 0, y, 0, p); }
  // gauge facing +z (rotate the group to face elsewhere); returns needle pivot
  function gauge(K, p, x, y, z, r, ry) {
    const g = K.group(p, x, y, z); g.rotation.y = ry || 0;
    const rim = K.cyl(r * 1.15, r * 1.15, 0.08, M.brass, 14, 0, 0, 0, g); rim.rotation.x = Math.PI / 2;
    const face = K.cyl(r, r, 0.1, M.cream, 14, 0, 0, 0.01, g); face.rotation.x = Math.PI / 2;
    const red = K.box(r * 0.5, r * 0.18, 0.02, K.mat(0xb02a1a), r * 0.45, r * 0.45, 0.065, g); red.rotation.z = -0.8;
    const piv = K.group(g, 0, 0, 0.07);
    K.box(0.035, r * 0.85, 0.02, K.mat(0x140c06), 0, r * 0.38, 0, piv);
    K.box(0.07, 0.07, 0.03, M.brassL, 0, 0, 0.01, g);
    return piv;
  }
  // smoke/steam puff helper
  function puff(K, p, x, y, z, col, size, vy, spread, life) {
    K.spawn(p, x + K.R() * spread, y, z + K.R() * spread, K.R() * 0.3 + 0.25, vy, K.R() * 0.3, col, life || 2.6, size, -0.12);
  }
  function lamp(K, p, x, z, h, withLight) {
    const g = K.group(p, x, 0, z);
    K.cyl(0.22, 0.28, 0.22, M.iron, 8, 0, 0.11, 0, g);
    K.cyl(0.07, 0.09, h, M.iron, 8, 0, h / 2, 0, g);
    for (let i = 0; i < 3; i++) band(K, g, 0.1, 0.5 + i * (h * 0.3), M.brassD, 0.06);
    const arm = K.box(0.5, 0.06, 0.06, M.iron, 0.18, h - 0.1, 0, g); arm.rotation.z = 0.2;
    K.cyl(0.2, 0.14, 0.1, M.brass, 6, 0, h, 0, g);
    const glass = K.box(0.24, 0.34, 0.24, M.gas, 0, h + 0.24, 0, g);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) K.box(0.035, 0.38, 0.035, M.iron, sx * 0.13, h + 0.24, sz * 0.13, g);
    K.cone(0.24, 0.24, M.brassD, 6, 0, h + 0.53, 0, g);
    K.sph(0.05, M.brassL, 0, h + 0.68, 0, g, 6, 4);
    const L = withLight ? K.light(0xffaa55, 1.4, 7.5, 0, h + 0.2, 0, g) : null;
    return { g, glass, L };
  }

  // ---------- textures ----------
  function cobbleTex(K) {
    return K.canvasTex(128, 128, (g) => {
      let s = 31; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = '#0c0907'; g.fillRect(0, 0, 128, 128);
      const tones = ['#2a241f', '#302821', '#352c25', '#26201b', '#3a3129', '#2e2620'];
      for (let y = 0; y < 128; y += 9) {
        let x = -Math.floor(r() * 8);
        while (x < 128) {
          const w = 7 + Math.floor(r() * 5), h = 7 + Math.floor(r() * 2), oy = Math.floor(r() * 2);
          g.fillStyle = tones[Math.floor(r() * tones.length)]; g.fillRect(x + 1, y + 1 + oy, w - 1, h - 1);
          g.fillRect(x + 2, y + oy, w - 3, 1); g.fillRect(x + 2, y + h + oy - 0, w - 3, 1);
          g.fillStyle = 'rgba(255,220,170,0.09)'; g.fillRect(x + 2, y + 1 + oy, w - 3, 1);
          g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x + 1, y + h - 1 + oy, w - 1, 1);
          x += w;
        }
      }
      for (let i = 0; i < 26; i++) { g.fillStyle = 'rgba(4,3,2,0.5)'; const x = r() * 110, y = r() * 110; g.fillRect(x, y, 10 + r() * 16, 5 + r() * 8); }
      for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(Math.floor(r() * 64) * 2, Math.floor(r() * 64) * 2, 2, 2); }
      for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(90,40,16,0.25)'; g.fillRect(r() * 120, r() * 120, 8, 3); }
    }, [9, 4.5]);
  }
  function brickTex(K, rep, dark) {
    return K.canvasTex(64, 64, (g) => {
      let s = 7; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = dark ? '#1c100c' : '#2a1812'; g.fillRect(0, 0, 64, 64);
      const tones = dark ? ['#4a2018', '#3e1c15', '#52251b'] : ['#6e3020', '#62291b', '#7a3826', '#5a2618'];
      for (let y = 0; y < 64; y += 8) for (let x = (y / 8) % 2 ? -8 : 0; x < 64; x += 16) {
        g.fillStyle = tones[Math.floor(r() * tones.length)]; g.fillRect(x + 1, y + 1, 14, 6);

  // =====================================================================
  // FACTORY LINE: belts, a crossing trestle, a turntable, an ore elevator,
  // a stamping press, aether conduits and overhead pneumatic tubes.

  function beltTex(K) {
    return K.canvasTex(16, 16, (g) => {
      g.fillStyle = '#0c0907'; g.fillRect(0, 0, 16, 16);
      g.fillStyle = '#3a3029'; g.fillRect(1, 0, 14, 16);

      g.fillStyle = '#76624a'; g.fillRect(1, 0, 14, 1);

    });

  function factoryLine(K, root) {
    const THREE = K.THREE;

    const bt = beltTex(K);
    const rail = K.mat(0x3a2e24), railL = K.mat(0x8a6a3e, { shine: 22, spec: 0x4a3a20 });
    const legM = K.mat(0x231b15), braceM = K.mat(0x3a2c20);
    const oil = K.mat(0x0e0b09, { shine: 90, spec: 0x5a9a8a });

    // a belt along a 3D polyline; returns a sampler for riders
    function beltPath(pts, w, speed) {

        for (const sx of [-1, 1]) {
          K.box(0.07, 0.2, len + 0.05, railL, sx * (w / 2 + 0.035), 0.04, 0, sg);
          for (let k = 0; k < Math.floor(len / 0.45); k++) K.box(0.08, 0.05, 0.05, K.mat(0x7a5a2a), sx * (w / 2 + 0.07), 0.08, -len / 2 + 0.22 + k * 0.45, sg);
        }
        K.box(w * 0.9, 0.06, len, K.mat(0x14100c), 0, -0.1, 0, sg);
        // legs, vertical in root space
        const d = B.clone().sub(A); const hz = Math.hypot(d.x, d.z) || 1; const px = -d.z / hz, pz = d.x / hz;
        const nLeg = Math.max(1, Math.round(len / 1.4));

          const f = k / nLeg, p = A.clone().lerp(B, f);

          const h = p.y - 0.06;
          for (const s of [-1, 1]) K.box(0.12, h, 0.12, legM, p.x + px * s * (w / 2 + 0.05), h / 2, p.z + pz * s * (w / 2 + 0.05), root);

            const xb = K.box(Math.hypot(w + 0.1, h * 0.5), 0.05, 0.05, braceM, p.x, h * 0.3, p.z, root); xb.rotation.set(0, Math.atan2(d.x, d.z) + Math.PI / 2, 0); xb.rotateZ(Math.atan2(h * 0.5, w + 0.1));

    // ---- BUCKET ELEVATOR lifting ore into the splitter's hopper ----
    const elev = K.group(root, 0.85, 0, -3.3);
    for (const sx of [-0.4, 0.4]) for (const sz of [-0.32, 0.32]) K.box(0.1, 5.2, 0.1, M.iron, sx, 2.6, sz, elev);
    for (let y = 0.8; y < 5; y += 0.9) { K.box(0.9, 0.06, 0.06, braceM, 0, y, 0.32, elev); K.box(0.9, 0.06, 0.06, braceM, 0, y, -0.32, elev); const x = K.box(0.06, 1.1, 0.06, braceM, 0, y + 0.45, -0.33, elev); x.rotation.z = 0.7; }
    K.box(1.0, 0.5, 0.8, M.copperD, 0, 5.3, 0, elev);
    const head = K.cyl(0.3, 0.3, 0.7, M.brass, 10, 0, 5.15, 0, elev); head.rotation.x = Math.PI / 2;
    K.tube([[0, 5.3, 0.4], [0, 5.0, 0.9], [-0.05, 4.65, 1.35]], 0.12, M.copper, elev, 10, 6);
    const buckets = [];
    for (let i = 0; i < 12; i++) { const b = K.box(0.34, 0.16, 0.24, M.brassD, 0, 0, 0, elev); const ore = K.box(0.2, 0.08, 0.14, K.glow(0xff8a4a), 0, 0.08, 0, b); buckets.push({ b, ore, u: i / 12 }); }

    // ---- CAPSULE BELT: sorted capsules from the splitter bins to the assembler ----
    const capBelt = beltPath([[2.3, 0.42, 3.8], [-7.2, 0.42, 3.8], [-7.2, 0.5, 3.0]], 0.6, 0.6);
    spin.push(...gearbox(2.9, 0.0, 3.8, Math.PI / 2));
    // ---- CRATE BELT: finished PR crates up a trestle, OVER the ore belt, along the back, down to a turntable ----
    const crateBelt = beltPath([[-11.0, 0.5, -1.2], [-11.0, 2.5, -3.0], [-11.0, 2.5, -5.0], [2.4, 2.5, -5.0], [4.8, 0.5, -5.0]], 0.7, 0.55);
    const tt = K.group(root, 5.55, 0, -5.0);
    K.cyl(0.85, 0.95, 0.3, M.ironM, 12, 0, 0.15, 0, tt);
    rivetRing(K, tt, 0.9, 0.2, 12);
    const ttTop = K.group(tt, 0, 0.32, 0);
    K.cyl(0.75, 0.75, 0.06, M.brassD, 12, 0, 0, 0, ttTop);
    for (const sx of [-0.3, 0.3]) K.box(0.06, 0.1, 1.4, railL, sx, 0.06, 0, ttTop);
    for (let i = 0; i < 4; i++) { const r = K.cyl(0.05, 0.05, 0.55, M.ironL, 6, 0, 0.06, -0.5 + i * 0.33, ttTop); r.rotation.z = Math.PI / 2; }
    const ttCrate = K.group(ttTop, 0, 0.3, 0); crateMesh(ttCrate);
    const outBelt = beltPath([[5.55, 0.42, -4.3], [5.55, 0.42, -3.1], [6.4, 0.42, -2.45]], 0.7, 0.55);
    spin.push(...gearbox(-11.9, 0.0, -0.6, 0));

    function crateMesh(p) {
      K.box(0.46, 0.36, 0.46, M.woodD, 0, 0, 0, p);
      for (const x of [-0.17, 0.17]) K.box(0.05, 0.38, 0.48, M.brass, x, 0, 0, p);
      K.box(0.2, 0.06, 0.2, K.glow(0x7af0d8), 0, 0.19, 0, p);
    }
    function capsuleMesh(p, c) {
      const b = K.cyl(0.13, 0.13, 0.42, M.brass, 8, 0, 0, 0, p); b.rotation.z = Math.PI / 2;
      const w = K.cyl(0.135, 0.135, 0.14, K.glow(c), 8, 0, 0, 0, p); w.rotation.z = Math.PI / 2;
      for (const x of [-0.22, 0.22]) { const e = K.sph(0.13, M.brassD, x, 0, 0, p, 6, 4); e.scale.x = 0.5; }
    }
    function oreMesh(p, c) { K.rock(0.16, K.mat(0x3a2e24), 0, 0, 0, p); const gl = K.rock(0.09, K.glow(c), 0.06, 0.08, 0.04, p); return gl; }
    const riders = [];
    const ORE = [0xff7a3a, 0x6ab0ff, 0xffc04a];
    for (let i = 0; i < 12; i++) { const gr = K.group(root); oreMesh(gr, ORE[i % 3]); riders.push({ g: gr, belt: oreBelt, s: i / 12 * oreBelt.L, h: 0.2 }); }
    for (let i = 0; i < 9; i++) { const gr = K.group(root); capsuleMesh(gr, [0x7af0d8, 0x6ab0ff, 0xffc04a][i % 3]); riders.push({ g: gr, belt: capBelt, s: i / 9 * capBelt.L, h: 0.2, orient: true }); }
    for (let i = 0; i < 8; i++) { const gr = K.group(root); crateMesh(gr); riders.push({ g: gr, belt: crateBelt, s: i / 8 * crateBelt.L, h: 0.25, orient: true }); }
    for (let i = 0; i < 2; i++) { const gr = K.group(root); crateMesh(gr); riders.push({ g: gr, belt: outBelt, s: i / 2 * outBelt.L, h: 0.25, orient: true }); }

    // ---- AETHER CONDUITS: glowing veins from the splitter into every machine ----
    const aeth = K.glow(0x2cb89c), aethHot = 0xb8fff0;
    const conduits = [
      [[-1.9, 0.14, 0.6], [-3.2, 0.14, 1.4], [-4.6, 0.14, 1.65], [-5.5, 0.3, 1.55], [-6.3, 0.62, 1.45]],
      [[1.9, 0.14, 0.6], [3.4, 0.14, 1.4], [5.0, 0.14, 1.7], [6.2, 0.55, 1.9], [7.1, 0.62, 1.98]],
      [[0.0, 0.14, -2.7], [-1.2, 0.14, -4.3], [-2.0, 0.2, -5.95], [-2.0, 1.2, -6.15], [-2.0, 3.35, -6.15], [-1.0, 3.45, -6.15], [8.0, 3.45, -6.15], [13.5, 3.45, -6.15]],
      [[-2.0, 3.45, -6.15], [-9.0, 3.45, -6.15], [-14.5, 3.45, -6.15]]
    ];
    const pulses = [];
    conduits.forEach((pts, ci) => {
      const curve = new THREE.CatmullRomCurve3(pts.map(V), false, 'catmullrom', 0.1);
      const core = K.tube(pts, 0.1, aeth, root, 60, 6); core.castShadow = false;
      const L = curve.getLength();
      for (let u = 0.08; u < 1; u += 1.2 / L) { const p = curve.getPointAt(u), tn = curve.getTangentAt(u); const c = K.torus(0.13, 0.04, M.brassD, 4, 10, p.x, p.y, p.z, root); c.lookAt(root.localToWorld(p.clone().add(tn))); }
      const n = Math.max(3, Math.round(L / 2.2));
      for (let i = 0; i < n; i++) { const m = K.sph(0.13, K.glow(aethHot, 0.95, true), 0, 0, 0, root, 6, 4); pulses.push({ m, curve, u: i / n, sp: 1.6 / L }); }
    });
    // hub junction box where the wall conduits meet
    const hub = K.group(root, -2.0, 0, -6.0);
    K.box(0.8, 1.0, 0.4, M.ironM, 0, 3.45, 0, hub); K.box(0.86, 0.08, 0.46, M.brass, 0, 3.98, 0, hub);
    const hubEye = K.cyl(0.18, 0.18, 0.06, K.glow(0x7af0d8), 10, 0, 3.45, 0.22, hub); hubEye.rotation.x = Math.PI / 2;
    const hubL = K.light(0x5ae0c8, 1.2, 6, 0, 3.2, 1.0, hub);
    // valve wheels on the conduits
    const valves = [];
    for (const [x, y, z] of [[-3.9, 0.45, 1.55], [4.2, 0.45, 1.6], [-0.6, 0.45, -3.5]]) {
      K.cyl(0.07, 0.07, 0.3, M.ironL, 6, x, y - 0.15, z, root);
      const vw = K.torus(0.16, 0.035, K.mat(0x8a2a18), 4, 12, x, y, z, root); vw.rotation.x = Math.PI / 2; valves.push([x, y, z]);
    }

    // ---- OVERHEAD PNEUMATIC TUBES: capsules zip from the splitter crown to the machines ----
    const glass = K.mat(0xa8f0e0, { op: 0.34, shine: 90, spec: 0xffffff, depthWrite: false, double: true });
    const pnPaths = [
      [[-1.0, 4.95, -0.5], [-2.8, 6.5, -0.9], [-5.6, 6.8, -1.3], [-7.4, 5.8, -1.5], [-8.0, 4.25, -1.56]],
      [[1.0, 4.95, -0.5], [3.0, 6.7, -1.1], [5.8, 7.5, -1.8], [7.6, 7.35, -2.15]]
    ];
    const zips = [];
    pnPaths.forEach((pts) => {
      const curve = new THREE.CatmullRomCurve3(pts.map(V));
      const tb = K.tube(pts, 0.17, glass, root, 50, 8); tb.castShadow = false;
      for (let u = 0.1; u < 0.95; u += 0.17) { const p = curve.getPointAt(u), tn = curve.getTangentAt(u); const c = K.torus(0.19, 0.05, M.brass, 4, 12, p.x, p.y, p.z, root); c.lookAt(root.localToWorld(p.clone().add(tn))); }
      for (let i = 0; i < 3; i++) { const z = K.group(root); capsuleMesh(z, 0x9affea); zips.push({ z, curve, u: i / 3 }); }
    });
    // hanging chain supports for the tubes
    for (const [x, y, z] of [[-4.2, 6.75, -1.1], [4.4, 7.2, -1.5]]) { K.box(0.04, 9 - y, 0.04, M.iron, x, y + (9 - y) / 2, z, root); }

    // ---- grime: oil puddles and drips across the yard ----
    for (const [x, z, s] of [[-10.2, 2.4, 0.55], [-3.4, 2.9, 0.45], [2.2, -3.0, 0.5], [5.4, 2.9, 0.6], [-6.2, -2.9, 0.4], [10.8, -2.4, 0.55], [-13.2, 3.0, 0.5]]) {
      const pd = K.cyl(s, s, 0.015, oil, 12, x, 0.1, z, root); pd.scale.z = 0.55 + K.rnd() * 0.3; pd.rotation.y = K.rnd() * 3;
      pd.receiveShadow = true; pd.castShadow = false;
      const sh = K.cyl(s * 0.35, s * 0.35, 0.01, K.glow(0x2a5a52, 0.35), 10, x + s * 0.2, 0.112, z - s * 0.1, root); sh.scale.z = 0.4;
    }

    const tmp = new THREE.Vector3();
    let tP = 0, tV = 0, tSp = 0, pressK = 0;
    return function update(t, dt) {
      dt = Math.max(0, dt);
      texs.forEach((tx) => (tx.offset.y -= dt * 1.1));
      spin.forEach((g, i) => (g.rotation.y += dt * (i % 2 ? -3.2 : 2.0)));
      riders.forEach((r) => {
        r.s += dt * r.belt.speed; r.belt.at(r.s, tmp); r.g.position.set(tmp.x, tmp.y + r.h, tmp.z);
        if (r.orient) { const d = r.belt.dirAt(r.s); r.g.rotation.y = Math.atan2(d.x, d.z); }
      });
      // turntable swings every few seconds
      const cyc = (t * 0.35) % 1; ttTop.rotation.y = cyc < 0.4 ? 0 : cyc < 0.6 ? (cyc - 0.4) / 0.2 * Math.PI / 2 : cyc < 0.85 ? Math.PI / 2 : Math.PI / 2 * (1 - (cyc - 0.85) / 0.15);
      // elevator buckets loop: up the front, over the head, down the back
      buckets.forEach((b) => {
        b.u = (b.u + dt * 0.12) % 1; const u = b.u;
        if (u < 0.45) b.b.position.set(0, 0.5 + u / 0.45 * 4.6, 0.38);
        else if (u < 0.5) { const a = (u - 0.45) / 0.05 * Math.PI; b.b.position.set(0, 5.1 + Math.sin(a) * 0.2, 0.38 * Math.cos(a)); }
        else if (u < 0.95) b.b.position.set(0, 5.1 - (u - 0.5) / 0.45 * 4.6, -0.38);
        else { const a = (u - 0.95) / 0.05 * Math.PI; b.b.position.set(0, 0.5 - Math.sin(a) * 0.1, -0.38 * Math.cos(a)); }
        b.ore.visible = u < 0.47;
      });
      // stamping press: slow lift, hard drop, sparks + steam on impact
      const pc = (t * 0.55) % 1, prev = pressK; pressK = pc;
      ram.position.y = pc < 0.7 ? 1.25 + pc / 0.7 * 1.05 : 2.3 - Math.pow((pc - 0.7) / 0.3, 2) * 1.05;
      flywheel.rotation.z += dt * 2.6;
      if (prev < 0.98 && pc >= 0.98 || prev > pc) {
        for (let i = 0; i < 14; i++) K.spawn(root, -12.4 + K.R() * 0.4, 0.75, -4.0 + K.R() * 0.6, K.R() * 3.4, 0.8 + Math.random() * 2, K.R() * 3.4, Math.random() < 0.5 ? 0xffd25a : 0xffffff, 0.5, 0.06, 7, true);
        for (let i = 0; i < 5; i++) K.spawn(root, -12.4 + K.R() * 0.8, 0.8, -4.0 + K.R() * 0.8, K.R() * 0.8, 0.6, K.R() * 0.8, 0x8e8474, 1.5, 0.22, -0.1);
      }
      if (!pressL.isDummy) pressL.intensity = pc > 0.96 || pc < 0.05 ? 2.4 : 0.15;
      chuteMouth.material.color.setRGB(1, 0.4 + Math.sin(t * 7) * 0.08, 0.12);
      // aether pulses and capsules in the tubes
      pulses.forEach((p) => { p.u = (p.u + dt * p.sp) % 1; p.m.position.copy(p.curve.getPointAt(p.u)); const k = 0.8 + Math.sin(t * 10 + p.u * 30) * 0.25; p.m.scale.setScalar(k); });
      zips.forEach((z) => { z.u = (z.u + dt * 0.32) % 1; const p = z.curve.getPointAt(z.u), tn = z.curve.getTangentAt(z.u); z.z.position.copy(p); z.z.lookAt(root.localToWorld(p.clone().add(tn))); z.z.rotateY(Math.PI / 2); });
      hubEye.material.color.setHex(Math.sin(t * 5) > 0 ? 0x9affea : 0x2fbfa0);
      if (!hubL.isDummy) hubL.intensity = 1.0 + Math.sin(t * 5) * 0.3;
      // valve steam
      tV -= dt; if (tV <= 0) { tV = 0.35; const v = valves[Math.floor(Math.random() * valves.length)]; for (let i = 0; i < 2; i++) K.spawn(root, v[0], v[1] + 0.1, v[2], K.R() * 0.3, 0.9, K.R() * 0.3, 0x9a8e7c, 1.3, 0.14, -0.12); }
      // aether sparks crackling at conduit collars
      tSp -= dt; if (tSp <= 0) { tSp = 0.18; const p = pulses[Math.floor(Math.random() * pulses.length)].m.position; K.spawn(root, p.x, p.y, p.z, K.R() * 1.5, Math.random() * 1.2, K.R() * 1.5, Math.random() < 0.5 ? 0x9affea : 0xffffff, 0.3, 0.05, 2, true); }
    };
  }

  // =====================================================================
  // ASSEMBLER: clockwork workshop

  function buildAssembler(K) {
    mats(K);

    K.box(4.9, 0.3, 4.9, M.ironM, 0, 0.15, 0, g);

      stacks.push({ col, gs, dir: s % 2 ? 1 : -1 });
    }
    K.cyl(0.12, 0.12, 2.4, M.copper, 8, 0, 1.7, 0, de);
    const dome = K.lathe([[1.15, 0], [1.15, 1.6], [1.05, 2.1], [0.8, 2.5], [0.45, 2.75], [0.05, 2.85]], M.glass, 18, 0, 0.5, 0, de);
    dome.castShadow = false;
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const rb = K.tube([[Math.cos(a) * 1.17, 0.5, Math.sin(a) * 1.17], [Math.cos(a) * 1.17, 2.1, Math.sin(a) * 1.17], [Math.cos(a) * 0.82, 3.0, Math.sin(a) * 0.82], [Math.cos(a) * 0.08, 3.35, Math.sin(a) * 0.08]], 0.035, M.brass, de, 14, 4); }
    band(K, de, 1.17, 2.1, M.brassD, 0.06);

    const deGlow = K.sph(0.18, K.glow(0xffb45a), 0, 3.6, 0, de, 8, 6);

    // copper boiler with gauges (back right)
    const bo = K.group(g, 1.35, 0.39, -1.35);

    K.lathe([[0.76, 0], [0.7, 0.25], [0.45, 0.45], [0.12, 0.55]], M.copperD, 14, 0, 2.5, 0, bo);
    K.cyl(0.12, 0.12, 1.1, M.soot, 8, 0, 3.2, 0, bo);
    K.cyl(0.18, 0.12, 0.2, M.brassD, 8, 0, 3.75, 0, bo);
    const fire = K.box(0.5, 0.42, 0.06, M.ember, 0.0, 0.45, 0.79, bo);
    K.box(0.6, 0.52, 0.04, M.iron, 0.0, 0.45, 0.76, bo);
    for (let i = 0; i < 4; i++) K.box(0.04, 0.42, 0.08, M.soot, -0.18 + i * 0.12, 0.45, 0.81, bo);
    const fireL = K.light(0xff7a30, 1.6, 5, 0.3, 0.6, 1.2, bo);
    // aether cell feeding the workshop (the conduit from the splitter plugs in here)
    const cell = K.group(g, 2.12, 0.39, -0.08);
    K.cyl(0.3, 0.34, 0.2, M.ironM, 10, 0, 0.1, 0, cell);
    K.cyl(0.24, 0.24, 1.0, K.mat(0x8ad8c8, { op: 0.25, shine: 90, spec: 0xffffff, depthWrite: false }), 10, 0, 0.7, 0, cell).castShadow = false;
    const cellCore = K.cyl(0.13, 0.13, 0.85, K.glow(0x7af0d8), 8, 0, 0.7, 0, cell);
    for (const y of [0.25, 0.7, 1.15]) K.torus(0.25, 0.035, M.brass, 4, 12, 0, y, 0, cell).rotation.x = Math.PI / 2;
    K.cyl(0.28, 0.24, 0.14, M.brassD, 10, 0, 1.25, 0, cell);
    for (const a of [0, 2.1, 4.2]) K.box(0.04, 1.0, 0.04, M.ironL, Math.cos(a) * 0.27, 0.7, Math.sin(a) * 0.27, cell);
    K.tube([[2.12, 1.6, -0.08], [2.0, 2.1, -0.5], [1.6, 2.3, -0.9]], 0.05, M.copper, g, 12, 5);

    for (let i = 0; i < 5; i++) K.box(0.5, 0.012, 0.08, M.soot, -1.8 + i * 0.9, 0.393, 2.3 - (i % 2) * 0.1, g);
    const needles = [gauge(K, bo, -0.32, 1.85, 0.74, 0.2, 0.25), gauge(K, bo, 0.32, 1.85, 0.74, 0.2, -0.05), gauge(K, bo, 0.0, 1.3, 0.8, 0.16, 0.1)];
    const gx = gauge(K, bo, 0.8, 1.6, 0.05, 0.18, Math.PI / 2); needles.push(gx);

    K.cyl(0.07, 0.07, 0.4, M.brass, 8, 0.4, 2.9, 0.3, bo);
    const whistle = K.cyl(0.1, 0.06, 0.3, M.brassL, 8, 0.4, 3.2, 0.3, bo);
    // red alarm lamp
    const alarm = K.sph(0.13, K.mat(0x401010, { e: 0x000000 }), -0.4, 2.92, 0.4, bo, 8, 6);
    K.cyl(0.1, 0.13, 0.08, M.brassD, 8, -0.4, 2.8, 0.4, bo);
    // pipe boiler -> engine
    K.tube([[0.75, 1.9, -1.35], [0.2, 2.3, -1.6], [-0.6, 2.4, -1.6], [-1.1, 2.2, -1.5]], 0.07, M.copper, g, 20, 6);
    K.tube([[0.9, 0.9, -0.6], [0.3, 0.6, -0.1], [-0.2, 0.55, -0.1]], 0.06, M.verd, g, 16, 5);

    // workbench + articulated brass arm (front right)
    const bench = K.group(g, 1.2, 0.39, 1.0);

  // ---------- textures ----------
  function cobbleTex(K) {
    return K.canvasTex(128, 128, (g) => {
      let s = 31; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = '#17110d'; g.fillRect(0, 0, 128, 128);
      const tones = ['#3e342b', '#463a2f', '#4c4034', '#3a3028', '#52453a', '#433830'];
      for (let y = 0; y < 128; y += 9) {
        let x = -Math.floor(r() * 8);
        while (x < 128) {
          const w = 7 + Math.floor(r() * 5), h = 7 + Math.floor(r() * 2), oy = Math.floor(r() * 2);
          g.fillStyle = tones[Math.floor(r() * tones.length)]; g.fillRect(x + 1, y + 1 + oy, w - 1, h - 1);
          g.fillRect(x + 2, y + oy, w - 3, 1); g.fillRect(x + 2, y + h + oy - 0, w - 3, 1);
          g.fillStyle = 'rgba(255,220,170,0.09)'; g.fillRect(x + 2, y + 1 + oy, w - 3, 1);
          g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x + 1, y + h - 1 + oy, w - 1, 1);
          x += w;
        }
      }
      for (let i = 0; i < 10; i++) { g.fillStyle = 'rgba(8,5,3,0.32)'; const x = r() * 110, y = r() * 110; g.fillRect(x, y, 10 + r() * 16, 5 + r() * 8); }
      for (let i = 0; i < 4; i++) { g.fillStyle = 'rgba(40,70,60,0.18)'; g.fillRect(r() * 120, r() * 120, 6, 4); }
    }, [9, 4.5]);
  }
  function brickTex(K, rep, dark) {
    return K.canvasTex(64, 64, (g) => {
      let s = 7; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = dark ? '#1c100c' : '#2a1812'; g.fillRect(0, 0, 64, 64);
      const tones = dark ? ['#4a2018', '#3e1c15', '#52251b'] : ['#6e3020', '#62291b', '#7a3826', '#5a2618'];
      for (let y = 0; y < 64; y += 8) for (let x = (y / 8) % 2 ? -8 : 0; x < 64; x += 16) {
        g.fillStyle = tones[Math.floor(r() * tones.length)]; g.fillRect(x + 1, y + 1, 14, 6);
        g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(x + 1, y + 5, 14, 2);
      }
      for (let i = 0; i < 5; i++) { g.fillStyle = 'rgba(8,4,2,0.35)'; g.fillRect(r() * 64, 0, 4 + r() * 8, 64); }
    }, rep);
  }
  function stoneTex(K, rep) {
    return K.canvasTex(64, 64, (g) => {
      let s = 13; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = '#231b15'; g.fillRect(0, 0, 64, 64);
      const tones = ['#5e5142', '#544838', '#675948'];
      for (let y = 0; y < 64; y += 16) for (let x = (y / 16) % 2 ? -12 : 0; x < 64; x += 24) {
        g.fillStyle = tones[Math.floor(r() * 3)]; g.fillRect(x + 1, y + 1, 22, 14);
        g.fillStyle = 'rgba(255,230,190,0.08)'; g.fillRect(x + 2, y + 1, 20, 2);

  }

  // =====================================================================

  function world(K, root) {

      K.box(1.5, 0.15, 0.3, M.ironM, x, -3.1, 6.0, root);
      for (let i = 0; i < 4; i++) K.box(0.06, 1.2, 0.1, M.iron, x - 0.42 + i * 0.28, -2.45, 5.98, root);

    for (let x = -14.6; x < 15; x += 0.7) K.box(0.28, 0.08, 1.3, M.woodD, x, 0.12, 4.7, root);
    const cart = K.group(root, -10, 0.2, 4.7);
    K.box(1.4, 0.7, 0.95, M.ironM, 0, 0.55, 0, cart);
    K.box(1.5, 0.1, 1.05, M.brassD, 0, 0.92, 0, cart);
    for (const sx of [-0.5, 0.5]) for (const sz of [-0.4, 0.4]) { const w = K.cyl(0.18, 0.18, 0.1, M.iron, 10, sx, 0.18, sz, cart); w.rotation.x = Math.PI / 2; }
    for (let i = 0; i < 6; i++) K.rock(0.18 + K.rnd() * 0.08, K.mat([0x8a4a2a, 0x4a5a6e, 0x8a7240][i % 3], { e: [0x5a1a06, 0x0a1830, 0x3a2606][i % 3] }), -0.45 + (i % 3) * 0.45, 1.0, (i < 3 ? -0.2 : 0.2), cart);

    // back factory wall with arched windows and wall gears
    const brick = K.mat(0xffffff, { map: brickTex(K, [8, 1.2]) });
    K.box(30, 3.6, 0.7, brick, 0, 1.8, -6.6, root);
    K.box(30.2, 0.25, 0.9, M.stoneD, 0, 3.7, -6.6, root);
    K.box(30.2, 0.3, 0.9, M.stoneD, 0, 0.15, -6.6, root);
    const winGlow = K.glow(0xffa85a);
    const winGlowDim = K.glow(0x6a3a1a);
    const windows = [];
    for (let x = -13; x <= 13; x += 2.6) {

      K.box(1.1, 0.12, 0.25, M.stoneD, x, 1.1, -6.18, root);

    }
    const wallGears = [];
    for (const [x, r, y] of [[-5.2, 1.0, 1.9], [-3.9, 0.55, 2.8], [2.6, 0.9, 1.8], [3.7, 0.5, 2.7]]) {
      const gr = gear(K, root, r, 0.16, Math.round(r * 16), M.brass, x, y, -6.18); gr.rotation.x = Math.PI / 2; wallGears.push({ g: gr, s: 1 / r });
    }

    K.tube([[15, 2.9, -6.0], [9.5, 2.9, -6.0], [9, 2.6, -5.6], [9, 0.3, -5.6]], 0.14, M.copper, root, 30, 6);
    K.tube([[-15, 0.6, -6.0], [15, 0.6, -6.0]], 0.1, M.verd, root, 30, 6);
    for (const x of [-12, -6, 0, 6, 12]) { const v = K.torus(0.2, 0.04, M.red ? K.mat(0x8a2a1a) : M.brass, 6, 12, x, 0.6, -5.82, root); }
    for (const x of [-8.5, 9]) { const v = K.torus(0.28, 0.05, K.mat(0x9a2a18), 6, 14, x, 1.6, -5.35, root); v.rotation.x = Math.PI / 2; }

      K.cyl(r * 1.25, r * 1.25, 0.1, M.brassD, 10, x, h - 0.6, z, root);

    // distant skyline + gasometer

    for (let x = -18; x < 18;) {
      const w = 1.5 + K.rnd() * 2.5, h = 0.8 + K.rnd() * 2.6, z = -13 - K.rnd() * 4;
      K.box(w, h, 2, K.rnd() < 0.5 ? sil : silD, x + w / 2, h / 2, z, root);
      for (let i = 0; i < Math.floor(w / 0.7); i++) { const tr = K.box(0.7, 0.5, 2, sil, x + 0.35 + i * 0.7, h + 0.2, z, root); tr.rotation.z = 0.55; tr.scale.y = 0.8; }
      if (K.rnd() < 0.55) { const cx = x + w * K.rnd(); K.cyl(0.18, 0.22, 1.8, silD, 6, cx, h + 0.9, z, root); chimTops.push([cx, h + 1.8, z, 0.18, true]); }
      if (K.rnd() < 0.7) for (let i = 0; i < 3; i++) if (K.rnd() < 0.5) K.box(0.18, 0.22, 0.05, K.glow(0xd88a3a), x + 0.4 + K.rnd() * (w - 0.8), 0.4 + K.rnd() * (h - 0.6), z + 1.03, root);
      x += w + 0.2;
    }
    const gaso = K.group(root, 9.5, 0, -15);
    K.cyl(2.2, 2.2, 2.4, K.mat(0x3a2a20), 16, 0, 1.2, 0, gaso);
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; K.box(0.12, 3.4, 0.12, silD, Math.cos(a) * 2.35, 1.7, Math.sin(a) * 2.35, gaso); }
    for (const y of [1.2, 2.4, 3.3]) K.torus(2.35, 0.05, silD, 4, 24, 0, y, 0, gaso).rotation.x = Math.PI / 2;

    // airship drifting in the sky
    const ship = K.group(root, -16, 4.3, -10.5);
    const env = K.sph(1, K.mat(0x8a6a48, { shine: 8 }), 0, 0, 0, ship, 16, 10); env.scale.set(2.4, 0.75, 0.75);
    for (let i = -2; i <= 2; i++) { const rib = K.torus(0.76 * Math.sqrt(1 - (i / 2.6) ** 2), 0.03, M.brassD, 4, 18, i * 0.85, 0, 0, ship); rib.rotation.y = Math.PI / 2; rib.scale.set(1, 1, 1); }
    K.box(4.6, 0.04, 0.05, M.brassD, 0, 0.0, 0.76, ship);
    for (const [y, z] of [[0.7, 0], [0, 0.7], [0, -0.7]]) { const f = K.box(0.8, y ? 0.6 : 0.05, z ? 0.6 : 0.05, M.leather, -2.3, y * 0.6, z * 0.6, ship); }
    const gond = K.group(ship, 0.2, -0.95, 0);
    K.box(1.4, 0.32, 0.4, M.wood, 0, 0, 0, gond); K.box(1.5, 0.06, 0.46, M.brass, 0, 0.17, 0, gond);
    for (let i = 0; i < 4; i++) K.box(0.14, 0.1, 0.02, M.gas, -0.5 + i * 0.32, 0.02, 0.21, gond);
    for (const x of [-0.5, 0.5]) { K.box(0.03, 0.55, 0.03, M.iron, x, 0.42, 0.15, gond); K.box(0.03, 0.55, 0.03, M.iron, x, 0.42, -0.15, gond); }
    const prop = K.group(ship, -2.75, -0.1, 0);
    K.box(0.04, 0.9, 0.1, M.woodD, 0, 0, 0, prop);

    // gas lamps (warm point lights), barrels, crates, steam vents
    const lamps = [lamp(K, root, -4, 3.2, 2.6, true), lamp(K, root, 4, 3.2, 2.6, true), lamp(K, root, -12.4, 2.6, 2.6, true), lamp(K, root, 12.4, 2.6, 2.6, true)];
    function barrel(x, z, m) { const b = K.group(root, x, 0, z); K.cyl(0.32, 0.3, 0.8, m || M.wood, 10, 0, 0.4, 0, b); band(K, b, 0.33, 0.15, M.iron, 0.06); band(K, b, 0.33, 0.65, M.iron, 0.06); return b; }
    function crate(x, z, s, ry) { const c = K.box(s, s, s, M.woodD, x, s / 2, z, root); c.rotation.y = ry || 0; K.box(s * 1.02, 0.07, s * 1.02, M.wood, x, s - 0.04, z, root).rotation.y = ry || 0; return c; }
    barrel(-13.2, 0.6); barrel(-12.6, 1.2, M.copperD); barrel(-13.3, 1.5); barrel(13.3, -1.2, M.verdD); barrel(12.8, -0.6);

    for (let i = 0; i < 14; i++) K.rock(0.18 + K.rnd() * 0.18, M.soot, 4.4 + K.rnd() * 1.4, 0.12, -3.6 - K.rnd() * 1.2, root);
    const vents = [[-4.2, -2.6], [4.2, 1.8], [-12, 4.0], [11.6, -3.5]];
    for (const [x, z] of vents) { K.box(0.7, 0.06, 0.7, M.ironM, x, 0.11, z, root); for (let i = 0; i < 4; i++) K.box(0.6, 0.07, 0.05, M.soot, x, 0.13, z - 0.24 + i * 0.16, root); }
    // ground pipes between machines
    K.tube([[-5.6, 0.25, -3.2], [-4.6, 0.25, -3.6], [-3.0, 0.25, -3.6], [-2.4, 0.25, -2.8]], 0.12, M.copper, root, 20, 6);
    K.tube([[2.6, 0.25, -2.6], [3.4, 0.25, -3.4], [5.0, 0.25, -3.4], [5.6, 0.25, -2.8]], 0.12, M.copper, root, 20, 6);

    return { update(t, dt) {
      furnFlick(t);
      cart.position.x += dt * 0.9; if (cart.position.x > 15.5) cart.position.x = -15.5;
      ship.position.x = -16 + ((t * 0.35) % 34); ship.position.y = 4.3 + Math.sin(t * 0.6) * 0.12; prop.rotation.x += dt * 14;

      tCh -= dt;
      if (tCh <= 0) { tCh = 0.12; chimTops.forEach(([x, y, z, r, far]) => { if (far && Math.random() < 0.5) return; K.spawn(root, x + K.R() * r, y, z + K.R() * r, 0.35 + K.R() * 0.2, 0.7 + Math.random() * 0.3, K.R() * 0.2, Math.random() < 0.5 ? 0x2c241f : 0x3e342c, far ? 3 : 4.2, far ? 0.22 : 0.42, -0.08); }); }
      tV -= dt;
      if (tV <= 0) { tV = 0.25; const v = vents[Math.floor(Math.random() * vents.length)]; for (let i = 0; i < 3; i++) puff(K, root, v[0], 0.2, v[1], 0x9a8e7c, 0.18, 0.9, 0.4, 1.6); }
    } };
  }

  // =====================================================================
  // ASSEMBLER: clockwork workshop

  function buildAssembler(K) {
    mats(K);
    const g = K.group();
    // plinth
    K.box(4.9, 0.3, 4.9, M.ironM, 0, 0.15, 0, g);
    K.box(5.0, 0.08, 5.0, M.brassD, 0, 0.32, 0, g);
    for (let i = 0; i < 9; i++) { K.box(0.08, 0.08, 0.08, M.brassL, -2.3 + i * 0.575, 0.2, 2.47, g); K.box(0.08, 0.08, 0.08, M.brassL, 2.47, 0.2, -2.3 + i * 0.575, g); }
    const floor = K.box(4.6, 0.04, 4.6, K.mat(0x3a2c22), 0, 0.37, 0, g);
    for (let i = 0; i < 6; i++) K.box(4.6, 0.02, 0.04, M.soot, 0, 0.395, -2.1 + i * 0.84, g);

    // difference engine under a glass dome (back left)
    const de = K.group(g, -1.1, 0.39, -1.1);
    K.cyl(1.25, 1.35, 0.5, M.iron, 16, 0, 0.25, 0, de);
    band(K, de, 1.3, 0.5, M.brass, 0.1);
    rivetRing(K, de, 1.33, 0.3, 16);
    const stacks = [];
    for (let s = 0; s < 4; s++) {
      const a = s / 4 * Math.PI * 2 + 0.4, sx = Math.cos(a) * 0.55, sz = Math.sin(a) * 0.55;
      K.cyl(0.04, 0.04, 2.3, M.ironL, 6, sx, 1.65, sz, de);
      const col = K.group(de, sx, 0, sz); const gs = [];
      for (let i = 0; i < 6; i++) { const r = 0.3 + ((i + s) % 3) * 0.06; gs.push(gear(K, col, r, 0.08, 10 + ((i + s) % 3) * 2, i % 2 ? M.brass : M.brassL, 0, 0.75 + i * 0.32, 0)); }
      stacks.push({ col, gs, dir: s % 2 ? 1 : -1 });
    }
    K.cyl(0.12, 0.12, 2.4, M.copper, 8, 0, 1.7, 0, de);
    const dome = K.lathe([[1.15, 0], [1.15, 1.6], [1.05, 2.1], [0.8, 2.5], [0.45, 2.75], [0.05, 2.85]], M.glass, 18, 0, 0.5, 0, de);
    dome.castShadow = false;
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const rb = K.tube([[Math.cos(a) * 1.17, 0.5, Math.sin(a) * 1.17], [Math.cos(a) * 1.17, 2.1, Math.sin(a) * 1.17], [Math.cos(a) * 0.82, 3.0, Math.sin(a) * 0.82], [Math.cos(a) * 0.08, 3.35, Math.sin(a) * 0.08]], 0.035, M.brass, de, 14, 4); }
    band(K, de, 1.17, 2.1, M.brassD, 0.06);
    K.cyl(0.2, 0.3, 0.25, M.brass, 10, 0, 3.4, 0, de);
    K.cone(0.08, 0.6, M.brassL, 6, 0, 3.8, 0, de);
    const deGlow = K.sph(0.18, K.glow(0xffb45a), 0, 3.6, 0, de, 8, 6);

    // copper boiler with gauges (back right)

    const hemi = new THREE.HemisphereLight(L.hemiSky || 0xd6deff, L.hemiGnd || 0x40344a, L.hemiI === undefined ? 0.6 : L.hemiI); scene.add(hemi);
    const sun = new THREE.DirectionalLight(L.sun || 0xfff0d2, L.sunI === undefined ? 0.9 : L.sunI);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 });
    sun.shadow.bias = -0.0008;
    scene.add(sun, sun.target);
    const root = K.group(scene); root.rotation.y = Math.PI / 4;
    const env = s.world(K, root, scene) || { update() {} };
    const comps = s.components.map((c, i) => {
      const holder = K.group(root, K.SLOTS[i], 0, 0); holder.rotation.y = -Math.PI / 4;
      const inst = c.build(K);
      holder.add(inst.g);
      return { def: c, inst, holder, si: Math.min(1, c.states.length - 1) };
    });
    return { s, scene, sun, hemi, root, env, comps, sunDir: new THREE.Vector3().fromArray(L.sunDir || [10, 22, 6]) };
  }

  let cur = null, focus = -1;
  function show(id) {
    const s = styles.find((x) => x.id === id) || styles[0];
    if (!worlds[s.id]) worlds[s.id] = buildWorld(s);
    cur = worlds[s.id];
    document.documentElement.style.setProperty('--accent', s.accent || '#f2a93b');
    setFinish(s.finish || {});
    focus = -1; targetGoal.set(0, 1.6, 0); viewGoal = fitAll();
    renderTabs(); renderMood(); renderLabels();
    try { localStorage.setItem('shiptorio-diorama', s.id); } catch (e) {}
  }
  SHIP.show = show;
  SHIP.focus = (i) => focusOn(i);

  function fitAll() { const a = W / H; return Math.max(12, Math.min(26, 25 / Math.max(a, 0.6))); }
  function focusOn(i) {
    focus = i; const c = cur.comps[i];
    c.holder.getWorldPosition(K.v3); targetGoal.set(K.v3.x, 2.1, K.v3.z); viewGoal = W / H < 1 ? 11 : 8.5;
    renderMood();
  }
  function unfocus() { focus = -1; targetGoal.set(0, 1.6, 0); viewGoal = fitAll(); renderMood(); }

  // ---------- UI ----------
  function renderTabs() {
    const nav = $('tabs'); nav.innerHTML = '';
    styles.forEach((s) => { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = s.name; b.setAttribute('aria-pressed', cur && cur.s === s); b.onclick = () => show(s.id); nav.appendChild(b); });
  }
  function renderMood() {
    const s = cur.s;
    $('m-eyebrow').textContent = 'MOOD BOARD · ' + (s.eyebrow || 'WORLD');
    $('m-name').textContent = s.name; $('m-pitch').textContent = s.pitch;
    const sw = $('m-sw'); sw.innerHTML = ''; (s.palette || []).forEach((h) => { const i = document.createElement('i'); i.style.background = h; sw.appendChild(i); });
    const kw = $('m-kw'); kw.innerHTML = ''; (s.keywords || []).forEach((k) => { const sp = document.createElement('span'); sp.textContent = k; kw.appendChild(sp); });
    const root = $('m-comps'); root.innerHTML = '';
    cur.comps.forEach((c, i) => {
      const el = document.createElement('div'); el.className = 'comp'; el.tabIndex = 0; el.setAttribute('aria-current', focus === i);
      el.innerHTML = '<b></b><p></p><div class="states"></div>';
      el.querySelector('b').textContent = c.def.name; el.querySelector('p').textContent = c.def.blurb;
      const st = el.querySelector('.states');
      c.def.states.forEach((name, j) => { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = name; b.setAttribute('aria-pressed', j === c.si); b.onclick = (e) => { e.stopPropagation(); c.si = j; renderMood(); }; st.appendChild(b); });
      el.onclick = () => (focus === i ? unfocus() : focusOn(i));
      el.onkeydown = (e) => { if (e.key === 'Enter' && e.target === el) el.onclick(); };
      root.appendChild(el);
    });
  }
  let showLabels = true;
  function renderLabels() {
    const root = $('labels'); root.innerHTML = '';
    cur.comps.forEach((c, i) => { const b = document.createElement('button'); b.className = 'label'; b.textContent = c.def.name; b.onclick = () => focusOn(i); root.appendChild(b); c.label = b; });
  }
  const pv = new THREE.Vector3();
  function placeLabels() {
    cur.comps.forEach((c) => {
      if (!showLabels || focus >= 0) { c.label.style.display = 'none'; return; }
      c.holder.getWorldPosition(pv); pv.y = -0.2; pv.x += 1.6; pv.z += 1.6; pv.project(cam);
      c.label.style.display = 'block';
      c.label.style.transform = 'translate(' + Math.round((pv.x + 1) / 2 * W) + 'px,' + Math.round((1 - pv.y) / 2 * H) + 'px) translate(-50%,0)';
    });
  }
  document.querySelectorAll('[data-px]').forEach((b) => b.onclick = () => { pxSel = +b.dataset.px; syncPx(); });
  function syncPx() { document.querySelectorAll('[data-px]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.px === pxSel)); }
  $('b-all').onclick = unfocus;
  let cycle = false, cycleT = 0;
  $('b-cycle').onclick = (e) => { cycle = !cycle; e.currentTarget.setAttribute('aria-pressed', cycle); };
  $('b-labels').onclick = (e) => { showLabels = !showLabels; e.currentTarget.setAttribute('aria-pressed', showLabels); };
  $('hide').onclick = () => { $('mood').hidden = true; $('showMood').hidden = false; };
  $('showMood').onclick = () => { $('mood').hidden = false; $('showMood').hidden = true; };
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') unfocus(); });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - drag.x; drag.x = e.clientX; cur.root.rotation.y += dx * 0.004; });
  const end = () => (drag = null); canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(2.5, zoom * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  function resize() { W = window.innerWidth; H = window.innerHeight; renderer.setSize(W, H, false); if (cur && focus < 0) viewGoal = fitAll(); }
  window.addEventListener('resize', resize);

  // ---------- loop ----------
  resize();
  if (window.innerWidth < 820) { showLabels = false; $('b-labels').setAttribute('aria-pressed', 'false'); }
  let start = null; try { start = localStorage.getItem('shiptorio-diorama'); } catch (e) {}
  const qs = new URLSearchParams(location.search).get('style');
  show(qs || start || styles[0].id); syncPx();
  target.copy(targetGoal); viewH = viewGoal;
  $('loading').hidden = true;
  let last = performance.now(), t = 0;
  const yaw = Math.PI / 4, tilt = 30 * Math.PI / 180, D = 60;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; t += dt;
    const w = cur;
    if (cycle) { cycleT += dt; if (cycleT > 3.5) { cycleT = 0; w.comps.forEach((c) => (c.si = (c.si + 1) % c.def.states.length)); renderMood(); } }
    w.env.update && w.env.update(t, dt);
    w.comps.forEach((c) => c.inst.update(t, dt, c.def.states[c.si]));
    SHIP._fx.updateFx(dt);
    const k = 1 - Math.exp(-dt * 5); target.lerp(targetGoal, k); viewH += (viewGoal - viewH) * k;
    const a = W / H, vh = viewH * zoom;
    cam.left = -vh * a / 2; cam.right = vh * a / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
    cam.position.set(target.x + D * Math.cos(tilt) * Math.sin(yaw), target.y + D * Math.sin(tilt), target.z + D * Math.cos(tilt) * Math.cos(yaw)); cam.lookAt(target);
    w.sun.position.copy(w.sunDir).add(new THREE.Vector3(target.x, 0, target.z)); w.sun.target.position.set(target.x, 0, target.z);
    const px = pxSel === 0 ? 1 : pxSel;
    const rw = Math.max(1, Math.ceil(W / px)), rh = Math.max(1, Math.ceil(H / px));
    if (rt.width !== rw || rt.height !== rh) rt.setSize(rw, rh);
    post.uniforms.res.value.set(rw, rh); post.uniforms.smoothMode.value = pxSel === 0 ? 1 : 0;
    renderer.setRenderTarget(rt); renderer.render(w.scene, cam);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    placeLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
