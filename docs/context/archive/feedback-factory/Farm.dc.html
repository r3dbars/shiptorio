<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback Farm · pixel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B3F1D}a:hover{color:#3B2210}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob .8s steps(2) infinite}
@keyframes fly{0%{transform:translate(-140px,-60px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,0);opacity:0}}
.fly{animation:fly 3s steps(14) infinite}
@keyframes walkx{0%{transform:translateX(0)}45%{transform:translateX(360px)}50%{transform:translateX(360px) scaleX(-1)}95%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0)}}
.walkx{animation:walkx 9s steps(36) infinite}
@keyframes walky{0%{transform:translateY(0)}45%{transform:translateY(300px)}55%{transform:translateY(300px)}100%{transform:translateY(0)}}
.walky{animation:walky 8s steps(30) infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.drip{animation:drip .6s steps(4) infinite}
@keyframes bang{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bang{animation:bang .6s steps(2) infinite}
@keyframes cart0{0%{transform:translateX(0)}85%{transform:translateX(250px);opacity:1}100%{transform:translateX(250px);opacity:0}}
@keyframes cart1{0%{transform:translateX(0)}85%{transform:translateX(250px);opacity:1}100%{transform:translateX(250px);opacity:0}}
.cart0{animation:cart0 3s steps(20) forwards}
.cart1{animation:cart1 3s steps(20) forwards}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
.sway{animation:sway 2.4s steps(2) infinite;transform-origin:bottom center}
@keyframes sparkle{0%,100%{opacity:0}50%{opacity:1}}
.sparkle{animation:sparkle 1.2s steps(2) infinite}
</style>
</helmet>
<div style="width: 1120px; height: 840px; box-sizing: border-box; padding: 24px; background: #2B1A0E; color: #3B2210; font-family: 'VT323', monospace; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #E8C38A; border: 4px solid #6B3F1D; box-shadow: inset 0 0 0 3px #C08040; padding: 0 16px">
    <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 26px; font-weight: 700">Feedback Farm</span>
    <div style="display: flex; gap: 22px; font-size: 24px">
      <span>Mon. 9 · {{clock}}</span>
      <span>Shipped <b style="font-family: 'Pixelify Sans', sans-serif">{{released}}</b></span>
      <span>Happy <b style="font-family: 'Pixelify Sans', sans-serif">{{happy}}</b></span>
      <span style="color: #9A5A00">★ {{rating}}</span>
    </div>
  </header>

  <div style="position: relative; height: 540px; border: 4px solid #3B2210; background-color: #5BA83A; background-image: linear-gradient(45deg, rgba(0,0,0,.06) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.06) 75%), linear-gradient(45deg, rgba(0,0,0,.06) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.06) 75%); background-size: 32px 32px; background-position: 0 0, 16px 16px; overflow: hidden">

    <div style="position: absolute; left: 0; right: 0; top: 462px; height: 48px; background: #C9A26B; border-top: 4px solid #A8834F; border-bottom: 4px solid #A8834F"></div>
    <div style="position: absolute; left: 776px; top: 196px; width: 44px; height: 270px; background: #C9A26B; border-left: 4px solid #A8834F; border-right: 4px solid #A8834F"></div>

    <div class="sway" style="position: absolute; left: -7px; top: 4px; width: 7px; height: 7px; box-shadow: {{tree}}"></div>
    <div class="sway" style="position: absolute; left: -7px; top: 330px; width: 7px; height: 7px; box-shadow: {{tree}}"></div>
    <div class="sway" style="position: absolute; left: 960px; top: 210px; width: 7px; height: 7px; box-shadow: {{tree}}"></div>

    <div style="position: absolute; left: 60px; top: 170px; width: 5px; height: 5px; box-shadow: {{mailbox}}"></div>
    <div class="fly" style="position: absolute; left: 70px; top: 178px; width: 18px; height: 12px; background: #FFFFFF; border: 2px solid #3B2210"></div>
    <div class="fly" style="position: absolute; left: 70px; top: 178px; width: 18px; height: 12px; background: #FFF4D6; border: 2px solid #3B2210; animation-delay: 1s"></div>
    <div class="fly" style="position: absolute; left: 70px; top: 178px; width: 18px; height: 12px; background: #FFFFFF; border: 2px solid #3B2210; animation-delay: 2s"></div>
    <div style="position: absolute; left: 34px; top: 236px; background: #E8C38A; border: 3px solid #6B3F1D; padding: 2px 8px; font-size: 20px">Inbox · {{incoming}}</div>

    <div class="bob" style="position: absolute; left: 150px; top: 190px; width: 5px; height: 5px; box-shadow: {{robotPurple}}"></div>
    <div style="position: absolute; left: 132px; top: 152px; background: #FFFFFF; border: 3px solid #3B2210; padding: 0 6px; font-size: 18px">sorting...</div>
    <div style="position: absolute; left: 130px; top: 240px; font-size: 18px; color: #1F3B12">Claude</div>

    <sc-for list="{{plots}}" as="p" hint-placeholder-count="4">
      <div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: 160px; height: 150px; box-sizing: border-box; background-color: #7A4E2D; background-image: repeating-linear-gradient(0deg, #6A4024 0 4px, transparent 4px 14px); border: 4px solid #5A3519">
        <sc-for list="{{p.crops}}" as="c" hint-placeholder-count="9">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 5px; height: 5px; box-shadow: {{c.shadow}}"></div>
        </sc-for>
        <sc-if value="{{p.ripe}}" hint-placeholder-val="{{false}}">
          <div class="sparkle" style="position: absolute; right: 8px; top: 6px; width: 8px; height: 8px; background: #FFF27A"></div>
        </sc-if>
      </div>
      <div style="position: absolute; left: {{p.left}}px; top: {{p.labelTop}}px; width: 160px; display: flex; flex-direction: column; gap: 2px">
        <div style="background: #E8C38A; border: 3px solid #6B3F1D; padding: 0 6px; font-size: 18px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</div>
        <div style="height: 8px; background: #3B2210; border: 2px solid #3B2210"><div style="height: 8px; width: {{p.pct}}%; background: #7CD34A"></div></div>
      </div>
    </sc-for>

    <div class="walkx" style="position: absolute; left: 270px; top: 196px">
      <div class="bob" style="width: 5px; height: 5px; box-shadow: {{robotAmber}}"></div>
      <div class="drip" style="position: absolute; left: 46px; top: 26px; width: 4px; height: 6px; background: #4FC3F7"></div>
    </div>
    <div class="walky" style="position: absolute; left: 448px; top: 16px">
      <div class="bob" style="width: 5px; height: 5px; box-shadow: {{robotBlue}}"></div>
      <div class="drip" style="position: absolute; left: 46px; top: 26px; width: 4px; height: 6px; background: #4FC3F7; animation-delay: .3s"></div>
    </div>

    <div style="position: absolute; left: 700px; top: 20px; width: 200px; height: 176px">
      <div style="position: absolute; left: 60px; top: 0; width: 80px; height: 16px; background: #6B2A1F"></div>
      <div style="position: absolute; left: 30px; top: 16px; width: 140px; height: 16px; background: #7E3324"></div>
      <div style="position: absolute; left: 0; top: 32px; width: 200px; height: 18px; background: #6B2A1F"></div>
      <div style="position: absolute; left: 10px; top: 50px; width: 180px; height: 126px; background: #B5432F; background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 4px, transparent 4px 20px)"></div>
      <div style="position: absolute; left: 70px; top: 96px; width: 60px; height: 80px; background: #F2E6D0; border: 4px solid #F2E6D0; box-sizing: border-box; background-image: linear-gradient(#5A2418, #5A2418)"></div>
      <div style="position: absolute; left: 88px; top: 60px; width: 24px; height: 24px; background: #F2E6D0; border: 4px solid #F2E6D0; box-sizing: border-box; background-image: linear-gradient(#3B2210,#3B2210)"></div>
      <sc-if value="{{hasCrates}}" hint-placeholder-val="{{true}}">
        <div class="bang" style="position: absolute; left: 176px; top: -6px; width: 30px; height: 34px; background: #FFFFFF; border: 3px solid #3B2210; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; color: #D9443B">!</div>
      </sc-if>
    </div>
    <div style="position: absolute; left: 700px; top: 200px; background: #E8C38A; border: 3px solid #6B3F1D; padding: 0 8px; font-size: 18px">Barn · {{crates}} ready for you</div>

    <sc-for list="{{crateList}}" as="k" hint-placeholder-count="3">
      <div style="position: absolute; left: {{k.left}}px; top: {{k.top}}px; width: 5px; height: 5px; box-shadow: {{crate}}"></div>
    </sc-for>

    <div class="{{cartClass}}" style="position: absolute; left: 720px; top: 440px">
      <div style="width: 5px; height: 5px; box-shadow: {{cart}}"></div>
    </div>

    <div style="position: absolute; left: 1000px; top: 380px; width: 8px; height: 90px; background: #5A3519"></div>
    <div style="position: absolute; left: 1052px; top: 380px; width: 8px; height: 90px; background: #5A3519"></div>
    <div style="position: absolute; left: 990px; top: 370px; width: 80px; height: 40px; box-sizing: border-box; background: #E8C38A; border: 3px solid #6B3F1D; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
      <span style="font-size: 16px">to town</span>
      <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700">{{released}}</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 12px; min-height: 0">
    <div style="flex-grow: 1; box-sizing: border-box; background: #F2DDB0; border: 4px solid #6B3F1D; box-shadow: inset 0 0 0 3px #C08040; padding: 14px 18px; display: flex; gap: 16px; align-items: center">
      <div style="width: 84px; height: 84px; flex-shrink: 0; background: #C9A26B; border: 4px solid #6B3F1D; position: relative">
        <div style="position: absolute; left: 12px; top: 12px; width: 7px; height: 7px; box-shadow: {{portrait}}"></div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700">Claude</span>
        <span style="font-size: 24px; line-height: 1.1">{{line}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button type="button" onClick="{{inspect}}" disabled="{{noCrates}}" style="min-width: 170px; min-height: 44px; background: #7CD34A; border: 4px solid #2F6B1A; color: #1F3B12; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer">Ship a crate</button>
        <button type="button" onClick="{{sendBack}}" disabled="{{noCrates}}" style="min-width: 170px; min-height: 44px; background: #E8C38A; border: 4px solid #6B3F1D; color: #3B2210; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; cursor: pointer">Send it back</button>
      </div>
    </div>
    <div style="width: 300px; box-sizing: border-box; background: #F2DDB0; border: 4px solid #6B3F1D; box-shadow: inset 0 0 0 3px #C08040; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700">Shipped today</span>
      <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
        <span style="font-size: 20px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">✓ {{l}}</span>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":840}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.NAMES = ['Bg recording · 14', 'Speaker names · 9', 'Cell sync · 4', 'Notion export · 6'];
    this.FIX = ['Bg recording', 'Speaker names', 'Cell sync', 'Notion export'];
    this.state = { grow: [0.85, 0.55, 0.3, 0.1], crates: 2, crateNames: ['Crash fix', 'Scroll lag'], released: 12, happy: 41, rating: 4.3, cartN: 0, cartOn: false, minutes: 640, incoming: 23, log: ['Faster transcript load', 'Empty meeting crash', 'Reminders dupes'], line: '' };
  }

  sprite(rows, pal, px) {
    const out = [];
    rows.forEach((r, y) => {
      for (let x = 0; x < r.length; x += 1) {
        const col = pal[r[x]];
        if (col) out.push((x + 1) * px + 'px ' + (y + 1) * px + 'px 0 ' + col);
      }
    });
    return out.join(',');
  }

  robot(body, dark) {
    return this.sprite([
      '...aa...',
      '..aaaa..',
      '.bbbbbb.',
      '.bwbbwb.',
      '.bbbbbb.',
      '..cccc..',
      '.cccccc.',
      '.c.cc.c.',
      '..d..d..'
    ], { a: '#2B2B2B', b: body, w: '#1B1B1B', c: dark, d: '#2B2B2B' }, 5);
  }

  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState((s) => {
        const grow = s.grow.slice();
        let crates = s.crates, names = s.crateNames.slice();
        const rates = [0.05, 0.035, 0.06, 0.03];
        for (let i = 0; i < 4; i += 1) {
          grow[i] += rates[i];
          if (grow[i] >= 1) {
            grow[i] = 0;
            if (crates < 8) { crates += 1; names.push(this.FIX[i]); }
          }
        }
        return { grow, crates, crateNames: names, minutes: s.minutes + 10, incoming: s.incoming + (Math.random() < 0.4 ? 1 : 0) };
      });
    }, 1000);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.cartTimer);
  }

  ship(good) {
    if (this.state.cartOn || this.state.crates === 0) return;
    if (!good) {
      this.setState((s) => ({ crates: s.crates - 1, crateNames: s.crateNames.slice(1), grow: s.grow.map((g, i) => (i === 0 ? Math.min(g, 0.4) : g)), line: 'Okay, back to the field with that one. The bots will redo it.' }));
      return;
    }
    const name = this.state.crateNames[0] || 'Fix';
    this.setState((s) => ({ cartOn: true, cartN: s.cartN + 1, crates: s.crates - 1, crateNames: s.crateNames.slice(1), line: 'Loading the cart with "' + name + '". Off to town!' }));
    this.cartTimer = setTimeout(() => {
      this.setState((s) => ({ cartOn: false, released: s.released + 1, happy: s.happy + 6, rating: Math.min(5, s.rating + 0.05), log: [name].concat(s.log).slice(0, 4), line: 'The town got "' + name + '". 6 more happy people.' }));
    }, 3000);
  }

  renderVals() {
    const s = this.state;
    const g = '#2F7D32', G = '#4CAF50', o = '#FF7043';
    const sprout = this.sprite(['......', '......', '...g..', '.g.g..', '..gg..', '..g...'], { g: G }, 5);
    const mid = this.sprite(['..g...', '.ggg..', 'gg.gg.', '.ggg..', '..g...', '..g...'], { g: G }, 5);
    const ripe = this.sprite(['.o.o..', 'ogogo.', '.ggg..', 'gg.gg.', '.ggg..', '..g...'], { g: g, o: o }, 5);
    const pos = [[0, 30], [1, 30], [0, 250], [1, 250]];
    const plots = s.grow.map((v, i) => {
      const left = pos[i][0] ? 500 : 280;
      const top = pos[i][1];
      const shadow = v > 0.75 ? ripe : v > 0.35 ? mid : sprout;
      const crops = [];
      for (let r = 0; r < 3; r += 1) for (let c = 0; c < 3; c += 1) crops.push({ x: 8 + c * 46, y: 6 + r * 44, shadow: shadow });
      return { left, top, labelTop: top + 154, name: this.NAMES[i], pct: Math.round(v * 100), crops, ripe: v > 0.75 };
    });
    const crateList = [];
    for (let k = 0; k < Math.min(s.crates, 8); k += 1) crateList.push({ left: 650 + (k % 4) * 46, top: 236 + Math.floor(k / 4) * 46 });
    const h = Math.floor(s.minutes / 60) % 24, m = s.minutes % 60;
    const clock = ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? 'am' : 'pm');
    const defaultLine = s.crates > 0
      ? s.crates + ' crate' + (s.crates > 1 ? 's' : '') + ' of fixes waiting at the barn. Next up: "' + s.crateNames[0] + '". Tests passed.'
      : 'Nothing ready yet. The bots are watering. Go grab a coffee.';
    return {
      clock,
      released: s.released,
      happy: s.happy,
      rating: s.rating.toFixed(1),
      incoming: s.incoming,
      plots,
      crates: s.crates,
      hasCrates: s.crates > 0,
      noCrates: s.crates === 0 || s.cartOn,
      crateList,
      cartClass: s.cartOn ? 'cart' + (s.cartN % 2) : '',
      line: s.line || defaultLine,
      log: s.log,
      inspect: () => this.ship(true),
      sendBack: () => this.ship(false),
      tree: this.sprite(['..gggg..', '.gGgggg.', 'gggGgggg', 'ggggggGg', '.gGggggg', '..gggg..', '...tt...', '...tt...', '...tt...', '..tttt..'], { g: '#2F7D32', G: '#43A047', t: '#7A4E2D' }, 7),
      mailbox: this.sprite(['.rrrrr..', 'rrrrrrr.', 'rwwwwrr.', 'rrrrrrrf', 'rrrrrrrf', '...p...f', '...p....', '...p....', '...p....', '..ppp...'], { r: '#3E6FB5', w: '#1B2A45', f: '#D9443B', p: '#7A4E2D' }, 5),
      crate: this.sprite(['bbbbbbbb', 'bmmmmmmb', 'bmbmmbmb', 'bmmbbmmb', 'bmmbbmmb', 'bmbmmbmb', 'bmmmmmmb', 'bbbbbbbb'], { b: '#6B3F1D', m: '#C08040' }, 5),
      cart: this.sprite(['....bbbbb...', '....bmmmb...', '....bmbmb...', 'pppppppppppp', 'p..........p', 'pppppppppppp', '.kk......kk.', '.kk......kk.'], { b: '#6B3F1D', m: '#C08040', p: '#8D5A2B', k: '#2A2A2A' }, 5),
      robotAmber: this.robot('#F2A93B', '#B9771A'),
      robotBlue: this.robot('#7AA7FF', '#3F6CC9'),
      robotPurple: this.robot('#D58CFF', '#9150B8'),
      portrait: this.sprite(['...aa...', '..aaaa..', '.bbbbbb.', '.bwbbwb.', '.bbbbbb.', '..cccc..', '.cccccc.', '.cccccc.'], { a: '#2B2B2B', b: '#D58CFF', w: '#1B1B1B', c: '#9150B8' }, 7)
    };
  }
}
</script>
</body>
</html>
