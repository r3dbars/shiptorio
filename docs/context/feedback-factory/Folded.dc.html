<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback Factory · folded</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2A93B}a:hover{color:#FFC872}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live{animation:pulse 1.6s ease-in-out infinite}
</style>
</helmet>
<div style="width: 420px; height: 760px; box-sizing: border-box; padding: 24px 22px; background: #101317; color: #E8ECF1; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

  <header style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA4B1; text-transform: uppercase; letter-spacing: 0.08em">Transcripted · iOS</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Ready to ship</h1>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #101317; background: {{accent}}; border-radius: 999px; padding: 4px 12px">{{left}} left</span>
  </header>

  <sc-if value="{{hasCard}}" hint-placeholder-val="{{true}}">
    <div style="position: relative; flex-grow: 1; min-height: 0">
      <div style="position: absolute; left: 24px; right: 24px; top: 24px; bottom: 0; border-radius: 22px; background: #161B21; border: 1px solid #242A33"></div>
      <div style="position: absolute; left: 12px; right: 12px; top: 12px; bottom: 12px; border-radius: 22px; background: #181E25; border: 1px solid #2A313B"></div>
      <article style="position: absolute; left: 0; right: 0; top: 0; bottom: 24px; box-sizing: border-box; border-radius: 22px; background: #1C222A; border: 1px solid #3A4350; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA4B1">{{card.pr}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9D1DB; border: 1px solid #3A4350; border-radius: 6px; padding: 2px 8px">{{card.agent}}</span>
        </div>
        <h2 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2">{{card.title}}</h2>
        <div style="background: #2A231A; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{accent}}; text-transform: uppercase; letter-spacing: 0.06em">Why</span>
          <span style="font-size: 15px; line-height: 1.35">{{card.why}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:#3DD6B0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12l5 5L20 7"></path></svg>
            <span style="font-size: 15px">{{card.tests}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:#9AA4B1;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #C9D1DB">{{card.diff}}</span>
          </div>
        </div>
        <div style="flex-grow: 1"></div>
        <p style="margin: 0; font-size: 13px; color: #9AA4B1; text-align: center">Open the Duo to see the full diff</p>
      </article>
    </div>
    <div style="display: flex; gap: 12px">
      <button type="button" onClick="{{sendBack}}" style="flex-grow: 1; min-height: 56px; border-radius: 16px; border: 1px solid #3A4350; background: #1A1F26; color: #E8ECF1; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500; cursor: pointer">← Send back</button>
      <button type="button" onClick="{{merge}}" style="flex-grow: 1; min-height: 56px; border-radius: 16px; border: none; background: #3DD6B0; color: #0D1A16; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer">Merge →</button>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #17241F; border: 1px solid #2E5A4C; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:#3DD6B0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12l5 5L20 7"></path></svg>
      </div>
      <h2 style="margin: 0; font-size: 24px; font-weight: 600">Line's clear</h2>
      <p style="margin: 0; font-size: 15px; color: #9AA4B1; line-height: 1.4">{{summary}}</p>
      <button type="button" onClick="{{reset}}" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #3A4350; background: transparent; color: #E8ECF1; font-family: 'Space Grotesk', sans-serif; font-size: 15px; cursor: pointer">Replay</button>
    </div>
  </sc-if>

  <footer style="display: flex; align-items: center; justify-content: space-between; background: #1A1F26; border: 1px solid #2A313B; border-radius: 14px; padding: 12px 14px">
    <span class="live" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3DD6B0">● 2 machines running</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA4B1">38 complaints open</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#FF7A59","#B98CFF","#3DD6B0"]},"$preview":{"width":420,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, merged: 0, sent: 0 };
  }
  renderVals() {
    const cards = [
      { pr: 'PR #142', agent: 'Claude Code', title: 'Retry sync when the app comes back from background', why: '9 people said recordings vanished after locking their phone.', tests: '24 tests pass', diff: '3 files · +84 −12' },
      { pr: 'PR #143', agent: 'Codex', title: 'Keep speaker names stable across a whole call', why: '6 reports of Speaker 2 getting swapped with you mid-meeting.', tests: '17 tests pass', diff: '2 files · +41 −19' },
      { pr: 'PR #144', agent: 'Claude Code', title: 'Show a clear error when sync fails on cellular', why: 'Sync failing silently came up 4 times this week.', tests: '9 tests pass', diff: '1 file · +22 −3' }
    ];
    const idx = this.state.idx;
    const hasCard = idx < cards.length;
    const next = (key) => () => this.setState((s) => ({ idx: s.idx + 1, [key]: s[key] + 1 }));
    return {
      accent: this.props.accent ?? '#F2A93B',
      hasCard: hasCard,
      done: !hasCard,
      card: hasCard ? cards[idx] : cards[0],
      left: cards.length - Math.min(idx, cards.length),
      merge: next('merged'),
      sendBack: next('sent'),
      reset: () => this.setState({ idx: 0, merged: 0, sent: 0 }),
      summary: this.state.merged + ' merged, ' + this.state.sent + ' sent back. Your agents are on the next batch.'
    };
  }
}
</script>
</body>
</html>
