<title>Shiptorio Black Iron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One-screen game view. The factory fills the screen; HUD top-left, machine status chips float over
   each machine, the event ticker bottom-left, view + sim controls bottom-right.
   Single dark look on purpose (it's a game screen), every color set explicitly. */
:root {
  --bg: #0b0806;
  --panel: rgba(14, 10, 8, 0.9);
  --line: #5a4434;
  --ink: #f4ead8;
  --dim: #b8a48a;
  --amber: #ffb020;
  --ok: #46e07a;
  --bad: #ff4a32;
  --idle: #8fa2c8;
  --focus: #6fb2ff;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 12px/1.45 var(--mono); -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.card { background: var(--panel); border: 2px solid var(--line); outline: 2px solid #000; }
.eyebrow { font: 400 9px/1.2 var(--pixel); letter-spacing: 0.14em; color: var(--dim); }
.tbtn { font: 400 10px/1 var(--pixel); letter-spacing: 0.06em; color: var(--ink); background: rgba(20, 14, 10, 0.94); border: 2px solid var(--line); min-height: 30px; padding: 0 9px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: var(--dim); }
.tbtn[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #120c02; }
.tbtn:focus-visible, .chip button:focus-visible, #alert:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); padding: 9px 12px; display: flex; flex-direction: column; gap: 6px; z-index: 6; max-width: calc(100% - 20px); }
#hud h1 { font: 700 18px/1 var(--pixel); letter-spacing: 0.08em; margin: 0; }
#counts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
#counts span { font: 400 9px var(--pixel); letter-spacing: 0.08em; color: var(--dim); }
#counts b { font: 700 13px var(--mono); color: var(--ink); margin-left: 4px; }
#counts .ship b { color: var(--ok); } #counts .rw b { color: var(--bad); } #counts .need b { color: var(--amber); }

#alert { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 7; font: 700 11px/1 var(--pixel); letter-spacing: 0.08em; color: #140c02; background: var(--amber); border: 2px solid #000; padding: 9px 14px; cursor: pointer; animation: ping 1s infinite; }
@keyframes ping { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 176, 32, 0.7); } 50% { box-shadow: 0 0 0 8px rgba(255, 176, 32, 0); } }

#chips, #tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.chip { position: absolute; left: 0; top: 0; pointer-events: auto; min-width: 150px; max-width: 220px; padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 3px; background: rgba(14, 10, 8, 0.92); border: 2px solid var(--line); outline: 2px solid #000; cursor: pointer; }
.chip .nm { display: flex; align-items: center; gap: 6px; font: 700 9px/1.1 var(--pixel); letter-spacing: 0.08em; }
.chip .dot { width: 8px; height: 8px; flex: none; background: var(--idle); }
.chip .st { font: 700 11px/1 var(--pixel); letter-spacing: 0.06em; color: var(--idle); }
.chip .det { font-size: 10.5px; color: var(--dim); line-height: 1.35; }
.chip .pr { font-size: 10.5px; line-height: 1.35; color: #fff1d0; }
.chip .acts { display: flex; gap: 4px; margin-top: 2px; }
.chip button { font: 400 9px/1 var(--pixel); letter-spacing: 0.06em; padding: 6px 7px; border: 2px solid #000; cursor: pointer; }
.chip .rs { background: var(--amber); color: #140c02; }
.chip .sl { background: transparent; color: var(--dim); border-color: var(--line); }
.chip[data-s="WORKING"] { border-color: #2f7a46; } .chip[data-s="WORKING"] .dot { background: var(--ok); animation: blink 0.9s infinite; } .chip[data-s="WORKING"] .st { color: var(--ok); }
.chip[data-s="BLOCKED"] { border-color: var(--amber); animation: ping 1s infinite; } .chip[data-s="BLOCKED"] .dot { background: var(--bad); animation: blink 0.4s infinite; } .chip[data-s="BLOCKED"] .st { color: var(--amber); }
@keyframes blink { 50% { opacity: 0.25; } }
.tag { position: absolute; left: 0; top: 0; font: 700 9px/1 var(--pixel); letter-spacing: 0.04em; padding: 3px 4px; background: rgba(10, 7, 5, 0.85); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.tag.k-pass { border-color: #2f9a56; color: #9affc0; } .tag.k-reject { border-color: #a0261a; color: #ffb0a0; } .tag.held { border-color: var(--amber); color: var(--amber); }
.tag.fol { border-color: var(--focus); color: #cfe6ff; }

#ticker { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: 330px; max-width: calc(100% - 20px); padding: 7px 10px; display: flex; flex-direction: column; gap: 3px; z-index: 5; }
#ticker div { font-size: 10.5px; line-height: 1.35; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ticker .k-in { color: #e8d8b8; } #ticker .k-good { color: #8ff0b0; } #ticker .k-bad { color: #ff9a88; } #ticker .k-warn { color: var(--amber); } #ticker .k-ship { color: #b8ffcf; font-weight: 600; }

#ctrl { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 5px; padding: 6px; z-index: 5; align-items: flex-end; }
#ctrl .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-end; }
#ctrl .eyebrow { margin: 0 2px 0 6px; }
#followBar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 6; padding: 6px 10px; font-size: 11px; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#followBar b { font: 700 10px var(--pixel); letter-spacing: 0.06em; color: #cfe6ff; margin-right: 6px; }

@media (max-width: 760px) {
  #hud { padding: 6px 8px; } #hud h1 { font-size: 13px; } #hud .eyebrow { display: none; }
  #counts b { font-size: 11px; }
  #ticker { width: auto; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding: 5px 8px; }
  #ticker div:nth-child(n+3) { display: none; }
  #ctrl { left: max(6px, env(safe-area-inset-left, 0px)); right: max(6px, env(safe-area-inset-right, 0px)); align-items: stretch; }
  #ctrl .row { justify-content: center; }
  #ctrl .tbtn { min-height: 28px; padding: 0 6px; font-size: 9px; }
  #ctrl .eyebrow { display: none; }
  .chip { min-width: 0; max-width: 150px; padding: 4px 6px; }
  .chip .nm span.full { display: none; }
  .chip .det { display: none; }
  #alert { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  #followBar { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { #alert, .chip, .chip .dot { animation: none !important; } }
</style>

<canvas id="stage" aria-label="Black Iron: a pixel-art factory line where issues are mined, built into PRs, reviewed by Spark and launched"></canvas>
<div id="tags"></div>
<div id="chips"></div>
<div id="hud" class="card">
  <span class="eyebrow">COGWORKS · BLACK IRON</span>
  <h1>SHIPTORIO</h1>
  <div id="counts"></div>
</div>
<button id="alert" hidden></button>
<div id="followBar" class="card" hidden></div>
<div id="ticker" class="card" aria-live="polite"></div>
<div id="ctrl" class="card">
  <div class="row"><span class="eyebrow">VIEW</span>
    <button class="tbtn" data-view="line">LINE</button><button class="tbtn" data-view="deck">DECK</button><button class="tbtn" data-view="under">UNDERSIDE</button><button class="tbtn" data-view="follow">FOLLOW WORK</button>
  </div>
  <div class="row"><span class="eyebrow">PIXELS</span>
    <button class="tbtn" data-px="1">1X</button><button class="tbtn" data-px="2">2X</button><button class="tbtn" data-px="3">3X</button><button class="tbtn" data-px="0">SMOOTH</button>
    <span class="eyebrow">SIM</span>
    <button class="tbtn" id="b-speed">1X</button><button class="tbtn" id="b-intake" aria-pressed="true">INTAKE</button><button class="tbtn" id="b-auto" aria-pressed="true" title="Decisions resolve themselves after a few seconds">AUTO-RESOLVE</button><button class="tbtn" id="b-tags" aria-pressed="true">TAGS</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// IRON LINE CORE  (owned by the integrator; module agents: read, don't edit)
// The Black Iron factory as a real line: work items are simulated, ride paths,
// get handed between stations through fixed ports, and stall on decisions.
// Modules plug in with IRON.world / IRON.underside / IRON.belts / IRON.machine / IRON.carrier.
// All positions are ROOT-LOCAL: +x runs left->right on screen, +z toward the viewer, +y up.
// Machines are built in their own LOCAL frame (seen from a 45deg corner, +x and +z faces visible);
// convert with M.toRoot(x,y,z). See CONTRACT.md for the full contract.
// =====================================================================
window.IRON = (function () {
  'use strict';
  const THREE = window.THREE;
  const V3 = THREE.Vector3;
  const I = {
    mods: { world: null, underside: null, belts: null, machines: {} },
    carriers: {}, paths: {}, pathList: [], items: [], stations: {}, log: [], listeners: {},
    counters: { mined: 0, shipped: 0, rework: 0, decisions: 0 },
    policy: { intake: true, autoResolve: true, autoResolveAfter: 9, speed: 1, events: true },
    CFG: {
      spawnEvery: [8, 12], gap: 0.85, rejectRate: 0.28, rejectRateRetry: 0.08,
      decisionChance: { assembler: 0.07, splitter: 0.06, launch: 0.18 }
    },
    LOOK: {
      sky: { top: '#140c08', bottom: '#5a2a12', fog: '#2a1810', fogNear: 70, fogFar: 140 },
      light: { sun: 0xffb070, sunI: 1.05, sunDir: [-10, 22, 14], hemiSky: 0xc8a888, hemiGnd: 0x3a2a1e, hemiI: 0.95 },
      finish: { levels: 48, dither: 0.1, outline: 0.5, thresh: 0.08, ink: '#0a0504', sat: 0.98, contrast: 1.06, bloom: 0.75, bloomThresh: 0.6, vignette: 0.3, grade: 0.32, shadow: '#1e1630', high: '#ffd29a', scan: 0 }
    }
  };
  I.world = (fn) => (I.mods.world = fn);
  I.underside = (fn) => (I.mods.underside = fn);
  I.belts = (fn) => (I.mods.belts = fn);
  I.machine = (id, fn) => (I.mods.machines[id] = fn);
  I.carrier = (name, fn) => (I.carriers[name] = { make: fn });
  I.look = (cfg) => { for (const k in cfg) I.LOOK[k] = Object.assign({}, I.LOOK[k] || {}, cfg[k]); };
  I.on = (ev, fn) => ((I.listeners[ev] = I.listeners[ev] || []).push(fn));
  I.emit = (ev, d) => (I.listeners[ev] || []).forEach((f) => { try { f(d); } catch (e) { console.error(e); } });

  // =====================================================================
  // KIT (same as the diorama kit, plus bake / caution / statusLamp / sign)
  // =====================================================================
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cache = {};
  function mat(c, o) {
    const plain = o === undefined && typeof c === 'number';
    if (plain && cache[c]) return cache[c];
    o = o || {};
    const m = new THREE.MeshPhongMaterial({
      color: c, emissive: o.e || 0, emissiveIntensity: o.ei === undefined ? 1 : o.ei,
      flatShading: o.flat !== false, shininess: o.shine || 0, specular: o.spec === undefined ? (o.shine ? 0x333333 : 0) : o.spec,
      transparent: o.op !== undefined, opacity: o.op === undefined ? 1 : o.op, side: o.double ? THREE.DoubleSide : THREE.FrontSide, map: o.map || null
    });
    if (o.depthWrite === false) m.depthWrite = false;
    if (plain) cache[c] = m;
    return m;
  }
  const glow = (c, op, add) => new THREE.MeshBasicMaterial({ color: c, transparent: op !== undefined || !!add, opacity: op === undefined ? 1 : op, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: false });
  function mesh(geo, m, x, y, z, p) {
    const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
    o.position.set(x || 0, y || 0, z || 0);
    const mm = Array.isArray(o.material) ? o.material[0] : o.material;
    const lit = !mm.isMeshBasicMaterial;
    o.castShadow = lit && !mm.transparent; o.receiveShadow = lit;
    if (p) p.add(o); return o;
  }
  const box = (w, h, d, m, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
  const cyl = (a, b, h, m, s, x, y, z, p) => mesh(new THREE.CylinderGeometry(a, b, h, s || 10), m, x, y, z, p);
  const cone = (r, h, m, s, x, y, z, p) => mesh(new THREE.ConeGeometry(r, h, s || 10), m, x, y, z, p);
  const sph = (r, m, x, y, z, p, ws, hs) => mesh(new THREE.SphereGeometry(r, ws || 10, hs || 8), m, x, y, z, p);
  const torus = (r, t, m, rs, ts, x, y, z, p, arc) => mesh(new THREE.TorusGeometry(r, t, rs || 6, ts || 16, arc || Math.PI * 2), m, x, y, z, p);
  const rock = (r, m, x, y, z, p, detail) => mesh(new THREE.DodecahedronGeometry(r, detail || 0), m, x, y, z, p);
  const group = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); if (p) p.add(g); return g; };
  function lathe(points, m, seg, x, y, z, p) {
    const mm = typeof m === 'number' ? mat(m, { double: true }) : m;
    return mesh(new THREE.LatheGeometry(points.map(([r, h]) => new THREE.Vector2(r, h)), seg || 16), mm, x, y, z, p);
  }
  function tube(points, r, m, p, seg, radial) {
    const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new V3(x, y, z)));
    return mesh(new THREE.TubeGeometry(curve, seg || 24, r, radial || 6, false), m, 0, 0, 0, p);
  }
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(repeat[0], repeat[1]); return t;
  }
  // particles
  const fx = []; const fxGeo = new THREE.BoxGeometry(1, 1, 1);
  function spawn(p, x, y, z, vx, vy, vz, color, life, size, grav, add) {
    if (fx.length > 1100) return null;
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: !add }));
    m.position.set(x, y, z); m.scale.setScalar(size); p.add(m);
    const f = { m, p, vx, vy, vz, life, max: life, grav, size }; fx.push(f); return f;
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life -= dt;
      if (f.life <= 0 || !f.p.parent) { f.p.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); continue; }
      f.vy -= f.grav * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      const k = f.life / f.max; f.m.material.opacity = Math.min(1, k * 1.6);
      if (f.grav < 0) f.m.scale.setScalar(f.size * (1 + (1 - k) * 1.5));
    }
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  const clamp01 = (k) => Math.max(0, Math.min(1, k));
  function keyframes(frames, p) {
    for (let i = 0; i < frames.length - 1; i++) { const a = frames[i], b = frames[i + 1]; if (p <= b[0]) { const k = smooth((p - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); } }
    return frames[frames.length - 1].slice(1);
  }
  function link(m, ax, ay, bx, by) { m.position.x = (ax + bx) / 2; m.position.y = (ay + by) / 2; m.rotation.z = Math.atan2(by - ay, bx - ax); m.scale.x = Math.hypot(bx - ax, by - ay); }
  const R = () => Math.random() - 0.5;

  // bake: merge every static mesh under `grp` that shares a material into one mesh (cuts draw calls).
  // Only call on groups that never move internally. Basic (glow) and transparent meshes are merged too,
  // but meshes with array materials are skipped. Returns the number of meshes removed.
  function bake(grp) {
    grp.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(grp.matrixWorld).invert();
    const buckets = new Map(); const kill = [];
    grp.traverse((o) => {
      if (!o.isMesh || Array.isArray(o.material) || o.userData.noBake) return;
      const g = o.geometry; if (!g.attributes.position || !g.attributes.normal) return;
      const key = o.material.uuid + '|' + (g.attributes.uv ? 1 : 0) + '|' + (o.castShadow ? 1 : 0) + (o.receiveShadow ? 1 : 0);
      if (!buckets.has(key)) buckets.set(key, { mat: o.material, list: [], cast: o.castShadow, recv: o.receiveShadow, uv: !!g.attributes.uv });
      buckets.get(key).list.push(o); kill.push(o);
    });
    let removed = 0;
    const mtx = new THREE.Matrix4();
    buckets.forEach((b) => {
      if (b.list.length < 2) { kill.splice(kill.indexOf(b.list[0]), 1); return; }
      let n = 0; const geos = b.list.map((o) => { mtx.multiplyMatrices(inv, o.matrixWorld); const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()); g.applyMatrix4(mtx); n += g.attributes.position.count; return g; });
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = b.uv ? new Float32Array(n * 2) : null; let off = 0;
      geos.forEach((g) => { pos.set(g.attributes.position.array, off * 3); nor.set(g.attributes.normal.array, off * 3); if (uv) uv.set(g.attributes.uv.array, off * 2); off += g.attributes.position.count; g.dispose(); });
      const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); if (uv) geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      const m = new THREE.Mesh(geo, b.mat); m.castShadow = b.cast; m.receiveShadow = b.recv; grp.add(m); removed += b.list.length - 1;
    });
    kill.forEach((o) => o.parent && o.parent.remove(o));
    return removed;
  }

  // hazard stripes + "!" sign texture (shared)
  let SIGN = null;
  function signTex() {
    if (SIGN) return SIGN;
    SIGN = canvasTex(32, 32, (g) => {
      g.fillStyle = '#16100a'; g.fillRect(0, 0, 32, 32);
      for (let i = -32; i < 64; i += 8) { g.fillStyle = '#f2b21a'; g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 4, 0); g.lineTo(i + 4 - 32, 32); g.lineTo(i - 32, 32); g.fill(); }
      g.fillStyle = '#16100a'; g.fillRect(4, 4, 24, 24);
      g.fillStyle = '#ffc21a'; g.beginPath(); g.moveTo(16, 6); g.lineTo(27, 26); g.lineTo(5, 26); g.closePath(); g.fill();
      g.fillStyle = '#16100a'; g.fillRect(15, 11, 3, 9); g.fillRect(15, 22, 3, 3);
    });
    return SIGN;
  }
  // CAUTION BEACON: a hazard post with a rotating amber beacon and a "!" sign that flips up when BLOCKED,
  // plus a pinging ring on the floor. Every machine places one where it's easy to see.
  function caution(p, x, y, z, s) {
    s = s || 1;
    const g = group(p, x, y, z); g.scale.setScalar(s);
    const iron = mat(0x2b2520, { shine: 20 });
    cyl(0.07, 0.09, 1.5, iron, 8, 0, 0.75, 0, g);
    for (let i = 0; i < 5; i++) cyl(0.095, 0.095, 0.14, mat(i % 2 ? 0x16120c : 0xe0a018), 8, 0, 0.18 + i * 0.28, 0, g);
    cyl(0.16, 0.18, 0.08, iron, 10, 0, 1.52, 0, g);
    const lampMat = mat(0x5a3a08, { e: 0 });
    const lampSpin = group(g, 0, 1.68, 0);
    box(0.2, 0.16, 0.08, lampMat, 0.06, 0, 0, lampSpin);
    const dome = sph(0.16, glow(0xffb020, 0.35), 0, 1.68, 0, g, 10, 8); dome.castShadow = false;
    const capM = mat(0x3a332c); cyl(0.1, 0.12, 0.05, capM, 8, 0, 1.86, 0, g);
    const hinge = group(g, 0, 1.2, 0.1);
    const sm = mat(0xffffff, { map: signTex(), e: 0x000000 }); const signM = sm;
    const sign = box(0.62, 0.62, 0.05, signM, 0, 0.36, 0, hinge);
    const ring = torus(0.6, 0.05, glow(0xffb020, 0.8, true), 4, 28, 0, 0.06, 0, g); ring.rotation.x = Math.PI / 2; ring.visible = false;
    const ring2 = torus(0.6, 0.04, glow(0xff4020, 0.7, true), 4, 28, 0, 0.07, 0, g); ring2.rotation.x = Math.PI / 2; ring2.visible = false;
    let fold = 1;
    return { g, update(t, dt, state) {

  const bg = I.K.canvasTex(2, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, sky.top); gr.addColorStop(1, sky.bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); });
  bg.magFilter = bg.minFilter = THREE.LinearFilter; scene.background = bg;
  if (sky.fog) scene.fog = new THREE.Fog(sky.fog, sky.fogNear || 70, sky.fogFar || 140);
  const hemi = new THREE.HemisphereLight(L.light.hemiSky, L.light.hemiGnd, L.light.hemiI); scene.add(hemi);
  const sun = new THREE.DirectionalLight(L.light.sun, L.light.sunI);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 160 });
  sun.shadow.bias = -0.0006; scene.add(sun, sun.target);
  const sunDir = new THREE.Vector3().fromArray(L.light.sunDir);

  // ---------- camera ----------
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -300, 500);
  const yaw = Math.PI / 4, tilt = 30 * Math.PI / 180, D = 80;
  const tgt = new THREE.Vector3(), tgtGoal = new THREE.Vector3();

  const mobile = () => W < 760;

    else if (view === 'deck') { rootToWorld(0, 2.2, 0.5, tgtGoal); viewGoal = Math.max(12.5, 37 / a); }
    else if (view === 'under') { rootToWorld(-2, -10, 5, tgtGoal); viewGoal = Math.max(19, 34 / a); }

    live.sort((a, b) => rank(b) - rank(a) || a.id - b.id);

  }

  // pan with drag, zoom with wheel / pinch

  const right = new THREE.Vector3(), up = new THREE.Vector3();

  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.35, Math.min(3, zoom * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  function resize() { W = window.innerWidth; H = window.innerHeight; renderer.setSize(W, H, false); if (view !== 'free' && view !== 'follow') presetGoal(); }
  window.addEventListener('resize', resize);

  // ---------- HUD ----------
  const NAMES = { assembler: ['CLOCKWORK', 'ASSEMBLER'], splitter: ['AETHER SPLITTER', '· SPARK'], launch: ['IRON', 'LAUNCH PAD'] };
  const chips = {};
  ['assembler', 'splitter', 'launch'].forEach((id) => {
    const el = document.createElement('div'); el.className = 'chip'; el.tabIndex = 0;
    el.innerHTML = '<div class="nm"><i class="dot"></i><span>' + NAMES[id][0] + '</span> <span class="full">' + NAMES[id][1] + '</span></div><span class="st"></span><span class="det"></span><span class="pr" hidden></span><div class="acts"><button class="rs" hidden>RESOLVE</button><button class="sl">STALL</button></div>';
    el.querySelector('.rs').onclick = (e) => { e.stopPropagation(); I.resolve(id); };
    el.querySelector('.sl').onclick = (e) => { e.stopPropagation(); I.stall(id); };
    el.onclick = () => setView('station', id);
    $('chips').appendChild(el); chips[id] = { el, st: el.querySelector('.st'), det: el.querySelector('.det'), pr: el.querySelector('.pr'), rs: el.querySelector('.rs'), sl: el.querySelector('.sl'), last: '' };
  });
  const STATE_WORD = { IDLE: 'IDLE', WORKING: 'WORKING', BLOCKED: 'NEEDS YOU' };
  function syncChips() {
    for (const id in chips) {
      const c = chips[id], st = I.stations[id]; const s = st.blocked ? 'BLOCKED' : st.state;
      const sig = s + '|' + st.detail + '|' + st.prompt;
      if (sig === c.last) continue; c.last = sig;
      c.el.dataset.s = s; c.st.textContent = STATE_WORD[s] || s; c.det.textContent = st.detail || '';
      c.pr.hidden = !st.blocked; c.pr.textContent = st.prompt || ''; c.rs.hidden = !st.blocked; c.sl.hidden = st.blocked;
    }
  }
  const cv = new THREE.Vector3();
  function project(x, y, z) { rootToWorld(x, y, z, cv); cv.project(cam); return [(cv.x + 1) / 2 * W, (1 - cv.y) / 2 * H, cv.z]; }
  const CHIP_AT = { assembler: [-10, 6.0, -0.6], splitter: [0, 8.2, -0.4], launch: [10, 8.4, -0.6] };
  function placeChips() {
    const hud = $('hud').getBoundingClientRect();
    for (const id in chips) {

      x = Math.max(w / 2 + 8, Math.min(W - w / 2 - 8, x));
      let minY = h + 8; if (x - w / 2 < hud.right + 6) minY = Math.max(minY, hud.bottom + h + 6);

      y = Math.max(minY, Math.min(H - 8, y));
      el.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) translate(-50%,-100%)';
    }
  }
  let showTags = window.innerWidth >= 760;
  const tagEls = new Map();
  function placeTags() {
    const seen = new Set();
    I.items.forEach((it) => {
      const held = it.owner && I.stations[it.owner].blocked, fol = it === followItem;
      if (!(showTags || held || fol) || it.hidden) return;
      seen.add(it);
      let el = tagEls.get(it); if (!el) { el = document.createElement('span'); el.className = 'tag'; $('tags').appendChild(el); tagEls.set(it, el); }
      const txt = it.label() + (fol ? ' ' + it.title : ''); if (el.textContent !== txt) el.textContent = txt;
      el.className = 'tag k-' + it.kind + (held ? ' held' : '') + (fol ? ' fol' : '');
      const p = it.mesh.position; const [x, y] = project(p.x, p.y + 0.75, p.z);
      el.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) translate(-50%,-100%)';
    });
    tagEls.forEach((el, it) => { if (!seen.has(it)) { el.remove(); tagEls.delete(it); } });
  }
  function syncHud() {
    const need = Object.values(I.stations).filter((s) => s.blocked);
    const c = I.counters;
    const html = '<span>MINED<b>' + c.mined + '</b></span><span>ON LINE<b>' + I.items.length + '</b></span><span class="ship">SHIPPED<b>' + c.shipped + '</b></span><span class="rw">REWORK<b>' + c.rework + '</b></span><span class="need">NEEDS YOU<b>' + need.length + '</b></span>';
    if ($('counts').innerHTML !== html) $('counts').innerHTML = html;
    const al = $('alert');
    if (need.length) { al.hidden = false; const txt = '⚠ ' + need.length + (need.length > 1 ? ' MACHINES NEED' : ' MACHINE NEEDS') + ' YOU'; if (al.textContent !== txt) al.textContent = txt; al.onclick = () => setView('station', need[0].id); }
    else al.hidden = true;
    const fb = $('followBar');
    if (view === 'follow' && followItem) { fb.hidden = false; const h = '<b>FOLLOWING ' + followItem.label() + '</b>' + followItem.title + ' · ' + (followItem.owner ? I.stations[followItem.owner].detail || followItem.stage : followItem.stage); if (fb.innerHTML !== h) fb.innerHTML = h; }
    else fb.hidden = true;
  }
  function syncTicker() {
    const t = $('ticker'); const rows = I.log.slice(0, 4);
    const html = rows.map((r) => '<div class="k-' + r.kind + '"></div>').join('');
    if (t.children.length !== rows.length) t.innerHTML = html;
    rows.forEach((r, i) => { const d = t.children[i]; if (d.textContent !== r.text) { d.textContent = r.text; d.className = 'k-' + r.kind; } });
  }

  // ---------- controls ----------
  document.querySelectorAll('[data-px]').forEach((b) => b.onclick = () => { pxSel = +b.dataset.px; syncPx(); });
  function syncPx() { document.querySelectorAll('[data-px]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.px === pxSel)); }
  const speeds = [1, 2, 4]; let si = 0;
  $('b-speed').onclick = () => { si = (si + 1) % speeds.length; I.policy.speed = speeds[si]; $('b-speed').textContent = speeds[si] + 'X'; };
  const tog = (id, fn) => { $(id).onclick = (e) => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on); fn(on); }; };
  tog('b-intake', (on) => (I.policy.intake = on));
  tog('b-auto', (on) => (I.policy.autoResolve = on));
  tog('b-tags', (on) => (showTags = on));
  $('b-tags').setAttribute('aria-pressed', showTags);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') setView('line'); });

  // ---------- loop ----------

  setView(mobile() ? 'follow' : 'line');
  presetGoal(); tgt.copy(tgtGoal); viewH = viewGoal;
  let last = performance.now(), t = 0, hudT = 0;
  const tmp = new THREE.Vector3();
  I.renderer = renderer;
  I.render = function () {
    const a = W / H, vh = viewH * zoom;

    cam.position.set(tgt.x + D * Math.cos(tilt) * Math.sin(yaw), tgt.y + D * Math.sin(tilt), tgt.z + D * Math.cos(tilt) * Math.cos(yaw)); cam.lookAt(tgt);

  };

    if (view === 'follow') {

    } else if (view !== 'free') presetGoal();

  requestAnimationFrame(frame);
})();
