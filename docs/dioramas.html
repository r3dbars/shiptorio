<title>Shiptorio Dioramas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One-screen app: the diorama fills the screen; tabs on top, the mood board card on the left,
   view controls bottom right. Chrome is neutral and borrows each world's accent. */
:root {
  --bg: #07080f;
  --panel: rgba(9, 11, 22, 0.9);
  --line: #3a4270;
  --ink: #eef1fa;
  --dim: #a3abcf;
  --accent: #f2a93b;
  --focus: #6fb2ff;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 12px/1.5 var(--mono); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.card { background: var(--panel); border: 2px solid var(--line); outline: 2px solid #000; backdrop-filter: blur(2px); }
.ptitle { font: 700 20px/1.05 var(--pixel); letter-spacing: 0.08em; margin: 0; text-wrap: balance; }
.eyebrow { font: 400 10px/1.2 var(--pixel); letter-spacing: 0.12em; color: var(--dim); }
.tbtn { font: 400 10px/1 var(--pixel); letter-spacing: 0.06em; color: var(--ink); background: rgba(9, 11, 22, 0.92); border: 2px solid var(--line); min-height: 30px; padding: 0 10px; cursor: pointer; }
.tbtn:hover { border-color: var(--dim); }
.tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0904; }
.tbtn:focus-visible, .comp:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#tabs { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; z-index: 5; }
#tabs .tbtn { min-height: 34px; padding: 0 14px; font-size: 12px; }

#mood { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: 300px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
#mood .pitch { margin: 0; font-size: 11.5px; line-height: 1.55; }
.sw { display: flex; height: 12px; border: 1px solid #000; }
.sw i { flex: 1; }
.kw { display: flex; flex-wrap: wrap; gap: 4px; }
.kw span { font: 400 9px/1 var(--pixel); letter-spacing: 0.08em; padding: 4px 5px; border: 1px solid var(--line); color: var(--dim); }
.comp { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); cursor: pointer; background: rgba(255,255,255,0.02); }
.comp:hover { border-color: var(--dim); }
.comp[aria-current="true"] { border-color: var(--accent); }
.comp b { font: 700 11px var(--pixel); letter-spacing: 0.08em; }
.comp p { margin: 0; font-size: 11px; color: var(--dim); line-height: 1.5; }
.states { display: flex; flex-wrap: wrap; gap: 3px; }
.states .tbtn { min-height: 24px; font-size: 9px; padding: 0 6px; }
#hide { align-self: flex-start; }

#ctrl { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-items: center; justify-content: flex-end; max-width: calc(100% - 24px); z-index: 4; }
#ctrl .eyebrow { margin: 0 4px 0 6px; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.label { position: absolute; left: 0; top: 0; background: rgba(9, 11, 22, 0.88); border: 1px solid var(--line); padding: 3px 7px 4px; white-space: nowrap; font: 700 10px var(--pixel); letter-spacing: 0.08em; color: var(--ink); pointer-events: auto; cursor: pointer; }
.label:hover { border-color: var(--accent); }
#showMood { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); z-index: 4; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 14px var(--pixel); letter-spacing: 0.1em; color: var(--dim); pointer-events: none; z-index: 1; }

@media (max-width: 820px) {
  #tabs { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none; justify-content: center; }
  #tabs .tbtn { padding: 0 8px; font-size: 10px; flex: 1; }
  #mood { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-height: 40vh; }
  #showMood { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  #ctrl { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); justify-content: center; }
  #ctrl .tbtn { min-height: 28px; padding: 0 7px; font-size: 9px; }
}
</style>

<canvas id="stage" aria-label="A pixel-art diorama of three Shiptorio machines in the selected world"></canvas>
<div id="loading">BUILDING WORLD…</div>
<div id="labels"></div>
<nav id="tabs" class="card" aria-label="Worlds"></nav>
<aside id="mood" class="card" aria-live="polite">
  <span class="eyebrow" id="m-eyebrow">MOOD BOARD</span>
  <h1 class="ptitle" id="m-name"></h1>
  <p class="pitch" id="m-pitch"></p>
  <div class="sw" id="m-sw"></div>
  <div class="kw" id="m-kw"></div>
  <span class="eyebrow">THE THREE MACHINES · CLICK TO ZOOM</span>
  <div id="m-comps" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="tbtn" id="hide">HIDE PANEL</button>
</aside>
<button class="tbtn card" id="showMood" hidden>MOOD BOARD</button>
<div id="ctrl" class="card">
  <span class="eyebrow">PIXELS</span>
  <button class="tbtn" data-px="1">1X</button><button class="tbtn" data-px="2">2X</button><button class="tbtn" data-px="3">3X</button><button class="tbtn" data-px="0">SMOOTH</button>
  <span class="eyebrow">VIEW</span>
  <button class="tbtn" id="b-all">ALL THREE</button>
  <button class="tbtn" id="b-cycle" aria-pressed="false">CYCLE STATES</button>
  <button class="tbtn" id="b-labels" aria-pressed="true">LABELS</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// SHIP: the shared diorama engine. Style modules call SHIP.register(style).
// =====================================================================
window.SHIP = (function () {
  'use strict';
  const styles = [];
  const S = { register(s) { styles.push(s); }, styles };

  // ---------- kit handed to every style module ----------
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cache = {};
  function mat(c, o) {
    if (o === undefined && typeof c === 'number' && cache[c]) return cache[c];
    o = o || {};
    const m = new THREE.MeshPhongMaterial({
      color: c, emissive: o.e || 0, emissiveIntensity: o.ei === undefined ? 1 : o.ei,
      flatShading: o.flat !== false, shininess: o.shine || 0, specular: o.spec === undefined ? (o.shine ? 0x333333 : 0) : o.spec,
      transparent: o.op !== undefined, opacity: o.op === undefined ? 1 : o.op, side: o.double ? THREE.DoubleSide : THREE.FrontSide,
      map: o.map || null
    });
    if (o.depthWrite === false) m.depthWrite = false;
    if (arguments.length === 1 && typeof c === 'number') cache[c] = m;
    return m;
  }
  const glow = (c, op, add) => new THREE.MeshBasicMaterial({ color: c, transparent: op !== undefined || !!add, opacity: op === undefined ? 1 : op, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: false });
  function mesh(geo, m, x, y, z, p) {
    const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
    o.position.set(x || 0, y || 0, z || 0);
    const lit = !(o.material.isMeshBasicMaterial);
    o.castShadow = lit && !o.material.transparent; o.receiveShadow = lit;
    if (p) p.add(o); return o;
  }
  const box = (w, h, d, m, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
  const cyl = (a, b, h, m, s, x, y, z, p) => mesh(new THREE.CylinderGeometry(a, b, h, s || 10), m, x, y, z, p);
  const cone = (r, h, m, s, x, y, z, p) => mesh(new THREE.ConeGeometry(r, h, s || 10), m, x, y, z, p);
  const sph = (r, m, x, y, z, p, ws, hs) => mesh(new THREE.SphereGeometry(r, ws || 10, hs || 8), m, x, y, z, p);
  const torus = (r, t, m, rs, ts, x, y, z, p, arc) => mesh(new THREE.TorusGeometry(r, t, rs || 6, ts || 16, arc || Math.PI * 2), m, x, y, z, p);
  const rock = (r, m, x, y, z, p, detail) => mesh(new THREE.DodecahedronGeometry(r, detail || 0), m, x, y, z, p);
  const group = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); if (p) p.add(g); return g; };
  function lathe(points, m, seg, x, y, z, p) {
    const mm = typeof m === 'number' ? mat(m, { double: true }) : m;
    return mesh(new THREE.LatheGeometry(points.map(([r, h]) => new THREE.Vector2(r, h)), seg || 16), mm, x, y, z, p);
  }
  function tube(points, r, m, p, seg, radial) {
    const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
    return mesh(new THREE.TubeGeometry(curve, seg || 24, r, radial || 6, false), m, 0, 0, 0, p);
  }
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(repeat[0], repeat[1]); return t;
  }
  // particles: little cubes (or additive glow cubes) that drift, fall or rise
  const fx = []; const fxGeo = new THREE.BoxGeometry(1, 1, 1);
  function spawn(p, x, y, z, vx, vy, vz, color, life, size, grav, add) {
    if (fx.length > 900) return null;
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: !add }));
    m.position.set(x, y, z); m.scale.setScalar(size); p.add(m);
    const f = { m, p, vx, vy, vz, life, max: life, grav, size }; fx.push(f); return f;
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life -= dt;
      if (f.life <= 0 || !f.p.parent) { f.p.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); continue; }
      f.vy -= f.grav * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      const k = f.life / f.max; f.m.material.opacity = Math.min(1, k * 1.6);
      if (f.grav < 0) f.m.scale.setScalar(f.size * (1 + (1 - k) * 1.5));
    }
  }
  let lightBudget = 0;
  function light(color, intensity, dist, x, y, z, p) {
    if (lightBudget >= 10) return { intensity: 0, color: new THREE.Color(), position: new THREE.Vector3(), isDummy: true };
    lightBudget++;
    const l = new THREE.PointLight(color, intensity, dist || 8, 2); l.position.set(x || 0, y || 0, z || 0); if (p) p.add(l); return l;
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  function keyframes(frames, p) {
    for (let i = 0; i < frames.length - 1; i++) { const a = frames[i], b = frames[i + 1]; if (p <= b[0]) { const k = smooth((p - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); } }
    return frames[frames.length - 1].slice(1);
  }
  function link(m, ax, ay, bx, by) { m.position.x = (ax + bx) / 2; m.position.y = (ay + by) / 2; m.rotation.z = Math.atan2(by - ay, bx - ax); m.scale.x = Math.hypot(bx - ax, by - ay); }
  const R = () => Math.random() - 0.5;
  const SLOTS = [-8, 0, 8];
  S.kit = { THREE, rnd, R, mat, glow, mesh, box, cyl, cone, sph, torus, rock, group, lathe, tube, canvasTex, spawn, light, lerp, smooth, keyframes, link, SLOTS, v3: new THREE.Vector3() };
  S._fx = { updateFx };
  S._resetLights = () => (lightBudget = 0);
  return S;
})();
</script>
<script>
// COGWORKS: a Victorian foundry district. Brass, copper, riveted iron, verdigris, soot and gaslight.
(function () {
  'use strict';
  const C = {
    soot: 0x1a1410, iron: 0x2e251e, ironL: 0x4a3c30, ironM: 0x3b3027,
    brass: 0xb08030, brassD: 0x6e4c1c, brassL: 0xd9ac55,
    copper: 0xa0532c, copperD: 0x6a3118, verd: 0x3f8a74, verdD: 0x2a5e4f,
    brick: 0x6a2e1e, brickD: 0x46201a, stone: 0x6e6050, stoneD: 0x4a3f34,
    wood: 0x56381f, woodD: 0x3a2514, leather: 0x4a2a18, cream: 0xe8d6a8,
    gas: 0xffc070, ember: 0xff7a2a, red: 0xe0402a, teal: 0x7af0d8
  };

  // ---------- shared material + part helpers ----------
  let M = null;
  function mats(K) {
    if (M) return M;
    M = {
      brass: K.mat(C.brass, { shine: 38, spec: 0x7a5a28 }),
      brassL: K.mat(C.brassL, { shine: 50, spec: 0x9a7a40 }),
      brassD: K.mat(C.brassD, { shine: 20, spec: 0x3a2a10 }),
      copper: K.mat(C.copper, { shine: 34, spec: 0x6a3a20 }),
      copperD: K.mat(C.copperD, { shine: 18, spec: 0x3a1a0a }),
      iron: K.mat(C.iron), ironM: K.mat(C.ironM), ironL: K.mat(C.ironL, { shine: 10, spec: 0x222222 }),
      soot: K.mat(C.soot), verd: K.mat(C.verd), verdD: K.mat(C.verdD),
      wood: K.mat(C.wood), woodD: K.mat(C.woodD), leather: K.mat(C.leather),
      brick: K.mat(C.brick), brickD: K.mat(C.brickD), stone: K.mat(C.stone), stoneD: K.mat(C.stoneD),
      cream: K.mat(C.cream),
      glass: K.mat(0xa8d8c8, { op: 0.22, shine: 90, spec: 0xffffff, depthWrite: false, double: true }),
      gas: K.glow(C.gas), ember: K.glow(C.ember), teal: K.glow(C.teal)
    };
    return M;
  }
  // a gear lying in the xz plane (axis = y); rotate the returned group to orient it
  function gear(K, p, r, thick, teeth, m, x, y, z) {
    const g = K.group(p, x, y, z);
    K.cyl(r, r, thick, m, Math.max(12, teeth), 0, 0, 0, g);
    const tw = (Math.PI * 2 * r) / teeth * 0.5;
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2;
      const tb = K.box(tw, thick * 0.9, r * 0.22, m, Math.sin(a) * (r + r * 0.08), 0, Math.cos(a) * (r + r * 0.08), g);
      tb.rotation.y = a;
    }
    K.cyl(r * 0.28, r * 0.28, thick * 1.6, M.ironM, 8, 0, 0, 0, g);
    if (r > 0.35) for (let i = 0; i < 4; i++) { const s = K.box(r * 1.4, thick * 1.1, r * 0.12, M.brassD, 0, 0, 0, g); s.rotation.y = i * Math.PI / 4; s.scale.x = 0.95; }
    return g;
  }
  function rivetRing(K, p, r, y, n, m) { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; K.box(0.08, 0.08, 0.08, m || M.brassL, Math.cos(a) * r, y, Math.sin(a) * r, p); } }
  function band(K, p, r, y, m, h) { K.cyl(r, r, h || 0.1, m || M.brass, 18, 0, y, 0, p); }
  // gauge facing +z (rotate the group to face elsewhere); returns needle pivot
  function gauge(K, p, x, y, z, r, ry) {
    const g = K.group(p, x, y, z); g.rotation.y = ry || 0;
    const rim = K.cyl(r * 1.15, r * 1.15, 0.08, M.brass, 14, 0, 0, 0, g); rim.rotation.x = Math.PI / 2;
    const face = K.cyl(r, r, 0.1, M.cream, 14, 0, 0, 0.01, g); face.rotation.x = Math.PI / 2;
    const red = K.box(r * 0.5, r * 0.18, 0.02, K.mat(0xb02a1a), r * 0.45, r * 0.45, 0.065, g); red.rotation.z = -0.8;
    const piv = K.group(g, 0, 0, 0.07);
    K.box(0.035, r * 0.85, 0.02, K.mat(0x140c06), 0, r * 0.38, 0, piv);
    K.box(0.07, 0.07, 0.03, M.brassL, 0, 0, 0.01, g);
    return piv;
  }
  // smoke/steam puff helper
  function puff(K, p, x, y, z, col, size, vy, spread, life) {
    K.spawn(p, x + K.R() * spread, y, z + K.R() * spread, K.R() * 0.3 + 0.25, vy, K.R() * 0.3, col, life || 2.6, size, -0.12);
  }
  function lamp(K, p, x, z, h, withLight) {
    const g = K.group(p, x, 0, z);
    K.cyl(0.22, 0.28, 0.22, M.iron, 8, 0, 0.11, 0, g);
    K.cyl(0.07, 0.09, h, M.iron, 8, 0, h / 2, 0, g);
    for (let i = 0; i < 3; i++) band(K, g, 0.1, 0.5 + i * (h * 0.3), M.brassD, 0.06);
    const arm = K.box(0.5, 0.06, 0.06, M.iron, 0.18, h - 0.1, 0, g); arm.rotation.z = 0.2;
    K.cyl(0.2, 0.14, 0.1, M.brass, 6, 0, h, 0, g);
    const glass = K.box(0.24, 0.34, 0.24, M.gas, 0, h + 0.24, 0, g);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) K.box(0.035, 0.38, 0.035, M.iron, sx * 0.13, h + 0.24, sz * 0.13, g);
    K.cone(0.24, 0.24, M.brassD, 6, 0, h + 0.53, 0, g);
    K.sph(0.05, M.brassL, 0, h + 0.68, 0, g, 6, 4);
    const L = withLight ? K.light(0xffaa55, 1.4, 7.5, 0, h + 0.2, 0, g) : null;
    return { g, glass, L };
  }

  // ---------- textures ----------
  function cobbleTex(K) {
    return K.canvasTex(128, 128, (g) => {
      let s = 31; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = '#17110d'; g.fillRect(0, 0, 128, 128);
      const tones = ['#3e342b', '#463a2f', '#4c4034', '#3a3028', '#52453a', '#433830'];
      for (let y = 0; y < 128; y += 9) {
        let x = -Math.floor(r() * 8);
        while (x < 128) {
          const w = 7 + Math.floor(r() * 5), h = 7 + Math.floor(r() * 2), oy = Math.floor(r() * 2);
          g.fillStyle = tones[Math.floor(r() * tones.length)]; g.fillRect(x + 1, y + 1 + oy, w - 1, h - 1);
          g.fillRect(x + 2, y + oy, w - 3, 1); g.fillRect(x + 2, y + h + oy - 0, w - 3, 1);
          g.fillStyle = 'rgba(255,220,170,0.09)'; g.fillRect(x + 2, y + 1 + oy, w - 3, 1);
          g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x + 1, y + h - 1 + oy, w - 1, 1);
          x += w;
        }
      }
      for (let i = 0; i < 10; i++) { g.fillStyle = 'rgba(8,5,3,0.32)'; const x = r() * 110, y = r() * 110; g.fillRect(x, y, 10 + r() * 16, 5 + r() * 8); }
      for (let i = 0; i < 4; i++) { g.fillStyle = 'rgba(40,70,60,0.18)'; g.fillRect(r() * 120, r() * 120, 6, 4); }
    }, [9, 4.5]);
  }
  function brickTex(K, rep, dark) {
    return K.canvasTex(64, 64, (g) => {
      let s = 7; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = dark ? '#1c100c' : '#2a1812'; g.fillRect(0, 0, 64, 64);
      const tones = dark ? ['#4a2018', '#3e1c15', '#52251b'] : ['#6e3020', '#62291b', '#7a3826', '#5a2618'];
      for (let y = 0; y < 64; y += 8) for (let x = (y / 8) % 2 ? -8 : 0; x < 64; x += 16) {
        g.fillStyle = tones[Math.floor(r() * tones.length)]; g.fillRect(x + 1, y + 1, 14, 6);
        g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(x + 1, y + 5, 14, 2);
      }
      for (let i = 0; i < 5; i++) { g.fillStyle = 'rgba(8,4,2,0.35)'; g.fillRect(r() * 64, 0, 4 + r() * 8, 64); }
    }, rep);
  }
  function stoneTex(K, rep) {
    return K.canvasTex(64, 64, (g) => {
      let s = 13; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      g.fillStyle = '#231b15'; g.fillRect(0, 0, 64, 64);
      const tones = ['#5e5142', '#544838', '#675948'];

    }
    for (let r = 0; r < 9; r++) for (let c = 0; c < 4; c++) { const m = K.box(0.02, 0.05, 0.06, add(C.cyan), 0.46, 0.3 + r * 0.24, -0.25 + c * 0.15, rack); leds.push({ m, k: Math.random() * 10, c: C.cyan }); }
    // cables from rack to work table

    // work table + the PR being built (a glowing crystalline crate)

    for (const [x, z] of [[-0.4, -0.1], [0.8, -0.1], [-0.4, 0.7], [0.8, 0.7]]) K.box(0.08, 0.48, 0.08, frameM, x, 0.5, z, g);
    const core = K.group(g, 0.2, 1.15, 0.3);

    const crateEdge = K.box(0.56, 0.56, 0.56, new T.MeshBasicMaterial({ color: C.mag, wireframe: true, transparent: true, opacity: 0.9 }), 0, 0, 0, core);
    const scanRing = K.torus(0.42, 0.015, add(C.cyan), 4, 24, 0, 0, 0, core); scanRing.rotation.x = Math.PI / 2;
    // two arms
    const a1 = arm(K, g, 1.25, 1.2, C.mag), a2 = arm(K, g, -0.85, 1.3, C.cyan);
    for (const a of [a1, a2]) a.yaw.parent.scale.setScalar(1.25);
    // holographic code panes floating around
    const panes = [];
    const pane = (x, y, z, w2, h2, ry, color, accent) => {
      const tex = codeTex(K, hex(color), hex(accent)); tex.repeat.set(1, 0.7);
      const m = K.box(w2, h2, 0.01, basicMap(tex, { add: true, op: 0.95, fog: false, double: true }), x, y, z, g); m.rotation.y = ry;
      const fr = K.box(w2 + 0.06, h2 + 0.06, 0.005, add(color, 0.12), x, y, z, g); fr.rotation.y = ry;
      K.box(w2, 0.02, 0.01, add(color), x, y + h2 / 2 + 0.03, z, g).rotation.y = ry;
      panes.push({ m, fr, tex, x, y, z, ry, k: Math.random() * 5, color });
    };
    pane(0.1, 2.3, -1.2, 2.4, 1.3, 0, C.cyan, C.mag);
    pane(-1.5, 2.0, 0.3, 1.5, 1.0, Math.PI / 2, C.violet, C.cyan);
    pane(1.0, 2.75, 0.6, 1.1, 0.7, -0.5, C.mag, C.amber);
    // exterior: status pylon + monitor + feed belt carrying finished branches out
    const pylon = K.group(g, 2.15, 0.25, 2.15);
    K.box(0.22, 1.6, 0.22, K.mat(0x14132a), 0, 0.8, 0, pylon);
    const lamps = ['g', 'a', 'r'].map((k, i) => ({ k, m: K.box(0.26, 0.2, 0.26, add([C.lime, C.amber, C.red][i], 0.15), 0, 1.0 + i * 0.24, 0, pylon) }));
    const strobe = K.light(C.red, 0, 6, 0, 3.6, 0, g);
    const outBelt = K.group(g, 2.0, 0.26, -0.6);
    K.box(0.6, 0.1, 2.2, K.mat(0x1a1b30), 0, 0.05, 0, outBelt);
    K.box(0.04, 0.03, 2.2, add(C.cyan, 0.8), 0.3, 0.1, 0, outBelt);
    const chips = [0, 1, 2].map((i) => K.box(0.28, 0.16, 0.28, K.mat(0x1a1440, { e: C.violet, ei: 0.6 }), 0, 0.18, -1 + i * 0.7, outBelt));
    let k = 0, cd = 0, glitchT = 0;
    const ARM = [[0, 0.5, 0.6, 1.1], [0.25, 0.9, 0.5, 0.9], [0.5, 0.2, 0.75, 1.0], [0.75, -0.3, 0.55, 1.2], [1, 0.5, 0.6, 1.1]];
    return { g, update(t, dt, s) {
      const work = s === 'WORKING', blocked = s === 'BLOCKED';
      cd -= dt; glitchT -= dt;
      if (work) k = (k + dt * 0.35) % 1;
      const p1 = work ? K.keyframes(ARM, k) : blocked ? [0.6 + Math.sin(t * 30) * 0.05, 0.4, 1.0] : [0.4 + Math.sin(t * 0.6) * 0.15, 0.3, 0.9];
      const p2 = work ? K.keyframes(ARM, (k + 0.5) % 1) : blocked ? [-0.6, 0.5, 1.1] : [-0.4, 0.3, 0.9];
      a1.yaw.rotation.y = p1[0] + 2.4; a1.sh.rotation.x = -p1[1]; a1.el.rotation.x = -p1[2]; a1.wr.rotation.x = p1[1] + p1[2] - 0.4;
      a2.yaw.rotation.y = -p2[0] - 0.6; a2.sh.rotation.x = -p2[1]; a2.el.rotation.x = -p2[2]; a2.wr.rotation.x = p2[1] + p2[2] - 0.4;
      core.rotation.y += dt * (work ? 1.5 : blocked ? 0 : 0.3);
      scanRing.position.y = work ? Math.sin(t * 3) * 0.3 : 0;
      crate.material.emissive.setHex(blocked ? (Math.sin(t * 12) > 0 ? 0x600010 : 0x200008) : work ? 0x40107a : 0x1a0844);
      crateEdge.material.color.setHex(blocked ? C.red : C.mag);
      if (work && cd <= 0) {
        cd = 0.05;
        for (const a of [a1, a2]) { a.tip.getWorldPosition(K.v3); g.worldToLocal(K.v3); K.spawn(g, K.v3.x, K.v3.y, K.v3.z, K.R() * 1.5, 0.5 + Math.random(), K.R() * 1.5, Math.random() < 0.5 ? C.cyan : C.white, 0.35, 0.04, 5, true); }
      }
      panes.forEach((P) => {
        P.tex.offset.y -= dt * (work ? 0.35 : 0.05);
        const red = blocked;
        const glitch = red && Math.sin(t * 40 + P.k) > 0.6;
        P.m.material.color.setHex(red ? C.red : 0xffffff);
        P.m.position.x = P.x + (glitch ? (Math.random() - 0.5) * 0.15 : 0);
        P.m.scale.y = glitch ? 0.6 + Math.random() * 0.6 : 1;
        P.m.material.opacity = s === 'IDLE' ? 0.45 : 0.95;
        P.fr.material.color.setHex(red ? C.red : P.color);
        P.m.position.y = P.y + Math.sin(t * 1.2 + P.k) * 0.05;
      });
      leds.forEach((L) => { const on = Math.sin(t * (work ? 9 : 2) + L.k * 7) > 0.2; L.m.material.color.setHex(blocked ? (Math.sin(t * 10) > 0 ? C.red : 0x220006) : on ? L.c : 0x101020); });
      roofStrip.material.color.setHex(blocked ? (Math.sin(t * 10) > 0 ? C.red : 0x220006) : C.white);
      roofStrip.material.opacity = s === 'IDLE' ? 0.4 : 0.9;
      lamps.forEach((L) => (L.m.material.opacity = (work && L.k === 'g') || (s === 'IDLE' && L.k === 'a') || (blocked && L.k === 'r' && Math.sin(t * 10) > 0) ? 1 : 0.12));
      strobe.intensity = blocked ? (Math.sin(t * 10) > 0 ? 3 : 0) : 0;
      cellLight.intensity = blocked ? 0.6 : s === 'IDLE' ? 1.2 : 2.2; cellLight.color.setHex(blocked ? C.red : 0x9fdcff);
      chips.forEach((c, i) => { c.position.z = work ? ((-1 + i * 0.7 + t * 0.4) % 2.1 + 2.1) % 2.1 - 1 : -1 + i * 0.7; c.visible = s !== 'IDLE'; });
    } };
  }

  // =====================================================================
  // SPLITTER: Spark's AI core tower routing light packets
  // =====================================================================
  function buildSplitter(K) {
    const g = K.group();
    baseSlab(K, g, 4.8, 4.8, C.violet);
    // hex plinth in tiers
    const tiers = [[1.9, 0.3], [1.55, 0.3], [1.2, 0.25]];
    let y = 0.25;
    tiers.forEach(([r, h], i) => { K.cyl(r, r + 0.08, h, K.mat(i % 2 ? 0x1c1d36 : 0x14132a, { shine: 50 }), 6, 0, y + h / 2, 0, g); const ring = K.torus(r + 0.02, 0.035, add(i === 2 ? C.cyan : C.violet, 0.9), 4, 6, 0, y + h, 0, g); ring.rotation.x = Math.PI / 2; ring.rotation.z = Math.PI / 6; y += h; });
    // four pylons that hold the orb
    const top = y;
    const pyl = [];
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4, x = Math.cos(a) * 1.05, z = Math.sin(a) * 1.05;
      const p = K.box(0.16, 3.2, 0.16, K.mat(0x22243e, { shine: 60 }), x, top + 1.6, z, g);
      K.box(0.04, 3.0, 0.04, add(C.violet, 0.9), x * 0.93, top + 1.6, z * 0.93, g);
      pyl.push(p);
    }
    K.cyl(1.25, 1.25, 0.12, K.mat(0x22243e), 6, 0, top + 3.25, 0, g);
    K.cyl(0.5, 0.2, 0.5, K.mat(0x14132a), 6, 0, top + 3.55, 0, g);
    const antenna = K.cyl(0.03, 0.03, 1.2, K.mat(0x55597a), 4, 0, top + 4.3, 0, g);
    const tipLight = K.box(0.12, 0.12, 0.12, add(C.red), 0, top + 4.95, 0, g);
    // the orb + shells
    const oy = top + 1.6;
    const orb = K.sph(0.5, add(0xff8af0), 0, oy, 0, g, 16, 12);
    K.sph(0.28, add(0xffffff), 0, oy, 0, g, 12, 8);
    const halo = K.sph(0.72, add(C.mag, 0.25), 0, oy, 0, g, 16, 12);
    const halo2 = K.sph(0.95, add(C.violet, 0.1), 0, oy, 0, g, 16, 12);
    const rings = [
      K.torus(0.95, 0.04, add(C.cyan), 4, 32, 0, oy, 0, g),
      K.torus(1.15, 0.035, add(C.mag), 4, 32, 0, oy, 0, g),
      K.torus(1.35, 0.03, add(C.violet), 4, 32, 0, oy, 0, g)
    ];
    // ring nodes
    rings.forEach((r, i) => { for (let j = 0; j < 4; j++) { const a = j * Math.PI / 2; K.box(0.1, 0.1, 0.1, add(C.white), Math.cos(a) * r.geometry.parameters.radius, Math.sin(a) * r.geometry.parameters.radius, 0, r); } });
    const coreLight = K.light(C.mag, 2.5, 7, 0, oy, 0, g);
    // conduits: one intake from the back, three outputs to the front/right
    const path = (ang, inbound) => {
      const c = Math.cos(ang), sn = Math.sin(ang), P = (r, y) => [c * r, y, sn * r];
      const pts = [P(0.15, oy - 0.45), P(0.75, oy - 0.35), P(1.45, 1.6), P(1.85, 1.25), P(2.15, 0.75), P(2.25, 0.62)];
      return inbound ? pts.reverse() : pts;
    };
    const routes = [
      { pts: path(-3 * Math.PI / 4, true), c: C.white, inbound: true },
      { pts: path(Math.PI / 4), c: C.cyan },
      { pts: path(-0.25), c: C.mag },
      { pts: path(Math.PI / 2 + 0.25), c: C.amber }
    ];
    routes.forEach((r) => {
      r.curve = new T.CatmullRomCurve3(r.pts.map((p) => new T.Vector3(p[0], p[1], p[2])));
      K.mesh(new T.TubeGeometry(r.curve, 32, 0.09, 6, false), K.mat(0x2a2c50, { op: 0.55, shine: 80, depthWrite: false }), 0, 0, 0, g);
      K.mesh(new T.TubeGeometry(r.curve, 32, 0.035, 4, false), add(r.c, 0.75), 0, 0, 0, g);
      r.packets = [];
      for (let i = 0; i < 4; i++) r.packets.push({ m: K.box(0.17, 0.17, 0.17, add(r.inbound ? [C.cyan, C.mag, C.amber][i % 3] : r.c), 0, 0, 0, g), s: i / 4 });
    });
    // outlet docks at the end of each output
    const docks = routes.slice(1).map((r) => {
      const e = r.pts[r.pts.length - 1];
      const d = K.group(g, e[0] * 1.02, 0.26, e[2] * 1.02);
      K.box(0.5, 0.35, 0.5, K.mat(0x1c1d36, { shine: 40 }), 0, 0.17, 0, d);
      const lamp = K.box(0.52, 0.06, 0.52, add(r.c), 0, 0.36, 0, d);
      return { lamp, flash: 0 };
    });
    // intake hopper at the back
    const hop = K.group(g, -1.62, 0.26, -1.62);
    K.box(0.7, 0.5, 0.7, K.mat(0x1c1d36), 0, 0.25, 0, hop);
    K.box(0.72, 0.05, 0.72, add(C.white, 0.6), 0, 0.52, 0, hop);
    // hologram readout panel
    const readTex = codeTex(K, '#22e6ff', '#ff2bd6');
    const read = K.box(1.0, 0.6, 0.01, basicMap(readTex, { add: true, op: 0.85, fog: false, double: true }), 1.9, 1.5, 0.6, g); read.rotation.y = Math.PI / 2 - 0.3;
    const pv = new T.Vector3();
    return { g, update(t, dt, s) {
      const sort = s === 'SORTING';
      const sp = sort ? 1 : 0.15;
      rings[0].rotation.x += dt * 1.4 * sp + dt * 0.1; rings[0].rotation.y += dt * 0.8 * sp;
      rings[1].rotation.y += dt * 1.8 * sp + dt * 0.1; rings[1].rotation.z += dt * 0.6 * sp;
      rings[2].rotation.x -= dt * 0.9 * sp + dt * 0.05; rings[2].rotation.z += dt * 1.2 * sp;
      const pulse = 1 + Math.sin(t * (sort ? 7 : 2)) * (sort ? 0.12 : 0.05);
      orb.scale.setScalar(pulse); halo.scale.setScalar(pulse * (1 + 0.05 * Math.sin(t * 3)));
      halo.material.opacity = sort ? 0.35 : 0.18; halo2.material.opacity = sort ? 0.14 : 0.06;
      coreLight.intensity = sort ? 2.6 + Math.sin(t * 7) : 1.2;
      tipLight.visible = Math.sin(t * 3) > 0;
      routes.forEach((r, ri) => {
        r.packets.forEach((P, i) => {
          if (sort) P.s = (((P.s + Math.max(0, dt) * (r.inbound ? 0.45 : 0.55)) % 1) + 1) % 1;
          r.curve.getPointAt(P.s, pv); P.m.position.copy(pv);
          P.m.visible = sort || (r.inbound && i === 0);
          if (sort && !r.inbound && P.s > 0.97) docks[ri - 1].flash = 1;
        });
      });
      docks.forEach((d) => { d.flash = Math.max(0, d.flash - dt * 2.5); d.lamp.material.opacity = 0.35 + d.flash * 0.65; });
      readTex.offset.y -= dt * (sort ? 0.5 : 0.05);
      read.material.opacity = sort ? 0.85 : 0.35;
    } };
  }

    // corner warning beacons on the slab
    const warn = [[2.1, 2.1], [2.1, -1.4], [-1.4, 2.1]].map(([x, z]) => {

      return { rot, lamp, beam };
    });
    // the craft: sleek VTOL rocket built from a lathe profile
    const craft = K.group(g, 0.25, 0.58, 0.25);
    const bodyM = K.mat(0xaab0cc, { shine: 70, spec: 0x555577 });
    K.lathe([[0, 0], [0.42, 0.05], [0.5, 0.4], [0.5, 2.4], [0.44, 3.0], [0.3, 3.5], [0.12, 3.85], [0, 3.95]], bodyM, 16, 0, 0.35, 0, craft);

    K.tube([[-0.55, -0.8, 0.15], [-0.62, 0, 0.2], [-0.4, 0.85, 0.15], [0, 1.0, 0.12]], 0.1, C.barkL, cleft, 10, 5);
    K.tube([[0.55, -0.8, 0.15], [0.62, 0, 0.2], [0.4, 0.85, 0.15], [0, 1.0, 0.12]], 0.1, C.barkL, cleft, 10, 5);
    const core = K.mesh(new THREE.OctahedronGeometry(0.34, 0), K.glow(0xffd870), 0, 0, 0.25, cleft);
    const coreHalo = K.sph(0.62, K.glow(C.gGold, 0.3, true), 0, 0, 0.3, cleft, 10, 8);
    const coreRing = K.torus(0.5, 0.025, K.glow(C.gCyan, 0.7, true), 4, 24, 0, 0, 0.3, cleft);
    const coreL = K.light(0xffd88a, 1.6, 5, 0, 0.3, 0.9, cleft);
    // crown: three tiers, branches reaching out
    for (const [cx, cy, cz, cr, n] of [[-1.3, 5.0, 0.4, 1.5, 11], [1.2, 5.4, -0.6, 1.5, 11], [0.1, 6.2, 0.3, 1.3, 9], [0.6, 4.8, 1.0, 1.1, 7]]) {
      K.tube([[0, 3.8, 0], [cx * 0.5, cy - 0.9, cz * 0.5], [cx, cy - 0.4, cz]], 0.2, C.bark, tree, 10, 5);
      crown(K, tree, cx, cy, cz, cr, n);
    }
    // hanging moss and glow-lanterns of fungus
    const lanterns = [];
    for (let i = 0; i < 9; i++) { const a = i / 9 * TAU, r = 1.4 + (i % 3) * 0.35; K.box(0.05, 0.7 + (i % 4) * 0.35, 0.05, 0x7a8a48, Math.cos(a) * r, 4.2 - (i % 4) * 0.15, Math.sin(a) * r, tree); }
    for (const [a, r, y] of [[0.3, 1.7, 3.9], [2.2, 1.6, 4.0], [4.4, 1.8, 3.8]]) {
      K.box(0.03, 0.5, 0.03, 0x3a2a1a, Math.cos(a) * r, y + 0.25, Math.sin(a) * r, tree);
      lanterns.push(K.sph(0.13, K.glow(C.gCyan), Math.cos(a) * r, y - 0.05, Math.sin(a) * r, tree, 8, 6));
    }
    // the basin and three channels: Spark splits incoming feedback into routes
    const bx = 0.85, bz = 0.85;
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; K.box(0.36, 0.3, 0.26, i % 2 ? C.stone : C.stoneL, bx + Math.cos(a) * 0.82, 0.21, bz + Math.sin(a) * 0.82, g).rotation.y = -a; }
    const pool = K.cyl(0.72, 0.72, 0.06, K.mat(0x2a5a60, { e: 0x0a2a2c }), 14, bx, 0.28, bz, g);
    const swirl = K.torus(0.42, 0.04, K.glow(C.gCyan, 0.6, true), 4, 20, bx, 0.33, bz, g); swirl.rotation.x = Math.PI / 2;
    const routes = [
      { dir: [1, 0], len: 1.8, col: C.gGold, name: 'fix' },
      { dir: [0, 1], len: 1.6, col: C.gCyan, name: 'reply' },
      { dir: [-0.15, 1], len: 0, col: C.gGreen, name: 'idea' }
    ];
    const chans = [[1, 0, 1.75], [0, 1, 1.55], [0.7071, -0.7071, 1.15]];
    const flows = [];
    chans.forEach(([dx, dz, len], ci) => {
      const ang = Math.atan2(dx, dz);
      const ch = K.group(g, bx + dx * 0.8, 0.12, bz + dz * 0.8); ch.rotation.y = ang;
      for (const s of [-1, 1]) K.box(0.14, 0.2, len, C.stoneL, s * 0.24, 0.05, len / 2, ch);
      K.box(0.34, 0.06, len, K.mat(C.water, { e: 0x174a50 }), 0, 0.02, len / 2, ch);
      const col = [C.gGold, C.gCyan, C.gGreen][ci];
      K.box(0.36, 0.3, 0.12, col === C.gGold ? 0x8a6a2a : col === C.gCyan ? 0x2a6a6a : 0x3a6a2a, 0, 0.12, len + 0.05, ch);
      const sig = K.box(0.18, 0.18, 0.06, K.glow(col), 0, 0.42, len + 0.08, ch);
      const motes = [];
      for (let i = 0; i < 4; i++) motes.push(K.box(0.12, 0.12, 0.12, K.glow(col), 0, 0.14, 0, ch));
      flows.push({ ch, len, motes, sig, col });
    });
    // a small waterwheel on the gold channel
    const wheel = K.group(g, bx + 1.65, 0.45, bz - 0.36);
    const wr = K.group(wheel); wheel.rotation.y = Math.PI / 2;
    K.torus(0.38, 0.04, C.barkL, 4, 12, 0, 0, 0, wr);
    for (let i = 0; i < 8; i++) { const sp = K.box(0.06, 0.74, 0.06, C.bark, 0, 0, 0, wr); sp.rotation.z = i / 8 * Math.PI; K.box(0.1, 0.18, 0.2, C.barkD, Math.cos(i / 8 * TAU) * 0.38, Math.sin(i / 8 * TAU) * 0.38, 0, wr).rotation.z = i / 8 * TAU; }
    K.cyl(0.04, 0.04, 0.5, C.barkD, 5, 0, 0, 0, wheel).rotation.x = Math.PI / 2;
    for (const s of [-1, 1]) K.box(0.08, 0.5, 0.08, C.barkD, 0, -0.25, s * 0.22, wheel);
    // incoming feedback: dim motes drifting in from the forest behind
    const incoming = [];
    for (let i = 0; i < 7; i++) incoming.push({ m: K.box(0.13, 0.13, 0.13, K.glow([0xff7a5a, 0x9ab8ff, 0xffb84a][i % 3]), 0, 0, 0, g), k: i / 7 });
    // mycelium threads glowing in the moss
    const myc = [];
    for (let i = 0; i < 6; i++) {
      const a = 2.0 + i * 0.5; const m = K.glow(C.gCyan, 0.5, true);
      const pts = [[tx, 0.14, tz]]; for (let j = 1; j <= 4; j++) pts.push([tx + Math.cos(a + Math.sin(j) * 0.4) * j * 0.5, 0.14, tz + Math.sin(a + Math.sin(j) * 0.4) * j * 0.5]);
      myc.push({ t: K.tube(pts, 0.025, m, g, 16, 3), m });
    }
    let fk = 0, sporeT = 0;
    return { g, update(t, dt, s) {
      dt = Math.max(0, dt);
      const on = s === 'SORTING';
      sporeT -= dt;
      if (on) fk += dt;
      const pulse = on ? 0.75 + 0.25 * Math.sin(t * 6) : 0.4 + 0.15 * Math.sin(t * 1.3);
      core.rotation.y += dt * (on ? 2.4 : 0.5); core.rotation.x = Math.sin(t) * 0.2;
      core.scale.setScalar(0.85 + pulse * 0.3);
      coreHalo.material.opacity = 0.1 + pulse * 0.22; coreHalo.scale.setScalar(0.9 + pulse * 0.4);
      coreRing.rotation.x = t * (on ? 1.6 : 0.4); coreRing.rotation.y = t * (on ? 1.1 : 0.3);
      coreL.intensity = 0.5 + pulse * 1.4;
      swirl.rotation.z = t * (on ? 2.5 : 0.5); swirl.material.opacity = on ? 0.45 : 0.2;
      wr.rotation.z -= dt * (on ? 2.2 : 0.3);
      lanterns.forEach((l, i) => l.scale.setScalar(0.85 + 0.2 * Math.sin(t * 2 + i)));
      myc.forEach((m, i) => (m.m.opacity = on ? 0.35 + 0.4 * Math.max(0, Math.sin(t * 4 - i)) : 0.18));
      flows.forEach((f, ci) => {
        f.motes.forEach((m, i) => {
          const p = ((fk * 0.55 + i / f.motes.length + ci * 0.13) % 1);
          m.visible = on; m.position.z = p * f.len; m.position.y = 0.16 + Math.sin(p * 9) * 0.03;
        });
        f.sig.material.color.setHex(on && Math.sin(t * 5 + ci * 2) > 0 ? f.col : 0x2a2a2a);
      });
      incoming.forEach((m) => {
        const p = (m.k + t * (on ? 0.22 : 0.06)) % 1;
        const a = m.k * 6.28;
        m.m.position.set(tx + 0.6 + Math.cos(a) * (1 - p) * 2.4 - 0.3 * p, 1.55 + (1 - p) * 1.6 + Math.sin(t * 2 + a) * 0.2, tz - 2.2 * (1 - p) + 0.6 * p + Math.sin(a) * (1 - p));
        m.m.scale.setScalar(p > 0.85 ? (1 - p) * 6.6 : 1);
      });
      if (on && sporeT <= 0) { sporeT = 0.07; K.spawn(g, tx + 0.7 + K.R() * 0.4, 1.6, tz + 0.7 + K.R() * 0.4, K.R() * 0.8, 0.8 + Math.random() * 0.8, K.R() * 0.8, [C.gGold, C.gCyan, C.gGreen][Math.floor(Math.random() * 3)], 1.4, 0.06, -0.1, true); }
    } };
  }

  // =====================================================================
  // LAUNCH PAD: the Seed Circle
  // =====================================================================
  function buildLaunch(K) {
    const g = K.group();
    K.cyl(2.5, 2.6, 0.12, C.mossD, 14, 0, 0.06, 0, g);
    // standing stones with runes
    const runes = [];
    const N = 7;
    for (let i = 0; i < N; i++) {
      const a = i / N * TAU + 0.45, r = 2.05, h = 1.5 + ((i * 37) % 5) * 0.18;
      const st = K.group(g, Math.cos(a) * r, 0, Math.sin(a) * r); st.rotation.y = -a + Math.PI / 2; st.rotation.z = ((i * 13) % 7 - 3) * 0.02;
      K.box(0.62, h, 0.38, i % 2 ? C.stone : C.stoneL, 0, h / 2, 0, st);
      K.box(0.5, 0.3, 0.3, C.stoneD, 0.04, 0.12, 0.02, st);
      const cap = K.rock(0.36, C.moss, 0, h + 0.02, 0, st); cap.scale.set(1.05, 0.38, 0.7);
      const rm = new THREE.MeshBasicMaterial({ color: 0x223a2a });
      for (let j = 0; j < 3; j++) runes.push({ m: rm, i, mesh: K.box(j === 1 ? 0.24 : 0.08, j === 1 ? 0.07 : 0.22, 0.04, rm, (j - 1) * 0.12, h * 0.55 + j * 0.16, 0.2, st) });
      K.box(0.05, h * 0.5, 0.05, C.mossL, -0.24, h * 0.35, 0.2, st);
    }
    // stone dais with a carved glowing ring
    K.cyl(1.35, 1.45, 0.3, C.stone, 14, 0, 0.27, 0, g);
    K.cyl(1.05, 1.1, 0.18, C.stoneL, 14, 0, 0.5, 0, g);
    const ring = K.torus(0.86, 0.04, K.glow(0x3a5a3a), 4, 28, 0, 0.6, 0, g); ring.rotation.x = Math.PI / 2;
    // the stalk, wrapped in climbing vines
    const pod = K.group(g, 0, 0.6, 0);
    K.cyl(0.2, 0.32, 1.1, C.barkL, 8, 0, 0.55, 0, pod);
    for (let v = 0; v < 2; v++) { const pts = []; for (let i = 0; i <= 10; i++) { const a = i * 0.9 + v * Math.PI; pts.push([Math.cos(a) * 0.3, i * 0.11, Math.sin(a) * 0.3]); } K.tube(pts, 0.05, C.mossL, pod, 30, 4); }
    for (let i = 0; i < 4; i++) { const lf = K.box(0.45, 0.04, 0.2, C.leafM, Math.cos(i * 1.6) * 0.45, 0.2 + i * 0.18, Math.sin(i * 1.6) * 0.45, pod); lf.rotation.y = -i * 1.6; lf.rotation.z = 0.35; }
    // the bulb: a cup of sepals, six great petals hinged around it, the seed inside
    const bulb = K.group(pod, 0, 1.1, 0);
    K.lathe([[0.15, 0], [0.5, 0.15], [0.62, 0.4], [0.5, 0.6], [0.4, 0.62]], K.mat(C.leaf, { double: true }), 10, 0, 0, 0, bulb);
    const petals = [];
    for (let i = 0; i < 6; i++) {
      const hinge = K.group(bulb, 0, 0.35, 0); hinge.rotation.y = i / 6 * TAU;
      const leaf = K.group(hinge, 0, 0, 0.5);
      const pm = K.mat(i % 2 ? C.petal : C.petalPink);
      const p1 = K.sph(0.36, pm, 0, 0.85, 0, leaf, 8, 6); p1.scale.set(1, 2.4, 0.28);
      K.box(0.05, 1.5, 0.06, i % 2 ? 0xc89a7a : 0xb87a70, 0, 0.8, 0.11, leaf);
      petals.push({ hinge, leaf, pm });
    }
    const seed = K.sph(0.36, K.glow(0xffd060), 0, 1.25, 0, bulb, 12, 10);
    const seedHalo = K.sph(0.7, K.glow(C.gGold, 0.25, true), 0, 1.25, 0, bulb, 10, 8);
    const seedL = K.light(0xffd88a, 1.5, 7, 0, 2.6, 0.4, g);
    // the beam left behind by a launch
    const beam = K.cyl(0.35, 0.6, 40, K.glow(0xffe8a0, 0, true), 10, 0, 20, 0, g);
    // the flying seed (separate so it can leave the pod)
    const flyer = K.group(g);
    K.sph(0.36, K.glow(0xfff8e0), 0, 0, 0, flyer, 12, 10);
    K.sph(0.75, K.glow(C.gGold, 0.35, true), 0, 0, 0, flyer, 10, 8);
    for (let i = 0; i < 8; i++) { const f = K.box(0.03, 0.55, 0.03, 0xfff2d0, 0, 0, 0, flyer); f.position.set(Math.cos(i / 8 * TAU) * 0.3, 0.4, Math.sin(i / 8 * TAU) * 0.3); f.rotation.set(Math.sin(i / 8 * TAU) * 0.5, 0, -Math.cos(i / 8 * TAU) * 0.5); }
    flyer.visible = false;
    let trailT = 0, pollenT = 0, cd = 0, lastS = '';
    const setOpen = (o, droop) => petals.forEach((P, i) => { P.hinge.rotation.x = 0; P.leaf.rotation.x = -0.18 + o * 1.25 + (droop || 0) + Math.sin(i * 1.3) * 0.03; });
    return { g, update(t, dt, s) {
      dt = Math.max(0, dt);
      trailT -= dt; pollenT -= dt;
      if (s !== lastS) { lastS = s; cd = 0; }
      runes.forEach((r) => r.m.color.setHex(0x2a4a2a));
      if (s === 'IDLE') {
        cd = 0; flyer.visible = false; beam.material.opacity = 0; bulb.scale.setScalar(1); seed.visible = seedHalo.visible = true;
        const br = Math.sin(t * 0.9) * 0.04; setOpen(0.02 + br);
        seed.scale.setScalar(0.6); seedHalo.material.opacity = 0.12; seedL.intensity = 0.6;
        ring.material.color.setHex(0x3a6a3a); petals.forEach((P, i) => P.pm.color.setHex(i % 2 ? C.petal : C.petalPink));
        runes.forEach((r) => r.m.color.setHex(Math.sin(t * 0.8 + r.i) > 0.85 ? 0x6ad88a : 0x2a4a2a));
      } else if (s === 'COUNTDOWN') {
        cd += dt; const c = cd % 4.5, k = c / 4.5;
        flyer.visible = false; beam.material.opacity = 0; bulb.scale.setScalar(1); seed.visible = seedHalo.visible = true;
        setOpen(Math.min(1, k * 1.3) * 0.85 + Math.sin(t * 6) * 0.02);
        const lit = Math.floor(k * N + 0.999);
        runes.forEach((r) => r.m.color.setHex(r.i < lit ? (Math.sin(t * 10) > -0.3 ? 0x9cff9a : 0x4aa86a) : 0x2a4a2a));
        seed.scale.setScalar(0.7 + k * 0.45 + Math.sin(t * 14) * 0.03 * k); seedHalo.material.opacity = 0.12 + k * 0.3; seedHalo.scale.setScalar(1 + k * 0.6);
        seedL.intensity = 1 + k * 3.5; ring.material.color.setHex(k > 0.5 && Math.sin(t * 12) > 0 ? 0xffe28a : 0x7ad87a);
        if (pollenT <= 0) { pollenT = 0.04; const a = t * 3 + Math.random() * 6; K.spawn(g, Math.cos(a) * 1.7, 0.7, Math.sin(a) * 1.7, -Math.cos(a) * 0.5, 0.9 + k * 1.2, -Math.sin(a) * 0.5, Math.random() < 0.5 ? 0xffe28a : 0xc8ff9a, 1.6, 0.06, -0.2, true); }
      } else {
        cd += dt; const c = cd % 7.5;
        runes.forEach((r) => r.m.color.setHex(c < 3.2 ? 0xfff2b0 : 0x3a6a3a));
        if (c < 0.6) {
          const k = c / 0.6; setOpen(0.85 + k * 0.35); flyer.visible = false; seed.visible = seedHalo.visible = true; bulb.scale.setScalar(1 - k * 0.08);
          seed.scale.setScalar(1.15 + k * 0.2); seedHalo.material.opacity = 0.7; seedL.intensity = 4.5; beam.material.opacity = 0;
        } else if (c < 3.4) {
          const k = (c - 0.6) / 2.8, y = 2.95 + Math.pow(k, 1.8) * 34;
          seed.visible = seedHalo.visible = false; flyer.visible = true; flyer.position.set(Math.sin(k * 9) * 0.2 * k, y, Math.cos(k * 9) * 0.2 * k); flyer.rotation.y += dt * 6;
          setOpen(1.2); bulb.scale.setScalar(1);
          beam.material.opacity = 0.32 * (1 - k * 0.7); beam.scale.x = beam.scale.z = 1 - k * 0.5;
          seedL.intensity = 3 * (1 - k); ring.material.color.setHex(0xfff2b0);
          if (trailT <= 0) {
            trailT = 0.025;
            for (let j = 0; j < 2; j++) { const a = t * 11 + j * Math.PI; K.spawn(g, flyer.position.x + Math.cos(a) * 0.5, y - 0.4, flyer.position.z + Math.sin(a) * 0.5, Math.cos(a) * 0.7, -0.4, Math.sin(a) * 0.7, j ? 0xffe28a : 0xfff8e0, 1.4, 0.1, 0.1, true); }
            K.spawn(g, flyer.position.x + K.R(), y - 0.6, flyer.position.z + K.R(), K.R() * 1.5, 0.2, K.R() * 1.5, Math.random() < 0.5 ? C.petalPink : C.petal, 2.4, 0.14, 0.8);
          }
        } else if (c < 4.8) {
          const k = (c - 3.4) / 1.4; flyer.visible = false; beam.material.opacity = 0.1 * (1 - k);
          setOpen(1.2, k * 0.45); petals.forEach((P) => P.pm.color.lerpColors(new THREE.Color(C.petal), new THREE.Color(0x8a6a4a), k));
          bulb.scale.setScalar(1 - k * 0.9); seedL.intensity = 0.3; ring.material.color.setHex(0x3a6a3a);
        } else {
          const k = Math.min(1, (c - 4.8) / 2.2); beam.material.opacity = 0; flyer.visible = false;
          petals.forEach((P, i) => P.pm.color.setHex(i % 2 ? C.petal : C.petalPink));
          bulb.scale.setScalar(Math.max(0.05, 0.1 + k * 0.9)); setOpen(1 - k * 0.98);
          seed.visible = seedHalo.visible = k > 0.4; seed.scale.setScalar(Math.max(0.01, (k - 0.4) * 1.0)); seedHalo.material.opacity = 0.1; seedL.intensity = 0.5;
          if (pollenT <= 0) { pollenT = 0.12; K.spawn(g, K.R() * 1.2, 1.2, K.R() * 1.2, 0, 0.5, 0, 0xc8ff9a, 1.0, 0.05, -0.1, true); }
        }
      }
    } };
  }

  SHIP.register({
    id: 'wild', name: 'WILDWOOD', eyebrow: 'NATURE', accent: '#c9e06a',
    pitch: 'An ancient forest glade at golden hour. Nothing here is built. The machines are grown: a stump that weaves code on a loom of living roots, a heartwood tree whose seed-crystal sorts the forest’s whispers into streams, and a ring of standing stones that fires a glowing seed into the sky when a change ships.',
    palette: ['#1d3a22', '#2c5a2a', '#6e9a3a', '#4a3423', '#8a6842', '#6b685e', '#3a7d86', '#ffd56a', '#a8ff7a', '#7ff0e0'],
    keywords: ['GOLDEN HOUR', 'ANCIENT TREES', 'MOSS + RUINS', 'WATERFALL', 'BIOLUMINESCENCE', 'GROWN, NOT BUILT'],
    sky: { top: '#2e4a66', bottom: '#e8b57a', fog: '#b89a6a', fogNear: 62, fogFar: 120 },
    light: { sun: 0xffc27a, sunI: 1.35, sunDir: [-7, 12, 16], hemiSky: 0x8aa0b8, hemiGnd: 0x2a2416, hemiI: 0.5 },
    finish: { levels: 40, dither: 0.12, outline: 0.42, thresh: 0.085, ink: '#10140a', sat: 1.0, contrast: 1.12, bloom: 0.42, bloomThresh: 0.7, vignette: 0.38, grade: 0.4, shadow: '#1f3a5a', high: '#ffd890', scan: 0 },
    world,
    components: [
      { id: 'assembler', name: 'ROOT LOOM', blurb: 'The assembler: a coding agent at work. A hollow stump whose living roots weave glowing threads of code across a loom; every finished weave unfurls as a leaf.', states: ['IDLE', 'WORKING', 'BLOCKED'], build: buildAssembler },
      { id: 'splitter', name: 'SPARK HEARTWOOD', blurb: 'The splitter: Muse Spark. Feedback drifts in from the forest, the seed-crystal in the heartwood reads it, and the basin splits it down three channels: fix, reply, idea.', states: ['IDLE', 'SORTING'], build: buildSplitter },
      { id: 'launch', name: 'SEED CIRCLE', blurb: 'The launch pad: a merged PR ships. Runes wake stone by stone, the pod opens, and the seed fires skyward on a spiral of pollen before a new pod regrows.', states: ['IDLE', 'COUNTDOWN', 'LAUNCH'], build: buildLaunch }
    ]
  });
})();

  // ---------- pixel pass: outline ink, bloom, grade, vignette, scanlines, quantize ----------

    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform vec2 res; uniform float smoothMode, levels, dither, outline, thresh, sat, contrast, bloom, bloomThresh, vignette, grade, scan;',
      'uniform vec3 ink, shadowT, highT; varying vec2 vUv;',
      'float b2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }',
      'float b4(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a); }',
      'float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }',
      'vec3 tap(vec2 uv){ return texture2D(tDiffuse, uv).rgb; }',
      'void main(){',
      '  vec2 p = floor(vUv * res); vec2 uv = (p + 0.5) / res; vec2 t = 1.0 / res;',
      '  vec3 c = tap(uv); float l = lum(c);',
      '  float n = max(max(lum(tap(uv + vec2(t.x, 0.0))), lum(tap(uv - vec2(t.x, 0.0)))), max(lum(tap(uv + vec2(0.0, t.y))), lum(tap(uv - vec2(0.0, t.y)))));',
      '  vec3 acc = vec3(0.0);',
      '  if (bloom > 0.0) { for (int i = 0; i < 12; i++) { float a = (float(i) + b4(p)) * 0.5236; vec2 d = vec2(cos(a), sin(a));',
      '    vec3 s1 = tap(uv + d * t * 2.0); vec3 s2 = tap(uv + d * t * 4.5); vec3 s3 = tap(uv + d * t * 8.0);',
      '    acc += s1 * max(0.0, lum(s1) - bloomThresh) * 1.2 + s2 * max(0.0, lum(s2) - bloomThresh) * 0.8 + s3 * max(0.0, lum(s3) - bloomThresh) * 0.5; } }',
      '  c = mix(c, ink, outline * step(thresh, n - l) * (1.0 - smoothMode));',
      '  c += acc * bloom * 0.16;',
      '  c = mix(vec3(lum(c)), c, sat); c = (c - 0.5) * contrast + 0.5;',
      '  float L = clamp(lum(c), 0.0, 1.0); vec3 tg = mix(shadowT, highT, smoothstep(0.05, 0.85, L));',
      '  c *= 1.0 + grade * (tg - vec3(lum(tg))) * 1.6;',
      '  vec2 q = vUv - 0.5; c *= 1.0 - vignette * smoothstep(0.3, 0.8, length(q * vec2(1.0, 0.85)));',
      '  c *= 1.0 - scan * step(1.0, mod(p.y, 2.0)) * (1.0 - smoothMode);',
      '  if (smoothMode < 0.5) { float d = (b4(p) - 0.5) * dither; c = floor(c * levels + d + 0.5) / levels; }',
      '  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });
  const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); quad.frustumCulled = false; postScene.add(quad);
  function setFinish(F) {
    const U = post.uniforms;
    for (const k of ['levels', 'dither', 'outline', 'thresh', 'sat', 'contrast', 'bloom', 'bloomThresh', 'vignette', 'grade', 'scan']) if (F[k] !== undefined) U[k].value = F[k];
    U.ink.value.set(F.ink || '#000000'); U.shadowT.value.set(F.shadow || '#808080'); U.highT.value.set(F.high || '#808080');
  }

  // ---------- worlds ----------
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
  const target = new THREE.Vector3(0, 1.6, 0), targetGoal = target.clone();
  let viewH = 14, viewGoal = 14, zoom = 1, W = 2, H = 2, pxSel = 2;
  const worlds = {};
  function gradientTex(top, bottom) {
    return K.canvasTex(2, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); });
  }
  function buildWorld(s) {
    SHIP._resetLights();
    const scene = new THREE.Scene();
    const sky = s.sky || {};
    const bg = gradientTex(sky.top || '#10142a', sky.bottom || '#05060c'); bg.magFilter = bg.minFilter = THREE.LinearFilter; scene.background = bg;
    if (sky.fog) scene.fog = new THREE.Fog(sky.fog, sky.fogNear || 40, sky.fogFar || 90);
    const L = s.light || {};
    const hemi = new THREE.HemisphereLight(L.hemiSky || 0xd6deff, L.hemiGnd || 0x40344a, L.hemiI === undefined ? 0.6 : L.hemiI); scene.add(hemi);
    const sun = new THREE.DirectionalLight(L.sun || 0xfff0d2, L.sunI === undefined ? 0.9 : L.sunI);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 });
    sun.shadow.bias = -0.0008;
    scene.add(sun, sun.target);
    const root = K.group(scene); root.rotation.y = Math.PI / 4;
    const env = s.world(K, root, scene) || { update() {} };
    const comps = s.components.map((c, i) => {
      const holder = K.group(root, K.SLOTS[i], 0, 0); holder.rotation.y = -Math.PI / 4;
      const inst = c.build(K);
      holder.add(inst.g);
      return { def: c, inst, holder, si: Math.min(1, c.states.length - 1) };
    });
    return { s, scene, sun, hemi, root, env, comps, sunDir: new THREE.Vector3().fromArray(L.sunDir || [10, 22, 6]) };
  }

  let cur = null, focus = -1;
  function show(id) {
    const s = styles.find((x) => x.id === id) || styles[0];
    if (!worlds[s.id]) worlds[s.id] = buildWorld(s);
    cur = worlds[s.id];
    document.documentElement.style.setProperty('--accent', s.accent || '#f2a93b');
    setFinish(s.finish || {});
    focus = -1; targetGoal.set(0, 1.6, 0); viewGoal = fitAll();
    renderTabs(); renderMood(); renderLabels();
    try { localStorage.setItem('shiptorio-diorama', s.id); } catch (e) {}
  }
  SHIP.show = show;
  SHIP.focus = (i) => focusOn(i);

  function fitAll() { const a = W / H; return Math.max(12, Math.min(26, 25 / Math.max(a, 0.6))); }
  function focusOn(i) {
    focus = i; const c = cur.comps[i];
    c.holder.getWorldPosition(K.v3); targetGoal.set(K.v3.x, 2.1, K.v3.z); viewGoal = W / H < 1 ? 11 : 8.5;
    renderMood();
  }
  function unfocus() { focus = -1; targetGoal.set(0, 1.6, 0); viewGoal = fitAll(); renderMood(); }

  // ---------- UI ----------
  function renderTabs() {
    const nav = $('tabs'); nav.innerHTML = '';
    styles.forEach((s) => { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = s.name; b.setAttribute('aria-pressed', cur && cur.s === s); b.onclick = () => show(s.id); nav.appendChild(b); });
  }
  function renderMood() {
    const s = cur.s;
    $('m-eyebrow').textContent = 'MOOD BOARD · ' + (s.eyebrow || 'WORLD');
    $('m-name').textContent = s.name; $('m-pitch').textContent = s.pitch;
    const sw = $('m-sw'); sw.innerHTML = ''; (s.palette || []).forEach((h) => { const i = document.createElement('i'); i.style.background = h; sw.appendChild(i); });
    const kw = $('m-kw'); kw.innerHTML = ''; (s.keywords || []).forEach((k) => { const sp = document.createElement('span'); sp.textContent = k; kw.appendChild(sp); });
    const root = $('m-comps'); root.innerHTML = '';
    cur.comps.forEach((c, i) => {
      const el = document.createElement('div'); el.className = 'comp'; el.tabIndex = 0; el.setAttribute('aria-current', focus === i);
      el.innerHTML = '<b></b><p></p><div class="states"></div>';
      el.querySelector('b').textContent = c.def.name; el.querySelector('p').textContent = c.def.blurb;
      const st = el.querySelector('.states');
      c.def.states.forEach((name, j) => { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = name; b.setAttribute('aria-pressed', j === c.si); b.onclick = (e) => { e.stopPropagation(); c.si = j; renderMood(); }; st.appendChild(b); });
      el.onclick = () => (focus === i ? unfocus() : focusOn(i));
      el.onkeydown = (e) => { if (e.key === 'Enter' && e.target === el) el.onclick(); };
      root.appendChild(el);
    });
  }
  let showLabels = true;
  function renderLabels() {
    const root = $('labels'); root.innerHTML = '';
    cur.comps.forEach((c, i) => { const b = document.createElement('button'); b.className = 'label'; b.textContent = c.def.name; b.onclick = () => focusOn(i); root.appendChild(b); c.label = b; });
  }
  const pv = new THREE.Vector3();
  function placeLabels() {
    cur.comps.forEach((c) => {
      if (!showLabels || focus >= 0) { c.label.style.display = 'none'; return; }
      c.holder.getWorldPosition(pv); pv.y = -0.2; pv.x += 1.6; pv.z += 1.6; pv.project(cam);
      c.label.style.display = 'block';
      c.label.style.transform = 'translate(' + Math.round((pv.x + 1) / 2 * W) + 'px,' + Math.round((1 - pv.y) / 2 * H) + 'px) translate(-50%,0)';
    });
  }
  document.querySelectorAll('[data-px]').forEach((b) => b.onclick = () => { pxSel = +b.dataset.px; syncPx(); });
  function syncPx() { document.querySelectorAll('[data-px]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.px === pxSel)); }
  $('b-all').onclick = unfocus;
  let cycle = false, cycleT = 0;
  $('b-cycle').onclick = (e) => { cycle = !cycle; e.currentTarget.setAttribute('aria-pressed', cycle); };
  $('b-labels').onclick = (e) => { showLabels = !showLabels; e.currentTarget.setAttribute('aria-pressed', showLabels); };
  $('hide').onclick = () => { $('mood').hidden = true; $('showMood').hidden = false; };
  $('showMood').onclick = () => { $('mood').hidden = false; $('showMood').hidden = true; };
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') unfocus(); });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - drag.x; drag.x = e.clientX; cur.root.rotation.y += dx * 0.004; });
  const end = () => (drag = null); canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(2.5, zoom * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  function resize() { W = window.innerWidth; H = window.innerHeight; renderer.setSize(W, H, false); if (cur && focus < 0) viewGoal = fitAll(); }
  window.addEventListener('resize', resize);

  // ---------- loop ----------
  resize();
  if (window.innerWidth < 820) { showLabels = false; $('b-labels').setAttribute('aria-pressed', 'false'); }
  let start = null; try { start = localStorage.getItem('shiptorio-diorama'); } catch (e) {}
  const qs = new URLSearchParams(location.search).get('style');
  show(qs || start || styles[0].id); syncPx();
  target.copy(targetGoal); viewH = viewGoal;
  $('loading').hidden = true;
  let last = performance.now(), t = 0;
  const yaw = Math.PI / 4, tilt = 30 * Math.PI / 180, D = 60;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; t += dt;
    const w = cur;
    if (cycle) { cycleT += dt; if (cycleT > 3.5) { cycleT = 0; w.comps.forEach((c) => (c.si = (c.si + 1) % c.def.states.length)); renderMood(); } }
    w.env.update && w.env.update(t, dt);
    w.comps.forEach((c) => c.inst.update(t, dt, c.def.states[c.si]));
    SHIP._fx.updateFx(dt);
    const k = 1 - Math.exp(-dt * 5); target.lerp(targetGoal, k); viewH += (viewGoal - viewH) * k;
    const a = W / H, vh = viewH * zoom;
    cam.left = -vh * a / 2; cam.right = vh * a / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
    cam.position.set(target.x + D * Math.cos(tilt) * Math.sin(yaw), target.y + D * Math.sin(tilt), target.z + D * Math.cos(tilt) * Math.cos(yaw)); cam.lookAt(target);
    w.sun.position.copy(w.sunDir).add(new THREE.Vector3(target.x, 0, target.z)); w.sun.target.position.set(target.x, 0, target.z);
    const px = pxSel === 0 ? 1 : pxSel;
    const rw = Math.max(1, Math.ceil(W / px)), rh = Math.max(1, Math.ceil(H / px));
    if (rt.width !== rw || rt.height !== rh) rt.setSize(rw, rh);
    post.uniforms.res.value.set(rw, rh); post.uniforms.smoothMode.value = pxSel === 0 ? 1 : 0;
    renderer.setRenderTarget(rt); renderer.render(w.scene, cam);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    placeLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
