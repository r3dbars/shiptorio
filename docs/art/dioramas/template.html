<title>Shiptorio Dioramas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One-screen app: the diorama fills the screen; tabs on top, the mood board card on the left,
   view controls bottom right. Chrome is neutral and borrows each world's accent. */
:root {
  --bg: #07080f;
  --panel: rgba(9, 11, 22, 0.9);
  --line: #3a4270;
  --ink: #eef1fa;
  --dim: #a3abcf;
  --accent: #f2a93b;
  --focus: #6fb2ff;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 12px/1.5 var(--mono); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.card { background: var(--panel); border: 2px solid var(--line); outline: 2px solid #000; backdrop-filter: blur(2px); }
.ptitle { font: 700 20px/1.05 var(--pixel); letter-spacing: 0.08em; margin: 0; text-wrap: balance; }
.eyebrow { font: 400 10px/1.2 var(--pixel); letter-spacing: 0.12em; color: var(--dim); }
.tbtn { font: 400 10px/1 var(--pixel); letter-spacing: 0.06em; color: var(--ink); background: rgba(9, 11, 22, 0.92); border: 2px solid var(--line); min-height: 30px; padding: 0 10px; cursor: pointer; }
.tbtn:hover { border-color: var(--dim); }
.tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0904; }
.tbtn:focus-visible, .comp:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#tabs { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; z-index: 5; }
#tabs .tbtn { min-height: 34px; padding: 0 14px; font-size: 12px; }

#mood { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: 300px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
#mood .pitch { margin: 0; font-size: 11.5px; line-height: 1.55; }
.sw { display: flex; height: 12px; border: 1px solid #000; }
.sw i { flex: 1; }
.kw { display: flex; flex-wrap: wrap; gap: 4px; }
.kw span { font: 400 9px/1 var(--pixel); letter-spacing: 0.08em; padding: 4px 5px; border: 1px solid var(--line); color: var(--dim); }
.comp { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); cursor: pointer; background: rgba(255,255,255,0.02); }
.comp:hover { border-color: var(--dim); }
.comp[aria-current="true"] { border-color: var(--accent); }
.comp b { font: 700 11px var(--pixel); letter-spacing: 0.08em; }
.comp p { margin: 0; font-size: 11px; color: var(--dim); line-height: 1.5; }
.states { display: flex; flex-wrap: wrap; gap: 3px; }
.states .tbtn { min-height: 24px; font-size: 9px; padding: 0 6px; }
#hide { align-self: flex-start; }

#ctrl { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-items: center; justify-content: flex-end; max-width: calc(100% - 24px); z-index: 4; }
#ctrl .eyebrow { margin: 0 4px 0 6px; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.label { position: absolute; left: 0; top: 0; background: rgba(9, 11, 22, 0.88); border: 1px solid var(--line); padding: 3px 7px 4px; white-space: nowrap; font: 700 10px var(--pixel); letter-spacing: 0.08em; color: var(--ink); pointer-events: auto; cursor: pointer; }
.label:hover { border-color: var(--accent); }
#showMood { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); z-index: 4; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 14px var(--pixel); letter-spacing: 0.1em; color: var(--dim); pointer-events: none; z-index: 1; }

@media (max-width: 820px) {
  #tabs { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none; justify-content: center; }
  #tabs .tbtn { padding: 0 8px; font-size: 10px; flex: 1; }
  #mood { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-height: 40vh; }
  #showMood { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  #ctrl { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); justify-content: center; }
  #ctrl .tbtn { min-height: 28px; padding: 0 7px; font-size: 9px; }
}
</style>

<canvas id="stage" aria-label="A pixel-art diorama of three Shiptorio machines in the selected world"></canvas>
<div id="loading">BUILDING WORLD…</div>
<div id="labels"></div>
<nav id="tabs" class="card" aria-label="Worlds"></nav>
<aside id="mood" class="card" aria-live="polite">
  <span class="eyebrow" id="m-eyebrow">MOOD BOARD</span>
  <h1 class="ptitle" id="m-name"></h1>
  <p class="pitch" id="m-pitch"></p>
  <div class="sw" id="m-sw"></div>
  <div class="kw" id="m-kw"></div>
  <span class="eyebrow">THE THREE MACHINES · CLICK TO ZOOM</span>
  <div id="m-comps" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="tbtn" id="hide">HIDE PANEL</button>
</aside>
<button class="tbtn card" id="showMood" hidden>MOOD BOARD</button>
<div id="ctrl" class="card">
  <span class="eyebrow">PIXELS</span>
  <button class="tbtn" data-px="1">1X</button><button class="tbtn" data-px="2">2X</button><button class="tbtn" data-px="3">3X</button><button class="tbtn" data-px="0">SMOOTH</button>
  <span class="eyebrow">VIEW</span>
  <button class="tbtn" id="b-all">ALL THREE</button>
  <button class="tbtn" id="b-cycle" aria-pressed="false">CYCLE STATES</button>
  <button class="tbtn" id="b-labels" aria-pressed="true">LABELS</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// SHIP: the shared diorama engine. Style modules call SHIP.register(style).
// =====================================================================
window.SHIP = (function () {
  'use strict';
  const styles = [];
  const S = { register(s) { styles.push(s); }, styles };

  // ---------- kit handed to every style module ----------
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cache = {};
  function mat(c, o) {
    if (o === undefined && typeof c === 'number' && cache[c]) return cache[c];
    o = o || {};
    const m = new THREE.MeshPhongMaterial({
      color: c, emissive: o.e || 0, emissiveIntensity: o.ei === undefined ? 1 : o.ei,
      flatShading: o.flat !== false, shininess: o.shine || 0, specular: o.spec === undefined ? (o.shine ? 0x333333 : 0) : o.spec,
      transparent: o.op !== undefined, opacity: o.op === undefined ? 1 : o.op, side: o.double ? THREE.DoubleSide : THREE.FrontSide,
      map: o.map || null
    });
    if (o.depthWrite === false) m.depthWrite = false;
    if (arguments.length === 1 && typeof c === 'number') cache[c] = m;
    return m;
  }
  const glow = (c, op, add) => new THREE.MeshBasicMaterial({ color: c, transparent: op !== undefined || !!add, opacity: op === undefined ? 1 : op, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: false });
  function mesh(geo, m, x, y, z, p) {
    const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
    o.position.set(x || 0, y || 0, z || 0);
    const lit = !(o.material.isMeshBasicMaterial);
    o.castShadow = lit && !o.material.transparent; o.receiveShadow = lit;
    if (p) p.add(o); return o;
  }
  const box = (w, h, d, m, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
  const cyl = (a, b, h, m, s, x, y, z, p) => mesh(new THREE.CylinderGeometry(a, b, h, s || 10), m, x, y, z, p);
  const cone = (r, h, m, s, x, y, z, p) => mesh(new THREE.ConeGeometry(r, h, s || 10), m, x, y, z, p);
  const sph = (r, m, x, y, z, p, ws, hs) => mesh(new THREE.SphereGeometry(r, ws || 10, hs || 8), m, x, y, z, p);
  const torus = (r, t, m, rs, ts, x, y, z, p, arc) => mesh(new THREE.TorusGeometry(r, t, rs || 6, ts || 16, arc || Math.PI * 2), m, x, y, z, p);
  const rock = (r, m, x, y, z, p, detail) => mesh(new THREE.DodecahedronGeometry(r, detail || 0), m, x, y, z, p);
  const group = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); if (p) p.add(g); return g; };
  function lathe(points, m, seg, x, y, z, p) {
    const mm = typeof m === 'number' ? mat(m, { double: true }) : m;
    return mesh(new THREE.LatheGeometry(points.map(([r, h]) => new THREE.Vector2(r, h)), seg || 16), mm, x, y, z, p);
  }
  function tube(points, r, m, p, seg, radial) {
    const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
    return mesh(new THREE.TubeGeometry(curve, seg || 24, r, radial || 6, false), m, 0, 0, 0, p);
  }
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(repeat[0], repeat[1]); return t;
  }
  // particles: little cubes (or additive glow cubes) that drift, fall or rise
  const fx = []; const fxGeo = new THREE.BoxGeometry(1, 1, 1);
  function spawn(p, x, y, z, vx, vy, vz, color, life, size, grav, add) {
    if (fx.length > 900) return null;
    const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !add, fog: !add }));
    m.position.set(x, y, z); m.scale.setScalar(size); p.add(m);
    const f = { m, p, vx, vy, vz, life, max: life, grav, size }; fx.push(f); return f;
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life -= dt;
      if (f.life <= 0 || !f.p.parent) { f.p.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); continue; }
      f.vy -= f.grav * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      const k = f.life / f.max; f.m.material.opacity = Math.min(1, k * 1.6);
      if (f.grav < 0) f.m.scale.setScalar(f.size * (1 + (1 - k) * 1.5));
    }
  }
  let lightBudget = 0;
  function light(color, intensity, dist, x, y, z, p) {
    if (lightBudget >= 10) return { intensity: 0, color: new THREE.Color(), position: new THREE.Vector3(), isDummy: true };
    lightBudget++;
    const l = new THREE.PointLight(color, intensity, dist || 8, 2); l.position.set(x || 0, y || 0, z || 0); if (p) p.add(l); return l;
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  function keyframes(frames, p) {
    for (let i = 0; i < frames.length - 1; i++) { const a = frames[i], b = frames[i + 1]; if (p <= b[0]) { const k = smooth((p - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); } }
    return frames[frames.length - 1].slice(1);
  }
  function link(m, ax, ay, bx, by) { m.position.x = (ax + bx) / 2; m.position.y = (ay + by) / 2; m.rotation.z = Math.atan2(by - ay, bx - ax); m.scale.x = Math.hypot(bx - ax, by - ay); }
  const R = () => Math.random() - 0.5;
  const SLOTS = [-8, 0, 8];
  S.kit = { THREE, rnd, R, mat, glow, mesh, box, cyl, cone, sph, torus, rock, group, lathe, tube, canvasTex, spawn, light, lerp, smooth, keyframes, link, SLOTS, v3: new THREE.Vector3() };
  S._fx = { updateFx };
  S._resetLights = () => (lightBudget = 0);
  return S;
})();
</script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const K = SHIP.kit, styles = SHIP.styles;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = $('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;

  // ---------- pixel pass: outline ink, bloom, grade, vignette, scanlines, quantize ----------
  const rt = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const post = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rt.texture }, res: { value: new THREE.Vector2(2, 2) }, smoothMode: { value: 0 },
      levels: { value: 48 }, dither: { value: 0 }, outline: { value: 0.5 }, thresh: { value: 0.1 }, ink: { value: new THREE.Color(0) },
      sat: { value: 1 }, contrast: { value: 1 }, bloom: { value: 0.5 }, bloomThresh: { value: 0.6 }, vignette: { value: 0.3 },
      grade: { value: 0 }, shadowT: { value: new THREE.Color(0x808080) }, highT: { value: new THREE.Color(0x808080) }, scan: { value: 0 }
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform vec2 res; uniform float smoothMode, levels, dither, outline, thresh, sat, contrast, bloom, bloomThresh, vignette, grade, scan;',
      'uniform vec3 ink, shadowT, highT; varying vec2 vUv;',
      'float b2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }',
      'float b4(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a); }',
      'float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }',
      'vec3 tap(vec2 uv){ return texture2D(tDiffuse, uv).rgb; }',
      'void main(){',
      '  vec2 p = floor(vUv * res); vec2 uv = (p + 0.5) / res; vec2 t = 1.0 / res;',
      '  vec3 c = tap(uv); float l = lum(c);',
      '  float n = max(max(lum(tap(uv + vec2(t.x, 0.0))), lum(tap(uv - vec2(t.x, 0.0)))), max(lum(tap(uv + vec2(0.0, t.y))), lum(tap(uv - vec2(0.0, t.y)))));',
      '  vec3 acc = vec3(0.0);',
      '  if (bloom > 0.0) { for (int i = 0; i < 12; i++) { float a = (float(i) + b4(p)) * 0.5236; vec2 d = vec2(cos(a), sin(a));',
      '    vec3 s1 = tap(uv + d * t * 2.0); vec3 s2 = tap(uv + d * t * 4.5); vec3 s3 = tap(uv + d * t * 8.0);',
      '    acc += s1 * max(0.0, lum(s1) - bloomThresh) * 1.2 + s2 * max(0.0, lum(s2) - bloomThresh) * 0.8 + s3 * max(0.0, lum(s3) - bloomThresh) * 0.5; } }',
      '  c = mix(c, ink, outline * step(thresh, n - l) * (1.0 - smoothMode));',
      '  c += acc * bloom * 0.16;',
      '  c = mix(vec3(lum(c)), c, sat); c = (c - 0.5) * contrast + 0.5;',
      '  float L = clamp(lum(c), 0.0, 1.0); vec3 tg = mix(shadowT, highT, smoothstep(0.05, 0.85, L));',
      '  c *= 1.0 + grade * (tg - vec3(lum(tg))) * 1.6;',
      '  vec2 q = vUv - 0.5; c *= 1.0 - vignette * smoothstep(0.3, 0.8, length(q * vec2(1.0, 0.85)));',
      '  c *= 1.0 - scan * step(1.0, mod(p.y, 2.0)) * (1.0 - smoothMode);',
      '  if (smoothMode < 0.5) { float d = (b4(p) - 0.5) * dither; c = floor(c * levels + d + 0.5) / levels; }',
      '  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });
  const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); quad.frustumCulled = false; postScene.add(quad);
  function setFinish(F) {
    const U = post.uniforms;
    for (const k of ['levels', 'dither', 'outline', 'thresh', 'sat', 'contrast', 'bloom', 'bloomThresh', 'vignette', 'grade', 'scan']) if (F[k] !== undefined) U[k].value = F[k];
    U.ink.value.set(F.ink || '#000000'); U.shadowT.value.set(F.shadow || '#808080'); U.highT.value.set(F.high || '#808080');
  }

  // ---------- worlds ----------
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
  const target = new THREE.Vector3(0, 1.6, 0), targetGoal = target.clone();
  let viewH = 14, viewGoal = 14, zoom = 1, W = 2, H = 2, pxSel = 2;
  const worlds = {};
  function gradientTex(top, bottom) {
    return K.canvasTex(2, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); });
  }
  function buildWorld(s) {
    SHIP._resetLights();
    const scene = new THREE.Scene();
    const sky = s.sky || {};
    const bg = gradientTex(sky.top || '#10142a', sky.bottom || '#05060c'); bg.magFilter = bg.minFilter = THREE.LinearFilter; scene.background = bg;
    if (sky.fog) scene.fog = new THREE.Fog(sky.fog, sky.fogNear || 40, sky.fogFar || 90);
    const L = s.light || {};
    const hemi = new THREE.HemisphereLight(L.hemiSky || 0xd6deff, L.hemiGnd || 0x40344a, L.hemiI === undefined ? 0.6 : L.hemiI); scene.add(hemi);
    const sun = new THREE.DirectionalLight(L.sun || 0xfff0d2, L.sunI === undefined ? 0.9 : L.sunI);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 });
    sun.shadow.bias = -0.0008;
    scene.add(sun, sun.target);
    const root = K.group(scene); root.rotation.y = Math.PI / 4;
    const env = s.world(K, root, scene) || { update() {} };
    const comps = s.components.map((c, i) => {
      const holder = K.group(root, K.SLOTS[i], 0, 0); holder.rotation.y = -Math.PI / 4;
      const inst = c.build(K);
      holder.add(inst.g);
      return { def: c, inst, holder, si: Math.min(1, c.states.length - 1) };
    });
    return { s, scene, sun, hemi, root, env, comps, sunDir: new THREE.Vector3().fromArray(L.sunDir || [10, 22, 6]) };
  }

  let cur = null, focus = -1;
  function show(id) {
    const s = styles.find((x) => x.id === id) || styles[0];
    if (!worlds[s.id]) worlds[s.id] = buildWorld(s);
    cur = worlds[s.id];
    document.documentElement.style.setProperty('--accent', s.accent || '#f2a93b');
    setFinish(s.finish || {});
    focus = -1; targetGoal.set(0, 1.6, 0); viewGoal = fitAll();
    renderTabs(); renderMood(); renderLabels();
    try { localStorage.setItem('shiptorio-diorama', s.id); } catch (e) {}
  }
  SHIP.show = show;
  SHIP.focus = (i) => focusOn(i);

  function fitAll() { const a = W / H; return Math.max(12, Math.min(26, 25 / Math.max(a, 0.6))); }
  function focusOn(i) {
    focus = i; const c = cur.comps[i];
    c.holder.getWorldPosition(K.v3); targetGoal.set(K.v3.x, 2.1, K.v3.z); viewGoal = W / H < 1 ? 11 : 8.5;
    renderMood();
  }
  function unfocus() { focus = -1; targetGoal.set(0, 1.6, 0); viewGoal = fitAll(); renderMood(); }

  // ---------- UI ----------
  function renderTabs() {
    const nav = $('tabs'); nav.innerHTML = '';
    styles.forEach((s) => { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = s.name; b.setAttribute('aria-pressed', cur && cur.s === s); b.onclick = () => show(s.id); nav.appendChild(b); });
  }
  function renderMood() {
    const s = cur.s;
    $('m-eyebrow').textContent = 'MOOD BOARD · ' + (s.eyebrow || 'WORLD');
    $('m-name').textContent = s.name; $('m-pitch').textContent = s.pitch;
    const sw = $('m-sw'); sw.innerHTML = ''; (s.palette || []).forEach((h) => { const i = document.createElement('i'); i.style.background = h; sw.appendChild(i); });
    const kw = $('m-kw'); kw.innerHTML = ''; (s.keywords || []).forEach((k) => { const sp = document.createElement('span'); sp.textContent = k; kw.appendChild(sp); });
    const root = $('m-comps'); root.innerHTML = '';
    cur.comps.forEach((c, i) => {
      const el = document.createElement('div'); el.className = 'comp'; el.tabIndex = 0; el.setAttribute('aria-current', focus === i);
      el.innerHTML = '<b></b><p></p><div class="states"></div>';
      el.querySelector('b').textContent = c.def.name; el.querySelector('p').textContent = c.def.blurb;
      const st = el.querySelector('.states');
      c.def.states.forEach((name, j) => { const b = document.createElement('button'); b.className = 'tbtn'; b.textContent = name; b.setAttribute('aria-pressed', j === c.si); b.onclick = (e) => { e.stopPropagation(); c.si = j; renderMood(); }; st.appendChild(b); });

  }

  }

    cur.comps.forEach((c) => {
      if (!showLabels || focus >= 0) { c.label.style.display = 'none'; return; }
      c.holder.getWorldPosition(pv); pv.y = -0.2; pv.x += 1.6; pv.z += 1.6; pv.project(cam);
      c.label.style.display = 'block';
      c.label.style.transform = 'translate(' + Math.round((pv.x + 1) / 2 * W) + 'px,' + Math.round((1 - pv.y) / 2 * H) + 'px) translate(-50%,0)';
    });
  }
  document.querySelectorAll('[data-px]').forEach((b) => b.onclick = () => { pxSel = +b.dataset.px; syncPx(); });

  let cycle = false, cycleT = 0;
  $('b-cycle').onclick = (e) => { cycle = !cycle; e.currentTarget.setAttribute('aria-pressed', cycle); };
  $('b-labels').onclick = (e) => { showLabels = !showLabels; e.currentTarget.setAttribute('aria-pressed', showLabels); };
  $('hide').onclick = () => { $('mood').hidden = true; $('showMood').hidden = false; };
  $('showMood').onclick = () => { $('mood').hidden = false; $('showMood').hidden = true; };
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') unfocus(); });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - drag.x; drag.x = e.clientX; cur.root.rotation.y += dx * 0.004; });
  const end = () => (drag = null); canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(2.5, zoom * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  function resize() { W = window.innerWidth; H = window.innerHeight; renderer.setSize(W, H, false); if (cur && focus < 0) viewGoal = fitAll(); }
  window.addEventListener('resize', resize);

  // ---------- loop ----------
  resize();
  if (window.innerWidth < 820) { showLabels = false; $('b-labels').setAttribute('aria-pressed', 'false'); }
  let start = null; try { start = localStorage.getItem('shiptorio-diorama'); } catch (e) {}
  const qs = new URLSearchParams(location.search).get('style');
  show(qs || start || styles[0].id); syncPx();
  target.copy(targetGoal); viewH = viewGoal;
  $('loading').hidden = true;
  let last = performance.now(), t = 0;
  const yaw = Math.PI / 4, tilt = 30 * Math.PI / 180, D = 60;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; t += dt;
    const w = cur;
    if (cycle) { cycleT += dt; if (cycleT > 3.5) { cycleT = 0; w.comps.forEach((c) => (c.si = (c.si + 1) % c.def.states.length)); renderMood(); } }
    w.env.update && w.env.update(t, dt);
    w.comps.forEach((c) => c.inst.update(t, dt, c.def.states[c.si]));
    SHIP._fx.updateFx(dt);
    const k = 1 - Math.exp(-dt * 5); target.lerp(targetGoal, k); viewH += (viewGoal - viewH) * k;

    post.uniforms.res.value.set(rw, rh); post.uniforms.smoothMode.value = pxSel === 0 ? 1 : 0;
    renderer.setRenderTarget(rt); renderer.render(w.scene, cam);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    placeLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
