name: Stranger E2E
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stranger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  stranger:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      # runner-images configures this signed Ubuntu mirrorlist with Azure first. Its package
      # downloads can stall without failing over; retain the official archive/security entries.
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/scripts/build/configure-apt-sources.sh
      - name: Prefer official Ubuntu mirrors
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          test -f "$mirrors"
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$mirrors"
          sudo sed -Ei '\|^https?://azure[.]archive[.]ubuntu[.]com/ubuntu/([[:space:]].*)?$|d' "$mirrors"
          ! grep -q 'azure.archive.ubuntu.com' "$mirrors"
          cat "$mirrors"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - run: bun x playwright install chromium
      - name: Check browser libraries
        run: |
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();' || bun x playwright install-deps chromium
      - run: bun run stranger
        env:
          STRANGER_OUT: ${{ runner.temp }}/stranger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stranger-evidence
          path: ${{ runner.temp }}/stranger/
          retention-days: 7
