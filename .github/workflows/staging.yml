name: Staging
permissions:
  contents: read
# The dev branch deploys to shiptorio.dev on every push (docs/context/branches.md).
on:
  push:
    branches: [dev]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/context/**"
      - "!docs/playtest/**"
      - "docs/site/**"
  workflow_dispatch:
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Finish the running deploy; only the newest waiting push deploys next.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Install Linux runner verification boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Match CI and Deploy: the runner sandbox tests need user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun test --parallel
      - run: bun run build
      - name: Verify real Durable Object storage on host
        run: bun run test:storage
      - name: Verify existing private fixture resources
        run: bun playtest/staging/preflight.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Update existing private fixture
        run: |
          node server/node_modules/wrangler/wrangler-dist/cli.js d1 migrations apply shiptorio-fixture --remote --config playtest/staging/wrangler.jsonc
          node server/node_modules/wrangler/wrangler-dist/cli.js deploy --config playtest/staging/wrangler.jsonc --var BUILD_SHA:$(git rev-parse HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy isolated staging
        working-directory: server
        run: |
          bunx wrangler d1 migrations apply shiptorio-staging --remote --env staging
          bunx wrangler deploy --env staging --var BUILD_SHA:$(git rev-parse HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl --fail --retry 3 --retry-delay 5 https://shiptorio.dev/api/health
      - name: Verify preview-gated signed fixture service hop
        run: bun playtest/staging/probe.ts
        env:
          SHIPTORIO_TEST_PASSWORD: ${{ secrets.SHIPTORIO_TEST_PASSWORD }}

      - name: Install browser for deployed guest smoke
        run: bun x playwright install --with-deps chromium
      - name: Verify deployed 2D guest entry
        run: node playtest/staging/deck-smoke.mjs
        env:
          SHIPTORIO_TEST_PASSWORD: ${{ secrets.SHIPTORIO_TEST_PASSWORD }}
          SMOKE_OUT: ${{ runner.temp }}/deck-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployed-deck-guest-smoke
          path: ${{ runner.temp }}/deck-smoke/
          retention-days: 7
