name: Staging
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test && bun run build
      - name: Deploy isolated staging
        working-directory: server
        run: |
          bunx wrangler d1 migrations apply shiptorio-staging --remote --env staging
          bunx wrangler deploy --env staging --var BUILD_SHA:$(git rev-parse HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl --fail --retry 3 --retry-delay 5 https://shiptorio.dev/api/health
