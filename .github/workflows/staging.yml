name: Staging
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test && bun run build
      - name: Verify real Durable Object storage on host
        run: bun run test:storage
      - name: Deploy isolated staging
        working-directory: server
        run: |
          bunx wrangler d1 migrations apply shiptorio-staging --remote --env staging
          bunx wrangler deploy --env staging --var BUILD_SHA:$(git rev-parse HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl --fail --retry 3 --retry-delay 5 https://shiptorio.dev/api/health
