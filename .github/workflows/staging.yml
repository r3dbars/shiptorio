name: Staging
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Verify staging
        run: |
          bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 & types=$!
          bun test --parallel=2 > "$RUNNER_TEMP/tests.log" 2>&1 & tests=$!
          bun run build > "$RUNNER_TEMP/build.log" 2>&1 & build=$!
          status=0
          for pid in "$types" "$tests" "$build"; do
            wait "$pid" || status=1
          done
          cat "$RUNNER_TEMP/"{types,tests,build}.log
          exit "$status"
      - name: Deploy isolated staging
        working-directory: server
        run: |
          bunx wrangler d1 migrations apply shiptorio-staging --remote --env staging
          bunx wrangler deploy --env staging --var BUILD_SHA:$(git rev-parse HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl --fail --retry 3 --retry-delay 5 https://shiptorio.dev/api/health
