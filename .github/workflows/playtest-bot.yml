name: Player bot
on:
  workflow_dispatch:
    inputs:
      verify_staging:
        description: Verify the existing private staging fixture before enabling nightly readiness
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
concurrency:
  group: shiptorio-player-bot
  cancel-in-progress: false
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run build
      - run: node playtest/staging/check.mjs
      - run: bun run playtest:bot -- --persona test-newbie --url http://localhost:8809 --out playtest/out/local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bot-local-evidence
          path: playtest/out/
  staging:
    # Turn on only after TEST_FACTORY points at an isolated real Worker + provider stubs.
    if: >-
      (github.event_name == 'schedule' || github.ref == 'refs/heads/dev') &&
      (vars.TEST_USERS_STAGING_READY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.verify_staging))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run playtest:bot -- --persona test-newbie --url https://shiptorio.dev --out playtest/out/staging
        env:
          SHIPTORIO_TEST_PASSWORD: ${{ secrets.SHIPTORIO_TEST_PASSWORD }}
      - name: File each unique staging failure once
        if: failure()
        run: node playtest/bot/report-issues.mjs playtest/out/staging/report.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bot-staging-evidence
          path: playtest/out/
