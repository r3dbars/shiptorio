name: CI
permissions:
  contents: read
  pull-requests: read
# One run per branch/event at a time; a new push cancels the previous run.
# Feature PRs target the integration branch and run fast verification. A frozen,
# owner-authored same-repo release PR or a factory PR runs EVERY suite. Required
# check aggregates all applicable jobs; direct feature-to-main merges fail closed.
# Drafts do nothing; manual diagnostic inputs never produce a release receipt.
# Main is checked by the Deploy run instead.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate Linux visual baselines for review
        type: boolean
        default: false
      browser_grep:
        description: Optional focused browser diagnostic (empty runs every test)
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  policy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.scope.outputs.full }}
      browser: ${{ steps.scope.outputs.browser }}
      load: ${{ steps.scope.outputs.load }}
      admit: ${{ steps.scope.outputs.admit }}
    steps:
      - id: scope
        name: Classify exact-head verification scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          def factory(pr):
              return pr.get('user', {}).get('type') == 'Bot' or pr.get('user', {}).get('login') == 'shiptorio[bot]' or pr.get('head', {}).get('ref', '').startswith('shiptorio/')

          def batch(pr, repo):
              owner = repo.split('/')[0]
              return (pr.get('base', {}).get('ref') == 'main'
                      and pr.get('head', {}).get('repo', {}).get('full_name') == repo
                      and pr.get('head', {}).get('ref', '').startswith('release/')
                      and pr.get('user', {}).get('login') == owner
                      and pr.get('user', {}).get('type') == 'User')

          # Admission regressions: a label, fork, branch name or bot cannot impersonate
          # the owner's release batch. Factory/bot candidates instead keep the FULL suite.
          fixture = {'base': {'ref': 'main'}, 'head': {'ref': 'release/test', 'repo': {'full_name': 'owner/repo'}}, 'user': {'login': 'owner', 'type': 'User'}}
          assert batch(fixture, 'owner/repo')
          for change in [{'user': {'login': 'shiptorio[bot]', 'type': 'Bot'}}, {'user': {'login': 'stranger', 'type': 'User'}}, {'head': {'ref': 'release/test', 'repo': {'full_name': 'stranger/fork'}}}, {'head': {'ref': 'feature/test', 'repo': {'full_name': 'owner/repo'}}}, {'base': {'ref': 'release/test'}}]:
              assert not batch({**fixture, **change}, 'owner/repo')
          assert not batch({**fixture, 'user': {'login': 'stranger', 'type': 'User'}, 'labels': [{'name': 'release-batch'}]}, 'owner/repo')
          assert factory({**fixture, 'user': {'login': 'shiptorio[bot]', 'type': 'Bot'}})
          assert factory({**fixture, 'head': {'ref': 'shiptorio/job'}})

          repo = os.environ['GITHUB_REPOSITORY']
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          manual = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          prs = [event['pull_request']] if not manual else []
          if manual:
              query = urllib.parse.urlencode({'state': 'open', 'head': repo.split('/')[0] + ':' + os.environ['GITHUB_REF_NAME'], 'per_page': 100})
              request = urllib.request.Request(os.environ['GITHUB_API_URL'] + '/repos/' + repo + '/pulls?' + query, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  prs = [pr for pr in json.load(response) if pr.get('head', {}).get('sha') == os.environ['GITHUB_SHA']]
          inputs = event.get('inputs') or {}
          diagnostic = manual and (bool(inputs.get('browser_grep')) or str(inputs.get('update_baselines', 'false')).lower() == 'true')
          protected_main = manual and os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ.get('GITHUB_REF_PROTECTED') == 'true' and os.environ['GITHUB_ACTOR'] == repo.split('/')[0]
          eligible = protected_main or any(batch(pr, repo) or factory(pr) for pr in prs)
          full = eligible and not diagnostic
          targets_main = protected_main or any(pr.get('base', {}).get('ref') == 'main' for pr in prs)
          admit = full or (bool(prs) and not targets_main and not diagnostic)
          reason = ('Full frozen-batch/factory verification' if full else 'Explicit browser diagnostic; not a release receipt' if diagnostic else 'Fast integration-branch verification' if admit else 'Direct feature merges to main are blocked: target the next integration branch, then freeze an owner-authored same-repo release/* PR to main')
          outputs = {'full': full, 'browser': full or diagnostic, 'load': full, 'admit': admit}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in outputs.items():
                  print(key + '=' + str(value).lower(), file=output)
          print(reason)
          if os.environ.get('REQUIRE_FULL') == 'true' and not full:
              raise SystemExit('Stranger release gate refused: ' + reason)
          PY
  verify:
    needs: policy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install Linux runner verification boundary
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
          # GitHub's disposable Ubuntu VM restricts user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Separate Bun processes isolate per-file mocks and overlap I/O-bound tests.
      # Keep the required check name and fail if ANY independent command fails.
      - name: Types, tests, playtest and build
        run: |
          bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 & types=$!
          bun run typecheck:tests > "$RUNNER_TEMP/test-types.log" 2>&1 & test_types=$!
          bun test --parallel=2 > "$RUNNER_TEMP/tests.log" 2>&1 & tests=$!
          bun run playtest --check > "$RUNNER_TEMP/playtest.log" 2>&1 & playtest=$!
          bun run build > "$RUNNER_TEMP/build.log" 2>&1 & build=$!
          status=0
          for pid in "$types" "$test_types" "$tests" "$playtest" "$build"; do
            wait "$pid" || status=1
          done
          cat "$RUNNER_TEMP/"{types,test-types,tests,playtest,build}.log
          exit "$status"
  selfhost:
    needs: policy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-host from a clean clone (no Cloudflare credentials)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/shiptorio-selfhost"
          cd "$RUNNER_TEMP/shiptorio-selfhost"
          bun install --frozen-lockfile
          bun run selfhost --dry-run
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  browser:
    needs: policy
    if: needs.policy.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # Nine serial cases need room to finish and upload failure evidence on slow VMs.
    # Per-test 180s and individual assertion deadlines remain unchanged.
    timeout-minutes: 18
    # Each viewport keeps its serial fixture, without making all three 90s
    # replays and visual checks compete with one job's 12-minute deadline.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone-14, pixel-7]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - run: bun x playwright install chromium
      # Hosted runners normally have Chrome's OS libraries. Avoid minutes of apt
      # work on every manual run; install missing libraries only if launch fails.
      - name: Check browser libraries
        run: |
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();' || bun x playwright install-deps chromium
      - name: Run browser tests
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_GREP: ${{ inputs.browser_grep }}
          UPDATE_BASELINES: ${{ inputs.update_baselines }}
        run: |
          args=("--project=$BROWSER_PROJECT")
          if [ -n "$BROWSER_GREP" ]; then args+=(--grep "$BROWSER_GREP"); fi
          if [ "$UPDATE_BASELINES" = true ]; then args+=(--update-snapshots=all); fi
          bun run test:e2e "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
            tests/e2e/baselines/linux/
          retention-days: 7
  load:
    needs: policy
    if: needs.policy.outputs.load == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-evidence
          path: test-results/load*
          retention-days: 7
  # Keep the protected context red until every applicable suite passes. Skipped
  # browser/load jobs are valid only for feature PRs targeting an integration branch.
  check:
    needs: [policy, verify, selfhost, browser, load]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete exact-head verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          for job in ['policy', 'verify', 'selfhost']:
              if jobs[job]['result'] != 'success':
                  raise SystemExit(job + ' did not pass')
          scope = jobs['policy']['outputs']
          if scope['admit'] != 'true':
              raise SystemExit('Feature/diagnostic heads cannot satisfy the main release gate; target the integration branch')
          if scope['full'] == 'true' and any(scope[job] != 'true' for job in ['browser', 'load']):
              raise SystemExit('Full-suite scope is missing a required suite')
          for job in ['browser', 'load']:
              expected = 'success' if scope[job] == 'true' else 'skipped'
              if jobs[job]['result'] != expected:
                  raise SystemExit(job + ' did not complete its required scope')
          print('All required verification passed for this exact head and target')
          PY
