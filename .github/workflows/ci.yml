name: CI
permissions:
  contents: read
# Actions minutes are metered on this private repo: one run per branch at a time (a new push
# cancels the old run), docs-only changes skip it, drafts skip it (agents run `bun run check` locally while
# they work; CI runs once the PR is marked ready), and main is checked by the Deploy run instead.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate Linux visual baselines for review
        type: boolean
        default: false
      browser_grep:
        description: Optional focused browser diagnostic (empty runs every test)
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # docs/site/*.md is the public docs site (served at /docs), so it builds and deploys like code
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/context/**"
      - "!docs/playtest/**"
      - "docs/site/**"
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - name: Install Linux runner verification boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # GitHub's disposable Ubuntu VM restricts user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun test
      - run: bun run playtest --check
      - run: bun run build
  selfhost:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-host from a clean clone (no Cloudflare credentials)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/shiptorio-selfhost"
          cd "$RUNNER_TEMP/shiptorio-selfhost"
          bun install --frozen-lockfile
          bun run selfhost --dry-run
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Each viewport keeps its serial fixture, without making all three 90s
    # replays and visual checks compete with one job's 12-minute deadline.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone-14, pixel-7]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install chromium
      # Hosted runners normally have Chrome's OS libraries. Avoid minutes of apt
      # work on every manual run; install missing libraries only if launch fails.
      - name: Check browser libraries
        run: |
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();' || bun x playwright install-deps chromium
      - name: Run browser tests
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_GREP: ${{ inputs.browser_grep }}
          UPDATE_BASELINES: ${{ inputs.update_baselines }}
        run: |
          args=("--project=$BROWSER_PROJECT")
          if [ -n "$BROWSER_GREP" ]; then args+=(--grep "$BROWSER_GREP"); fi
          if [ "$UPDATE_BASELINES" = true ]; then args+=(--update-snapshots=all); fi
          bun run test:e2e "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
            tests/e2e/baselines/linux/
          retention-days: 7
  load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-evidence
          path: test-results/load*
          retention-days: 7
