name: CI
permissions:
  contents: read
# One run per branch/event at a time. A new push cancels the previous run, except on
# release/* branches, where an in-flight full run always finishes.
# Two lanes (docs/context/branches.md):
# - PRs into dev (where agents land work): check + selfhost only, so they merge in minutes.
# - PRs into main (dev -> main promotions): also the browser and load suites. When all
#   four pass, the full-suite job posts the release-validation status main requires.
# Drafts skip CI. Main and dev are checked again by their deploy runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.head_ref, 'release/') && !startsWith(github.ref, 'refs/heads/release/') }}
on:
  workflow_dispatch:
    inputs:
      browser_grep:
        description: Optional focused browser diagnostic (empty runs every test)
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Ready for GitHub's merge queue on main.
  merge_group:
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Docs-only change?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/docs-only.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.code == 'true'
      - if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - name: Audit dependency advisories (high and critical)
        if: steps.scope.outputs.code == 'true'
        run: bun audit --audit-level=high
      # Independent steps share the 4-core runner instead of running one after another.
      - name: Typecheck, build and runner verification boundary (in parallel)
        if: steps.scope.outputs.code == 'true'
        run: |
          logs="$RUNNER_TEMP/prep"; mkdir -p "$logs"
          start() { local name=$1; shift; ( "$@" > "$logs/$name.log" 2>&1; echo $? > "$logs/$name.code" ) & }
          start typecheck bun run typecheck
          start typecheck-tests bun run typecheck:tests
          start build bun run build
          # GitHub's disposable Ubuntu VM restricts user namespaces by default.
          start boundary bash -c 'sudo apt-get update -qq && sudo apt-get install -y bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'
          wait
          failed=0
          for name in typecheck typecheck-tests build boundary; do
            echo "::group::$name"; cat "$logs/$name.log"; echo "::endgroup::"
            if [ "$(cat "$logs/$name.code")" != 0 ]; then echo "::error::$name failed"; failed=1; fi
          done
          exit "$failed"
      # Same files and tests, spread over worker processes (each file still runs isolated).
      - if: steps.scope.outputs.code == 'true'
        run: bun test --parallel
      - name: Verify real Durable Object storage on host
        if: steps.scope.outputs.code == 'true'
        run: bun run test:storage
      - if: steps.scope.outputs.code == 'true'
        run: bun run playtest --check
  selfhost:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Self-host from a clean clone (no Cloudflare credentials)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/shiptorio-selfhost"
          cd "$RUNNER_TEMP/shiptorio-selfhost"
          bun install --frozen-lockfile
          bun run selfhost --dry-run
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  browser:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.base_ref != 'dev')
    runs-on: ubuntu-latest
    # Split each viewport's files across two jobs as browser coverage grows.
    # Existing per-test and individual assertion deadlines remain unchanged.
    # Shard 1 of each viewport carries the slow files (buildout, floors, journey) and ran past 18 minutes.
    timeout-minutes: 30
    # Playwright keeps each file's serial fixture intact within its shard.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone-14, pixel-7]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install chromium
      # Hosted runners normally have Chrome's OS libraries. Avoid minutes of apt
      # work on every run; install missing libraries only if launch fails.
      - name: Check browser libraries
        run: |
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();' || bun x playwright install-deps chromium
      - name: Run browser tests
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_GREP: ${{ inputs.browser_grep }}
        run: |
          args=("--project=$BROWSER_PROJECT" "--shard=$BROWSER_SHARD/2")
          if [ -n "$BROWSER_GREP" ]; then args+=(--grep "$BROWSER_GREP"); fi
          bun run test:e2e "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  load:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.base_ref != 'dev')
    runs-on: ubuntu-latest
    # Up to three load runs (see tests/load/repeat.ts).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run test:load:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: load-evidence
          path: test-results/load*
          retention-days: 7
  # Never name this job release-validation: a skipped job counts as a passing check,
  # so the status is posted explicitly, only after every suite passed on this head.
  full-suite:
    needs: [check, selfhost, browser, load]
    if: >-
      always() && needs.check.result == 'success' && needs.selfhost.result == 'success' &&
      needs.browser.result == 'success' && needs.load.result == 'success' &&
      inputs.browser_grep == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Post release-validation
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=release-validation -f target_url="$RUN_URL" \
            -f description="CI passed check, selfhost, all browser shards and load on this head."
