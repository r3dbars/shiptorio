name: CI
permissions:
  contents: read
# Actions minutes are metered on this private repo: one run per branch at a time (a new push
# cancels the old run), docs-only changes skip it, drafts skip it (agents run `bun run check` locally while
# they work; CI runs once the PR is marked ready), and main is checked by the Deploy run instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/context/**"
      - "docs/playtest/**"
jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Install Linux runner verification boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # GitHub's disposable Ubuntu VM restricts user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun test
      - run: bun run build
