name: CI
permissions:
  contents: read
# Actions minutes are metered on this private repo: one run per branch at a time (a new push
# cancels the old run), docs-only changes skip it, and main is checked by the Deploy run instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/context/**"
      - "docs/playtest/**"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
