name: Deploy
permissions:
  contents: read
on:
  push:
    branches: [main]
    # docs/*.html art pages are served at /art, so only markdown and notes skip the deploy
    # docs/site/*.md is the public docs site (served at /docs), so it builds and deploys like code
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/context/**"
      - "!docs/playtest/**"
      - "docs/site/**"
  workflow_dispatch:
jobs:
  deploy:
    # Off until the repo variable DEPLOY_ENABLED is set to "true" (see docs/SETUP.md).
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # one deploy at a time: the running one finishes, and only the newest waiting merge runs next (GitHub drops
    # older pending runs). Cancelling in-flight runs starved prod when merges landed faster than a deploy takes.
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Live smoke: the new commit is what shiptorio.com serves, the landing page is public, and the app gate still holds.
      - name: Live smoke
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS https://shiptorio.com/api/version | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            echo "live commit '$live', waiting for $GITHUB_SHA"; sleep 5
          done
          [ "$live" = "$GITHUB_SHA" ] || { echo "::error::shiptorio.com is not serving $GITHUB_SHA"; exit 1; }
          landing=$(curl -s -o /dev/null -w '%{http_code}' https://shiptorio.com/)
          [ "$landing" = "200" ] || { echo "::error::landing page returned $landing, expected 200"; exit 1; }
          # Password mode currently serves 401 on the actual factory deep link. Future waitlist mode
          # may serve login HTML with 200; the private repo API must still reject guests with 401.
          gate=$(curl -s -o /dev/null -w '%{http_code}' 'https://shiptorio.com/?source=live&repo=r3dbars%2Fshiptorio')
          [ "$gate" = "401" ] || { echo "::error::factory password gate returned $gate, expected 401"; exit 1; }
          private_api=$(curl -s -o /dev/null -w '%{http_code}' https://shiptorio.com/api/repos)
          [ "$private_api" = "401" ] || { echo "::error::private repo API returned $private_api, expected 401"; exit 1; }
          http=$(curl -s -o /dev/null -w '%{http_code}' http://shiptorio.com/)
          [ "$http" = "308" ] || [ "$http" = "301" ] || { echo "::error::http:// returned $http, expected a redirect to https"; exit 1; }
          echo "Live: $live, landing 200, factory gate 401, private API 401, http $http"
