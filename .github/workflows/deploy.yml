name: Deploy
permissions:
  contents: read
on:
  push:
    branches: [main]
    # docs/*.html art pages are served at /art, so only markdown and notes skip the deploy
    paths-ignore:
      - "**/*.md"
      - "docs/context/**"
      - "docs/playtest/**"
  workflow_dispatch:
jobs:
  deploy:
    # Off until the repo variable DEPLOY_ENABLED is set to "true" (see docs/SETUP.md).
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # a newer merge cancels an in-flight deploy; the newest main is what ships
    concurrency:
      group: deploy
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Live smoke: the new commit is what shiptorio.com serves, and the password gate still holds.
      - name: Live smoke
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS https://shiptorio.com/api/version | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            echo "live commit '$live', waiting for $GITHUB_SHA"; sleep 5
          done
          [ "$live" = "$GITHUB_SHA" ] || { echo "::error::shiptorio.com is not serving $GITHUB_SHA"; exit 1; }
          gate=$(curl -s -o /dev/null -w '%{http_code}' https://shiptorio.com/)
          [ "$gate" = "401" ] || { echo "::error::password gate returned $gate, expected 401"; exit 1; }
          http=$(curl -s -o /dev/null -w '%{http_code}' http://shiptorio.com/)
          [ "$http" = "308" ] || [ "$http" = "301" ] || { echo "::error::http:// returned $http, expected a redirect to https"; exit 1; }
          echo "Live: $live, gate 401, http $http"
