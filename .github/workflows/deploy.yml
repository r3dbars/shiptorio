name: Deploy
permissions:
  contents: read
on:
  push:
    branches: [main]
    # docs/*.html art pages are served at /art, so only markdown and notes skip the deploy
    # docs/site/*.md is the public docs site (served at /docs), so it builds and deploys like code
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/context/**"
      - "!docs/playtest/**"
      - "docs/site/**"
  workflow_dispatch:
jobs:
  deploy:
    # Off until the repo variable DEPLOY_ENABLED is set to "true" (see docs/SETUP.md).
    # Manual branch deploys support the rollback drill; never deploy pull_request events.
    if: vars.DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # one deploy at a time: the running one finishes, and only the newest waiting merge runs next (GitHub drops
    # older pending runs). Cancelling in-flight runs starved prod when merges landed faster than a deploy takes.
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Install Linux runner verification boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Match CI: run real runner isolation fixtures before any Cloudflare mutation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun test
      # Install before mutation: setup failure must never leave a broken deployment live.
      - name: Install smoke Chromium
        timeout-minutes: 2
        run: bun x playwright install --with-deps --no-shell chromium
      # Capture the active version BEFORE mutation, not whichever version is second later.
      # Refuse split traffic: rollback restores exactly one known 100% version.
      - name: Capture rollback target
        id: previous
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun x wrangler deployments list --name shiptorio --json > "$RUNNER_TEMP/deployments.json"
          previous=$(jq -er 'sort_by(.created_on) | last | .versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id | select(test("^[0-9a-f-]{36}$"))' "$RUNNER_TEMP/deployments.json")
          echo "version=$previous" >> "$GITHUB_OUTPUT"
          commit=$(curl --fail --silent --show-error --max-time 15 https://shiptorio.com/api/version | jq -er '.commit | select(test("^[0-9a-f]{40}$"))')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $previous ($commit)"
      - name: Deploy
        id: deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Live smoke
        id: live_smoke
        run: bun scripts/smoke/live.ts https://shiptorio.com "$GITHUB_SHA"
      - name: Browser smoke
        id: smoke
        run: node scripts/smoke/browser.mjs https://shiptorio.com "$RUNNER_TEMP/browser-smoke/deploy"
      - name: Roll back failed deployment
        if: ${{ always() && steps.previous.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.live_smoke.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        run: |
          echo "::error::Deployment $GITHUB_SHA failed. Rolling shiptorio back to $PREVIOUS_VERSION ($PREVIOUS_COMMIT)."
          echo "## DEPLOY FAILED — automatic rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "Rejected $GITHUB_SHA; restoring $PREVIOUS_VERSION ($PREVIOUS_COMMIT)." >> "$GITHUB_STEP_SUMMARY"
          if ! (cd server && bun x wrangler rollback "$PREVIOUS_VERSION" --name shiptorio --yes --message "Live smoke failed: $GITHUB_SHA"); then
            echo "::error::ROLLBACK FAILED. shiptorio.com needs immediate manual recovery."
            echo "ROLLBACK FAILED: manual recovery required." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Verify Cloudflare actually activated the saved version, then check the restored site.
          (cd server && bun x wrangler deployments list --name shiptorio --json) > "$RUNNER_TEMP/restored.json"
          jq -e --arg version "$PREVIOUS_VERSION" 'sort_by(.created_on) | last | .versions | length == 1 and .[0].version_id == $version and .[0].percentage == 100' "$RUNNER_TEMP/restored.json"
          bun scripts/smoke/live.ts https://shiptorio.com "$PREVIOUS_COMMIT"
          node scripts/smoke/browser.mjs https://shiptorio.com "$RUNNER_TEMP/browser-smoke/restored"
          echo "Rollback verified; the deployment job remains FAILED." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Rollback verified. Rejected deployment $GITHUB_SHA; fix the branch before redeploying."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-browser-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-smoke/
          retention-days: 7
          if-no-files-found: warn
