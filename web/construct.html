<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Construct (dev)</title>
    <!-- dev only (build as you go, slice 3): replay construct.ts on any piece of the shaft.
         ?id=asm-1  the piece   ?reduced=1  reduced motion   ?speed=2   ?auto=1 replay forever   ?bake=1 build on a baked group
         ?raf=0  no frame loop (the screenshot tool drives window.CONSTRUCT)   plus the shaft harness's ?asm= ?checks= ?only= -->
    <style>
@font-face { font-family: 'Silkscreen'; font-weight: 400; src: url('/fonts/silkscreen-400.woff2') format('woff2'); }
:root { --bg: #0b0806; --panel: rgba(14, 10, 8, 0.92); --line: #5a4434; --ink: #f4ead8; --dim: #b8a48a; --amber: #ffb020; --focus: #6fb2ff; --pixel: 'Silkscreen', 'Courier New', monospace; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font: 12px/1.4 ui-monospace, Menlo, monospace; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel); border: 2px solid var(--line); outline: 2px solid #000; padding: 8px; }
[hidden] { display: none !important; }
#pieces { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 100%; }
button { font: 400 10px/1 var(--pixel); letter-spacing: 0.06em; color: var(--ink); background: rgba(20, 14, 10, 0.94); border: 2px solid var(--line); min-height: 30px; padding: 0 9px; cursor: pointer; white-space: nowrap; }
button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #120c02; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#go { background: #7a2a1a; border-color: #c84a2a; }
#prog { flex: 1 1 120px; height: 8px; background: #2a1e16; border: 2px solid var(--line); position: relative; }
#prog i { position: absolute; inset: 0; width: 0; background: var(--amber); }
#info { font: 400 10px/1.2 var(--pixel); color: var(--dim); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 400 12px var(--pixel); color: var(--dim); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="loading">LOADING THE SHAFT...</div>
    <div id="bar" hidden>
      <div id="pieces" role="group" aria-label="Piece"></div>
      <button id="go" type="button">BUILD IT</button>
      <button id="hurry" type="button">HURRY</button>
      <button id="reduced" type="button" aria-pressed="false">REDUCED MOTION</button>
      <div id="prog" aria-hidden="true"><i></i></div>
      <span id="info"></span>
    </div>
    <script type="module">
import * as THREE from "three";
import { createIron } from "/src/map/shaft/core.js";
import { defaultPlan, makeLayout } from "/src/map/shaft/layout.js";
import { bakeShaft } from "/src/map/shaft/bake.ts";
import { ShaftStage } from "/src/map/shaft/stage.ts";
import { construct } from "/src/map/shaft/construct.ts";

const MODULES = {
  assembler: () => import("/src/map/shaft/modules/assembler.js"),
  belts: () => import("/src/map/shaft/modules/belts.js"),
  gauntlet: () => import("/src/map/shaft/modules/gauntlet.js"),
  launch: () => import("/src/map/shaft/modules/launch.js"),
  mine: () => import("/src/map/shaft/modules/mine.js"),
  planner: () => import("/src/map/shaft/modules/planner.js"),
  power: () => import("/src/map/shaft/modules/power.js"),
  world: () => import("/src/map/shaft/modules/world.js"),
};

THREE.ColorManagement.enabled = false;
const q = new URLSearchParams(location.search);
const reducedQ = q.get("reduced");
let reduced = reducedQ !== null ? reducedQ === "1" : matchMedia("(prefers-reduced-motion: reduce)").matches;

function plan() {
  const p = defaultPlan();
  const asm = Number(q.get("asm"));
  if (q.has("asm") && asm >= 1 && asm <= 3) {
    const hs = ["claude_code", "codex", "claude_code"];
    p.assemblers = Array.from({ length: asm }, (_, i) => ({ id: `asm-${i + 1}`, harness: hs[i] }));
    p.power = (p.power ?? []).filter((x) => x.type !== "dynamo" && x.type !== "battery");
    p.assemblers.forEach((a, i) => {
      p.power.push({ id: `dyn-${i + 1}`, type: "dynamo", feeds: [a.id], harness: a.harness });
      if (i === 0) p.power.push({ id: `bat-${i + 1}`, type: "battery", feeds: [a.id] });
    });
  }
  const checks = q.get("checks");
  if (checks !== null) p.checks = checks.split(",").filter(Boolean).map((c) => { const [kind, check] = c.split(":"); return { id: check ? `chk-${check}` : kind, kind, check }; });
  return p;
}

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;

const I = createIron();
const only = q.get("only")?.split(",").filter(Boolean);
for (const [name, load] of Object.entries(MODULES)) {
  if (only && !only.includes(name)) continue;
  try { (await load()).default?.(I); } catch (e) { console.error(`[CONSTRUCT] module ${name} failed:`, e); }
}
const layout = makeLayout(plan());
const stage = new ShaftStage(I, layout);
I.build(stage.scene, stage.root, layout, {});
stage.applyLook();
if (q.get("bake") === "1") bakeShaft(I, stage.root);

// every piece the first run can build: machines and power plants
const ids = I.stationList.map((s) => s.id);
let id = ids.includes(q.get("id")) ? q.get("id") : ids.includes("asm-1") ? "asm-1" : ids[0];
let run = null, t = I._t ?? 0;
const speed = Number(q.get("speed") ?? 1) || 1;

function view() {
  stage.setView("station", id);
  stage.snap();
}
function build() {
  run?.finish();
  const st = I.stations[id];
  run = construct(st.holder, { reduced, speed });
  const info = document.getElementById("info");
  if (info) info.textContent = `${id.toUpperCase()} · ${run.pieces ?? "?"} PARTS${reduced ? " · FADE" : ""}`;
  run.done.then(() => { if (q.get("auto") === "1") setTimeout(build, 900); });
  return run;
}
function step(dt) {
  t += dt;
  I.step(t, dt);
  run?.update(dt);
  stage.camStep(dt);
}
function render() {
  stage.render(renderer);
  const bar = document.querySelector("#prog i");
  if (bar) bar.style.width = `${Math.round((run?.progress ?? 0) * 100)}%`;
}

// ---------- controls ----------
const piecesEl = document.getElementById("pieces");
for (const sid of ids) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = sid.toUpperCase();
  b.setAttribute("aria-pressed", String(sid === id));
  b.onclick = () => {
    id = sid;
    piecesEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    view();
    build();
  };
  piecesEl.appendChild(b);
}
document.getElementById("go").onclick = () => build();
document.getElementById("hurry").onclick = () => run && (run.speed = 4);
const rb = document.getElementById("reduced");
rb.setAttribute("aria-pressed", String(reduced));
rb.onclick = () => { reduced = !reduced; rb.setAttribute("aria-pressed", String(reduced)); build(); };
if (q.get("ui") === "0") document.getElementById("bar").remove();
else document.getElementById("bar").hidden = false;

const resize = () => { renderer.setSize(innerWidth, innerHeight, false); stage.setSize(innerWidth, innerHeight); };
addEventListener("resize", resize);
resize();
view();

// for the screenshot tool and the console: build(id?), advance(sec), render()
window.CONSTRUCT = {
  I, stage, renderer, ids,
  build(sid, o = {}) { if (sid) (id = sid), view(); if (o.reduced !== undefined) reduced = o.reduced; return build(); },
  advance(sec, dt = 1 / 30) { for (let s = 0; s < sec - 1e-6; s += dt) step(Math.min(dt, sec - s)); },
  get run() { return run; },
  render,
  ready: true,
};
document.getElementById("loading").hidden = true;

if (q.get("raf") !== "0") {
  // let the line warm up for a moment, then build
  CONSTRUCT.advance(1.5);
  build();
  let last = performance.now();
  const frame = (now) => {
    step(Math.max(0, Math.min(0.05, (now - last) / 1000)));
    last = now;
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
} else render();
    </script>
  </body>
</html>
