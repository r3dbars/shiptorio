<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2a1410" />
    <title>Shiptorio deck</title>
    <!-- The 2D facelift (thread "Plan the 2D pixel-art facelift"): one floating deck, one line left to right,
         drawn on a canvas from Justin's ChatGPT sprites in /deck/art. Self-contained like /story-b, no game code yet. -->
    <link rel="preload" href="/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/deck/deck.css" />
  </head>
  <body>
    <canvas id="world" aria-label="Your factory: a floating deck with one line from the repo to the rocket"></canvas>
    <button id="zoom" class="zoom" type="button" aria-label="See the whole factory">See all</button>
    <div id="card" class="card" hidden>
      <h1 id="card-title">Approve fix for checkout bug?</h1>
      <ol class="dots" id="dots" aria-label="Approvals toward automatic"><li></li><li></li><li></li></ol>
      <p id="card-sub">Approve 2 more like this and it's automatic.</p>
      <div class="btns">
        <button id="later" class="btn" type="button">&larr; Later</button>
        <button id="approve" class="btn go" type="button">Approve &rarr;</button>
      </div>
    </div>
    <p id="toast" class="toast" aria-live="polite"></p>
    <script src="/deck/deck.js"></script>
  </body>
</html>
