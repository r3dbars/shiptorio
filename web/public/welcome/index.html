<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shiptorio</title>
<meta name="description" content="A little play. A lot shipped. Shiptorio turns your codebase into a factory game where every rocket is a real merged pull request.">
<link rel="canonical" href="https://shiptorio.com/">
<meta name="theme-color" content="#0b0806">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shiptorio.com/">
<meta property="og:title" content="Shiptorio">
<meta property="og:description" content="A little play. A lot shipped.">
<meta property="og:image" content="https://shiptorio.com/brand/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shiptorio.com/brand/og.png">
<link rel="icon" href="/brand/favicon.svg?v=foundry-s3" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png?v=foundry-s3" sizes="32x32" type="image/png">
<link rel="icon" href="/brand/favicon-16.png?v=foundry-s3" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=foundry-s3">
<link rel="manifest" href="/brand/manifest.webmanifest">
<link rel="preload" href="/fonts/silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="/welcome/hero.webp" imagesrcset="/welcome/hero-1024.webp 1024w, /welcome/hero.webp 1600w" imagesizes="100vw" media="(min-width: 760px)" fetchpriority="high">
<link rel="preload" as="image" href="/welcome/hero-phone.webp" media="(max-width: 759px)" fetchpriority="high">
<link rel="stylesheet" href="/brand/foundry.css">
<style>
/* Black Iron (docs/art/IRON-STYLE.md), tokens inlined from web/src/iron.css. The page is the title, one line, the art. */
@font-face{font-family:"Silkscreen";font-weight:700;font-display:swap;src:url(/fonts/silkscreen-700.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400 700;font-display:swap;src:url(/fonts/jetbrains-mono.woff2) format("woff2")}
:root{
  --bg:#0b0806;--soot:#1e1814;--line:#5a4434;--line-hi:#8a6a4c;--ink:#f4ead8;--dim:#b8a48a;
  --amber:#ffb020;--amber-hi:#ffc24a;--on-amber:#140c02;--ok:#46e07a;--focus:#6fb2ff;--aether:#7af0d8;
  --pixel:var(--foundry-label);--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;color:var(--ink);font:400 16px/1.5 var(--mono);background:var(--bg)}
a{color:var(--aether);text-underline-offset:3px}
a:hover{color:#a8fff0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100svh;overflow:hidden}
/* the art: the real Black Iron line, full bleed */
.art{position:absolute;inset:0;z-index:0}
.art img,.art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;image-rendering:pixelated;display:block}
.art video{opacity:0;transition:opacity .4s}
.art video.on{opacity:1}
/* soot falls over the top and bottom so the words sit on dark */
.art::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(11,8,6,.94) 0,rgba(11,8,6,.78) 22%,rgba(11,8,6,0) 46%,rgba(11,8,6,0) 72%,rgba(11,8,6,.9) 100%)}

.top{position:relative;z-index:1;text-align:center;padding:clamp(40px,9vh,96px) 16px 0}
h1{margin:0;line-height:0}
h1 img{width:min(900px,88vw);height:auto;image-rendering:auto;filter:drop-shadow(0 6px 12px #000)}
.say{margin:18px 0 0;font:400 clamp(16px,1.6vw,20px)/1.4 var(--mono);color:var(--ink);text-shadow:0 2px 0 #000,0 0 12px #000}

.walkthrough{display:inline-flex;align-items:center;justify-content:center;min-height:48px;max-width:100%;margin-top:20px;padding:12px 16px;border:2px solid var(--amber);background:rgba(14,10,8,.92);color:var(--amber);font:700 11px/1.5 var(--pixel);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.walkthrough:hover{background:var(--amber);color:var(--on-amber)}
.walkthrough-note{margin:8px 0 0;color:var(--dim);font-size:12px;text-shadow:0 1px 0 #000}

.bottom{position:relative;z-index:1;margin-top:auto;width:100%;max-width:520px;padding:0 16px max(20px,env(safe-area-inset-bottom));text-align:center}
form{display:flex;gap:8px}
input[type=email]{flex:1 1 auto;min-width:0;min-height:48px;padding:0 14px;border:2px solid var(--line);border-radius:0;background:rgba(30,24,20,.92);color:var(--ink);font:400 16px var(--mono);caret-color:var(--amber);box-shadow:inset 0 3px 0 rgba(0,0,0,.5)}
input[type=email]:hover{border-color:var(--line-hi)}
input::placeholder{color:#9a8872}
button.go{flex:none;min-height:48px;padding:0 18px;border:2px solid #000;border-radius:0;background:var(--amber);color:var(--on-amber);font:700 12px/1 var(--pixel);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.25)}
button.go:hover{background:var(--amber-hi)}
button.go:active{transform:translateY(1px);box-shadow:none}
button.go[disabled]{opacity:.65;cursor:progress}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{min-height:1.5em;margin:8px 0 0;font-size:14px;color:var(--dim);text-shadow:0 1px 0 #000}
.note.ok{color:var(--ok)}.note.err{color:#ff8a78}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 0;font:700 10px/1.4 var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.foot a{color:var(--ink)}
.foot a:hover{color:var(--amber-hi)}

/* pause for the loop (WCAG 2.2.2): small, out of the way */
#toggle{position:absolute;z-index:2;right:max(12px,env(safe-area-inset-right));top:12px;width:36px;height:36px;padding:0;border:2px solid var(--line);border-radius:0;background:rgba(14,10,8,.8);color:var(--dim);cursor:pointer;display:grid;place-items:center}
#toggle:hover{color:var(--ink);border-color:var(--line-hi)}
#toggle svg{width:12px;height:12px;fill:currentColor}

/* phones: words on top, the art fills the middle, the form under it */
@media (max-width:759px){
  .art{position:relative;inset:auto;order:2;width:100%;flex:1 1 auto;min-height:300px;margin:20px 0 16px}
  .art img,.art video{object-position:50% 50%}
  .art::after{background:linear-gradient(180deg,var(--bg) 0,rgba(11,8,6,0) 14%,rgba(11,8,6,0) 82%,var(--bg) 100%)}
  .top{order:1;padding-top:max(36px,env(safe-area-inset-top))}
  .bottom{order:3;margin-top:auto}
  form{flex-direction:column}
  .say span{display:block}
  #toggle{top:auto;bottom:10px}
}
@media (prefers-reduced-motion:reduce){.art video{transition:none}}
.say{font:400 clamp(20px,2.3vw,29px)/1.4 Georgia,serif;letter-spacing:.045em}.walkthrough,button.go{font-size:14px;border-radius:3px}.top{padding-top:clamp(36px,6vh,64px)}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1><img src="/brand/wordmark.svg?v=foundry-o2" width="1085" height="240" alt="Shiptorio"></h1>
    <p class="say foundry-tagline">A little play. A lot shipped.</p>
    <a class="walkthrough" href="/judge" aria-describedby="walkthrough-note">Try the 90-second walkthrough</a>
    <p class="walkthrough-note" id="walkthrough-note">No sign-in required · simulated factory</p>
  </div>

  <div class="art">
    <picture>
      <source media="(max-width: 759px)" srcset="/welcome/hero-phone.webp" width="600" height="800">
      <img src="/welcome/hero.webp" srcset="/welcome/hero-1024.webp 1024w, /welcome/hero.webp 1600w" sizes="100vw" width="1600" height="900" alt="The Shiptorio factory in pixel art: a clockwork assembler, an aether review dome and a rocket on its launch pad, on an iron deck under smokestacks" fetchpriority="high">
    </picture>
    <video id="loop" muted loop playsinline preload="none" aria-hidden="true"></video>
    <button type="button" id="toggle" hidden aria-label="Pause the factory"></button>
  </div>

  <div class="bottom">
    <form id="join" action="/api/waitlist" method="post" novalidate>
      <label class="sr" for="email">Email address</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@yourstartup.com" maxlength="254" required>
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <button class="go" type="submit">Get an invite</button>
    </form>
    <p class="note" id="note" role="status" aria-live="polite"></p>
    <p class="foot"><a href="/access?next=%2F">Sign in</a><span>powered by Meta Muse Spark</span></p>
  </div>
</main>
<script src="/welcome/landing.js" defer></script>
</body>
</html>
