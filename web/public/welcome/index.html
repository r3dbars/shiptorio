<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shiptorio</title>
<meta name="description" content="Build the factory, ship the code. Shiptorio turns your codebase into a factory game where every rocket is a real merged pull request.">
<link rel="canonical" href="https://shiptorio.com/">
<meta name="theme-color" content="#0b0806">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shiptorio.com/">
<meta property="og:title" content="Shiptorio">
<meta property="og:description" content="Build the factory, ship the code.">
<meta property="og:image" content="https://shiptorio.com/brand/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shiptorio.com/brand/og.png">
<link rel="icon" href="/brand/favicon.svg?v=foundry-s3" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png?v=foundry-s3" sizes="32x32" type="image/png">
<link rel="icon" href="/brand/favicon-16.png?v=foundry-s3" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=foundry-s3">
<link rel="manifest" href="/brand/manifest.webmanifest">
<link rel="preload" href="/fonts/silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="/welcome/factory-poster.webp" imagesrcset="/welcome/factory-poster-1024.webp 1024w, /welcome/factory-poster.webp 1600w" imagesizes="100vw" media="(min-width: 760px)" fetchpriority="high">
<link rel="preload" as="image" href="/welcome/factory-phone-poster.webp" media="(max-width: 759px)" fetchpriority="high">
<link rel="stylesheet" href="/brand/foundry.css">
<style>
/* Black Iron (docs/art/IRON-STYLE.md), tokens inlined from web/src/iron.css. The page is the title, one line, the art. */
@font-face{font-family:"Silkscreen";font-weight:700;font-display:swap;src:url(/fonts/silkscreen-700.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400 700;font-display:swap;src:url(/fonts/jetbrains-mono.woff2) format("woff2")}
:root{
  --bg:#0b0806;--soot:#1e1814;--line:#5a4434;--line-hi:#8a6a4c;--ink:#f4ead8;--dim:#b8a48a;
  --amber:#ffb020;--amber-hi:#ffc24a;--on-amber:#140c02;--ok:#46e07a;--focus:#6fb2ff;--aether:#7af0d8;
  --pixel:var(--foundry-label);--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;color:var(--ink);font:400 16px/1.5 var(--mono);background:var(--bg)}
a{color:var(--aether);text-underline-offset:3px}
a:hover{color:#a8fff0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;overflow:hidden;padding:32px 0}
/* the art: the real Black Iron line, full bleed */
.art{position:absolute;inset:0;z-index:0;pointer-events:none}
.art img,.art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;image-rendering:pixelated;display:block}
.art video{opacity:0;transition:opacity .4s}
.art video.on{opacity:1}
/* soot falls over the top and bottom so the words sit on dark */
.art::after{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 46%,rgba(11,8,6,.76) 0,rgba(11,8,6,.5) 42%,rgba(11,8,6,.13) 78%),linear-gradient(180deg,rgba(11,8,6,.35),rgba(11,8,6,.05) 65%,rgba(11,8,6,.4))}

.top{position:relative;z-index:1;text-align:center;padding:0 16px}
h1{margin:0;line-height:0}
h1 img{width:min(900px,88vw);height:auto;image-rendering:auto;filter:drop-shadow(0 6px 12px #000)}
.say.foundry-tagline{margin:clamp(-48px,-4.7vw,-18px) 0 0;font:500 clamp(14px,2.2vw,25px)/1.25 var(--foundry-title);letter-spacing:.16em;text-transform:uppercase;color:var(--foundry-cream);background:linear-gradient(#fff0cb,#c28b43);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 2px 10px #000}

.bottom{position:relative;z-index:1;margin-top:28px;width:100%;max-width:520px;padding:0 16px max(20px,env(safe-area-inset-bottom));text-align:center}
form{display:flex;flex-direction:column;gap:12px}
input[type=email]{width:100%;min-width:0;min-height:50px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#191511;color:var(--ink);font:400 16px system-ui,sans-serif;caret-color:var(--amber)}
input[type=email]:hover{border-color:var(--line-hi)}
input::placeholder{color:#9a8872}
button.go{position:relative;flex:none;min-height:54px;padding:3px 36px 0;border:2px solid #8c511f;border-radius:9px;background:repeating-linear-gradient(0deg,#fff7db0a 0 1px,transparent 1px 3px),linear-gradient(180deg,#fff2bd 0%,#f8e3a3 22%,#edcd80 63%,#d7a456 100%);color:#4a2b12;font:600 23px/1 var(--foundry-title);letter-spacing:.075em;text-transform:uppercase;text-shadow:0 1px 0 #fff5cd,0 -1px 0 #a5763980;cursor:pointer;box-shadow:inset 0 0 0 1px #fff4cb,inset 0 0 0 3px #a97032,inset 0 0 0 4px #ffe9ac,0 1px 0 1px #f0c675,0 4px 0 1px #794018,0 6px 0 1px #2b1509,0 10px 24px #0009;transition:filter .15s,transform .15s,box-shadow .15s}
button.go:hover{filter:brightness(1.07)}
button.go:active{transform:translateY(3px);box-shadow:inset 0 0 0 1px #fff4cb,inset 0 0 0 3px #a97032,inset 0 0 0 4px #ffe9ac,0 1px 0 1px #794018,0 3px 0 1px #2b1509,0 5px 14px #0008}
#open-signup{padding-inline:46px}
#open-signup::before,#open-signup::after{content:"";position:absolute;top:50%;width:7px;height:7px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff5d1 0 12%,#eac679 24%,#a36b2a 49%,#4e280f 77%);box-shadow:0 1px 1px #4c270e,inset 0 1px 0 #fff2bd}
#open-signup::before{left:18px}#open-signup::after{right:18px}
button.go[disabled]{opacity:.65;cursor:progress}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{min-height:1.5em;margin:8px 0 0;font-size:14px;color:var(--dim);text-shadow:0 1px 0 #000}
.note.ok{color:var(--ok)}.note.err{color:#ff8a78}
.factory-entry{position:absolute;z-index:2;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:400 11px/1.4 var(--foundry-label);letter-spacing:.08em;color:#a7957a;text-decoration:none;text-shadow:0 1px 5px #000;white-space:nowrap;padding:8px 12px;opacity:.6;transition:opacity .15s,color .15s}
.factory-entry:hover,.factory-entry:focus-visible{color:#fff0cb;opacity:1}
.signup-dialog{width:min(420px,calc(100vw - 32px));padding:24px;border:1px solid #624c32;border-radius:22px;background:#100e0b;color:var(--ink);box-shadow:0 24px 90px #000a;font-family:system-ui,sans-serif}
.signup-dialog::backdrop{background:#0009;backdrop-filter:blur(6px)}
.signup-dialog h2{margin:0 24px 24px 0;font-size:24px;font-weight:600;letter-spacing:-.03em}
.signup-dialog label{font-size:14px;color:var(--dim)}
.signup-dialog .go{margin-top:4px}
.signup-dialog .note{margin-bottom:0;font-size:13px;line-height:1.5}
.signup-dialog .note:empty{display:none}

/* pause for the loop (WCAG 2.2.2): small, out of the way */
.media-controls{position:absolute;z-index:2;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center}
#toggle,#sound-toggle{width:30px;height:30px;padding:0;border:1px solid #b88c4d66;border-radius:50%;background:rgba(14,10,8,.6);color:var(--foundry-cream);cursor:pointer;display:grid;place-items:center}
#toggle:hover{color:var(--ink);border-color:var(--line-hi)}
#toggle svg{width:10px;height:10px;fill:currentColor}
#sound-toggle:hover{background:#231a10;border-color:#b88c4d}
#sound-toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* A dedicated portrait recording fills phones, too. */
@media (max-width:759px){
  .art img,.art video{object-position:50% 50%}
  form{flex-direction:column}
  .say span{display:block}
}
@media (prefers-reduced-motion:reduce){.art video{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1><img src="/brand/wordmark-brass-rocket-transparent.png" width="2172" height="724" alt="Shiptorio"></h1>
    <p class="say foundry-tagline">Build the factory, ship the code.</p>
  </div>

  <div class="art">
    <picture>
      <source media="(max-width: 759px)" srcset="/welcome/factory-phone-poster.webp" width="600" height="800">
      <img src="/welcome/factory-poster.webp" srcset="/welcome/factory-poster-1024.webp 1024w, /welcome/factory-poster.webp 1600w" sizes="100vw" width="1600" height="900" alt="" fetchpriority="high">
    </picture>
    <video id="loop" muted loop playsinline preload="none" aria-hidden="true"></video>
  </div>

  <div class="bottom">
    <button class="go" id="open-signup" type="button" aria-haspopup="dialog">Join the waitlist</button>
  </div>
  <div class="media-controls">
    <button type="button" id="toggle" hidden aria-label="Pause the factory"></button>
    <button type="button" id="sound-toggle" hidden aria-label="Unmute game music and sounds" aria-pressed="false" title="Unmute game music and sounds"></button>
  </div>
  <audio id="game-audio" loop preload="none"></audio>
  <a class="factory-entry" href="/access?next=%2F">Enter the factory</a>
</main>
<dialog class="signup-dialog" id="signup-dialog" aria-label="Join the waitlist">
    <form id="join" action="/api/waitlist" method="post" novalidate>
      <label class="sr" for="email">Email address</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" maxlength="254" required autofocus>
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <button class="go" type="submit">Join</button>
    </form>
    <p class="note" id="note" role="status" aria-live="polite"></p>
</dialog>
<!-- Update the version when landing.js changes; public assets are cached for an hour. -->
<script src="/welcome/landing.js?v=e9976526625a" defer></script>
</body>
</html>
